# Manyworlds control plane on Fly.io: the always-on services that used to run on the laptop
# (docker compose --profile live). No HTTP service: each process group is a long-running loop.
# Secrets (DATABASE_URL, R2, Claude, Apify, GPU provider keys) live in `fly secrets`, never here.
# What actually runs is gated by policy `operations.mode` (paused: only test jobs and bench- batches).
#
# Never run two autoscalers: keep `autoscaler` at one machine and the laptop stack down.
#   fly deploy --remote-only --ha=false   # build on Fly (no local Docker); one machine per group
#   fly ssh console -C "mw status"

app = "manyworlds-mw"
primary_region = "iad"     # next to Neon us-east-2

[build]
  dockerfile = "Dockerfile"

[env]
  MW_POLICY = "policy/default.yaml"
  LOG_LEVEL = "INFO"

# The image's ENTRYPOINT is `mw`; each command below is its arguments.
[processes]
  autoscaler = "autoscale"
  brain = "brain worker --loop"
  reviewer = "review --loop"
  producer = "produce --loop"
  # Jobs a hosted API renders (no GPU): it polls the host and downloads the result. While operations are
  # paused it takes only test and benchmark batches, like the GPU machines.
  hosted = "worker --pool hosted --kinds hosted.video"
  # The trend watcher (manyworlds.research.trends): runs only while policy trends.enabled; at most trends.daily_usd_max.
  trends = "trends loop"
  # The finisher (production.finish_mode: queue): video finishing (mix, grade, captions, cover) as finish.video jobs and
  # the join of a long talking video's takes as finish.join jobs and song measurements as finish.measure_song jobs, off
  # the producer's loop. The autoscaler starts its stopped machine while finish jobs wait (ensure_finisher; the
  # machine is never created there, only by deploy) and the worker exits once its queue has been empty for
  # gpu_pools.fly_finisher.idle_exit_seconds, so the machine stops until the next finish. After a deploy (which may
  # start it), a run the autoscaler did not register is refused at start and stopped by the enforcer.
  finisher = "worker --pool fly_finisher --kinds finish.video,finish.join,finish.measure_song,finish.measure_video"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["autoscaler", "brain", "reviewer", "producer", "hosted", "trends"]

# The finisher encodes 1080x1920 video: two dedicated CPUs and 4 GB, billed only while it runs.
[[vm]]
  size = "performance-2x"
  memory = "4gb"
  processes = ["finisher"]

[[restart]]
  policy = "always"
  retries = 10
  processes = ["autoscaler", "brain", "reviewer", "producer", "hosted", "trends"]

# A clean exit (its queue is empty) leaves the finisher stopped; only a crash restarts it.
[[restart]]
  policy = "on-failure"
  retries = 3
  processes = ["finisher"]
