# The aesthetics library (manyworlds.brain.aesthetics; policy `brain.aesthetics.file`).
#
# What makes a creator's feed aspirational rather than a row of straight-on portraits: a vocabulary of shot types
# (most of them without her face), the rules that keep a style consistent while outfits and places change, the
# photo-dump order, and the carousel templates the slide renderer draws (manyworlds.slides).
# Grounded in docs/research/2026-11-24-creator-aesthetics.md. The mixes are starting priors, not findings.
#
# Each shot: category, face (yes | partial | no), subject (what of her is in frame: face, hands, back, figure,
# reflection, feet, shadow, none), framing (how it is shot and lit), use (where it belongs).
# A shot whose face is not `yes` is drawn without her face and is never judged on identity (direction.faceless).
version: aesthetics-v1

shots:
  # detail and hands
  ringed_hand_glass:      {category: detail_hands, face: "no", subject: hands, framing: "close-up of a ringed hand holding a glass, soft bokeh behind, warm side or golden light", use: "dinner, bar, the middle of a travel dump"}
  hand_coffee_table:      {category: detail_hands, face: "no", subject: hands, framing: "top-down or 45 degrees, a cup in her hand on a textured table, window light", use: "morning, cafe, slow living"}
  hand_turning_page:      {category: detail_hands, face: "no", subject: hands, framing: "close, a book open on her lap or a table, her fingers on a page, soft daylight", use: "slow living, reading"}
  hands_keyboard_topdown: {category: detail_hands, face: "no", subject: hands, framing: "top-down desk, laptop, coffee and notebook, her hands typing", use: "a work day, educator b-roll"}
  jewellery_closeup:      {category: detail_hands, face: "partial", subject: hands, framing: "macro on wrist, neck or ear with her signature jewellery, shallow depth of field", use: "fashion detail, the signature item"}
  hands_making:           {category: detail_hands, face: "no", subject: hands, framing: "close on her hands mid-task (kneading, pouring, stitching, potting)", use: "maker, food, process reels"}
  # back and silhouette
  walk_away_sunset:       {category: back_silhouette, face: "no", subject: back, framing: "full body from behind walking away down a street or path, backlit golden hour, a little lens flare", use: "travel, mood, an alternative cover"}
  balcony_lookout:        {category: back_silhouette, face: "no", subject: back, framing: "from behind or three-quarter back at a railing, the view filling two thirds of the frame", use: "hotel, city, travel"}
  over_shoulder_view:     {category: back_silhouette, face: "partial", subject: back, framing: "over her shoulder, hair and shoulder soft in the foreground, what she looks at in focus", use: "arrival, a menu, a view, a screen"}
  doorway_silhouette:     {category: back_silhouette, face: "no", subject: back, framing: "her figure dark against a bright doorway or window", use: "editorial, moody grades"}
  hair_motion_back:       {category: back_silhouette, face: "no", subject: back, framing: "medium from behind, hair or dress moving in the wind", use: "fashion, beach"}
  # scenery
  window_view:            {category: scenery, face: "no", subject: none, framing: "the window frame and sill in shot, the outside exposed bright", use: "arrival, morning, a rainy day"}
  street_blue_hour:       {category: scenery, face: "no", subject: none, framing: "eye-level street at blue hour, lit windows, wet pavement", use: "city, the tail of a dump"}
  tiny_figure_landscape:  {category: scenery, face: "no", subject: figure, framing: "wide landscape or plaza with her small in the frame for scale, rule of thirds", use: "travel hero, a reel opener"}
  architecture_detail:    {category: scenery, face: "no", subject: none, framing: "tight on a facade, tiles or a door, flat even light", use: "city, the middle of a dump"}
  sky_through_leaves:     {category: scenery, face: "no", subject: none, framing: "low angle up through leaves, dappled light", use: "slow-living transitions"}
  # food and drink
  table_flatlay_hands:    {category: food_drink, face: "no", subject: hands, framing: "top-down table with several plates, hands reaching in", use: "dinner with friends, the middle of a dump"}
  plate_45:               {category: food_drink, face: "no", subject: none, framing: "one dish at 45 degrees, window side light", use: "food posts, recipes"}
  drink_against_view:     {category: food_drink, face: "no", subject: hands, framing: "a glass held up, the view soft behind it", use: "travel, aperitivo"}
  coffee_window_shadow:   {category: food_drink, face: "no", subject: none, framing: "cup and pastry on a table, hard window shadows across them", use: "morning, slow living"}
  market_produce:         {category: food_drink, face: "no", subject: hands, framing: "close on a market stall, her hand choosing fruit", use: "food, travel"}
  after_the_meal:         {category: food_drink, face: "no", subject: none, framing: "top-down table after dinner: crumbs, half-empty glasses, candles burned low", use: "night, the tail of a dump"}
  # objects and still life
  nightstand_still_life:  {category: objects_still_life, face: "no", subject: none, framing: "eye level, lamp light, a book, a glass and jewellery on a nightstand", use: "night routine, beauty"}
  beach_towel_objects:    {category: objects_still_life, face: "no", subject: none, framing: "top-down towel with sunglasses, a book and fruit", use: "summer, travel"}
  vanity_tray:            {category: objects_still_life, face: "no", subject: none, framing: "top-down or 45 degrees, unbranded products and a perfume bottle on a tray", use: "beauty, a GRWM cover"}
  flowers_vase:           {category: objects_still_life, face: "no", subject: none, framing: "medium shot of flowers in a vase, window light", use: "home, slow living"}
  suitcase_packing:       {category: objects_still_life, face: "no", subject: none, framing: "top-down open suitcase with folded outfits", use: "a travel teaser, an outfit reveal"}
