  mirror_outfit_phone:    {category: mirror_self, face: "partial", subject: reflection, framing: "full-length mirror, the phone held up in front of her face", use: "outfit of the day, slide 2 of a dump"}
  mirror_outfit_face:     {category: mirror_self, face: "yes", subject: face, framing: "full-length mirror with her face visible", use: "an outfit cover"}
  elevator_mirror:        {category: mirror_self, face: "partial", subject: reflection, framing: "lift mirror, on-camera flash, metal walls", use: "a night out, a hotel"}
  bathroom_grwm:          {category: mirror_self, face: "yes", subject: face, framing: "waist-up at the bathroom mirror, vanity light (an anchor set)", use: "beauty, talking while getting ready"}
  shadow_selfie:          {category: mirror_self, face: "no", subject: shadow, framing: "her shadow on a wall or the ground in hard sun", use: "dump filler, mood"}
  shopwindow_reflection:  {category: mirror_self, face: "partial", subject: reflection, framing: "her reflection laid over the street in a shop window", use: "city"}
  # motion and candid
  blurred_walk:           {category: motion_candid, face: "partial", subject: figure, framing: "slow-shutter motion blur as she walks down a street", use: "fashion, slide 3 of a dump"}
  mid_laugh_candid:       {category: motion_candid, face: "yes", subject: face, framing: "medium, looking off camera, mid-laugh", use: "personality, slide 3 of a dump"}
  flash_night:            {category: motion_candid, face: "yes", subject: face, framing: "direct on-camera flash, hard shadow behind, digicam look", use: "a night out, the tail of a dump"}
  car_passenger:          {category: motion_candid, face: "no", subject: hands, framing: "her hands and knees in a car seat, the window and passing light", use: "travel, transit"}
  shoes_cobblestones:     {category: motion_candid, face: "no", subject: feet, framing: "top-down at her shoes on textured ground", use: "outfit detail, travel"}
  dress_spin:             {category: motion_candid, face: "partial", subject: figure, framing: "full body, the fabric in motion, face turned or blurred", use: "fashion reel or carousel"}
  taxi_exit:              {category: motion_candid, face: "no", subject: feet, framing: "low angle, one leg and shoe stepping out of a car door", use: "arrival, an event"}
  # portraits: the face anchors
  outfit_full_body:       {category: portrait, face: "yes", subject: face, framing: "full body, eye level or slightly low, the location behind", use: "a cover"}
  portrait_off_camera:    {category: portrait, face: "yes", subject: face, framing: "waist-up, gaze off camera, natural light", use: "a cover, aspirational"}
  talking_anchor:         {category: portrait, face: "yes", subject: face, framing: "medium close-up in a fixed home set, key light plus window", use: "talking, podcast, GRWM"}

# How each subject is written into a prompt when the face is not shown ({hands}: her skin and signature details).
subjects:
  hands: "her hands and forearms in frame, {hands}"
  back: "seen from behind, her face turned away from the camera: her hair, shoulders and figure, {hands}"
  figure: "her whole figure small in the frame, too far away or too blurred to make out her face"
  reflection: "her reflection in a mirror, her phone held up in front of her face, her hair and outfit visible"
  feet: "her feet and lower legs in frame"
  shadow: "her shadow cast on the ground or a wall"
  none: ""

# Grade families a creator's style picks one of: the words added to every image prompt of hers (one feed, one look).
grades:
  raw_phone: "natural phone colour, true-to-life white balance"
  warm_film: "warm film tones, soft highlights, fine grain"
  soft_pastel_grain: "soft pastel tones, lifted shadows, light grain"
  moody_grain: "muted moody tones, deep shadows, visible grain"
  flash_digicam: "direct compact-camera flash look, crisp shadows, slight grain"
  clean_bright: "clean bright daylight, airy whites, gentle contrast"

rules:
  consistency: >-
    What stays the same: her face and appearance, her style (silhouettes, fabrics, colours she wears), one grade
    family, a palette of 3-5 colours, 2-3 signature items that appear in about a third of the posts that show her,
    3-5 recurring motifs, and 1-2 anchor sets (the home spaces where she talks, gets ready or records). Her tastes
    (foods, drinks, places) recur in props and captions.
  variety: >-
    What changes: outfits (a new one most posts, built from her style; a re-wear only after a week or more, styled
    differently), every place that is not an anchor set (cafes, streets, friends' flats, trips: she travels and has
    a life outside her flat), light and time of day, and shot types. Travel comes in arcs: a trip every 4-6 weeks
    over 4-8 posts, home weeks between.
  carousel: >-
    No shot type twice in a row or more than twice in a carousel; alternate wide and close; at least three shot
    categories; at least one imperfect frame (motion blur, flash, an off-centre crop, grain); her face clearly
    on 2-3 slides at most; gaze off camera in at least half of the face shots.
  anti_tells: >-
    No legible text inside generated images (text goes on as an overlay or a slide); hands close-up only in hand
    shots; a centred smile to camera at most once per carousel and once in three posts.
  signature: >-
    Signature elements are assets, not repeats: a pose, a set or an outfit that her style names as signature, or that
    a pattern card marks signature_ok, may recur across posts and inside a carousel; the variety and carousel rules
    above do not apply to it (owner 2026-11-25). Everything else still varies.

# The photo-dump order (7-10 slides): the cover is the strongest image, never camera-roll order.
photo_dump: [cover_face, context_wide_or_mirror, personality_candid_or_motion, details_3_to_4, tail_night_scenery_or_object]

# Carousel slide templates (manyworlds.slides): 1080x1350, faces and text in the centre 1080x1080.
templates:
  cover: "a photo (her or an aesthetic shot) with a headline of 8 words or fewer over a soft scrim; a swipe cue"
  list_item: "a big numeral, a short heading, one line, a small photo"
  step: "step n of N, a verb heading, one or two lines, a photo of her hands doing it"
  quote: "a pull quote in her voice on a plain colour"
  comparison: "two halves with two labels: this or that, before and after, do and don't"
  recap: "a checklist of every point (the slide people save)"
  cta: "an ask to save or send it to someone, or a question for the comments"
