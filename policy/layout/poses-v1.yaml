# Pose templates for structural control of photos (manyworlds.layout; policy generation.control).
# Synthetic skeletons only: no one's photo or footage is analysed. Each pose is the 18 OpenPose (COCO) keypoints in
# body units: x to the image right, y up, feet on y = 0, a standing body 1.0 tall, x = 0 the body's centre.
# OpenPose "R" is the subject's right: image left when she faces the camera, image right when her back is turned.
# A null keypoint is not drawn (her back: no nose or eyes, which tells the model the face is turned away).
# Order: nose, neck, r_shoulder, r_elbow, r_wrist, l_shoulder, l_elbow, l_wrist, r_hip, r_knee, r_ankle,
#        l_hip, l_knee, l_ankle, r_eye, l_eye, r_ear, l_ear
