# Two-person scenes (plan docs/superpowers/plans/2026-11-22-two-person-scenes.md): InfiniteTalk multi-person in
# WanVideoWrapper (MultiTalkWav2VecEmbeds audio_1..2 + ref_target_masks). OFF; design only, no production changes.
two_person:
  enabled: false
  adapter: InfiniteTalk/Wan2_1-InfiniteTalk-Multi_fp8_e4m3fn_scaled_KJ.safetensors   # Kijai/WanVideo_comfy_fp8_scaled
  max_speakers: 2              # the wrapper's tested path (human_num == 2)
  multi_audio_type: add        # turn-taking: tracks concatenated on one timeline; para only for overlapping speech
  width: 480
  height: 832
  speaker_order: left_to_right # speaker 1 = leftmost face: audio_N binds to mask N, in order
  masks: {dilate: 0.25, min_gap_px: 16, background: false}   # from face boxes; dilate by box size; never touching
  gate:
    min_own_correlation: 0.3   # per-face mouth opening vs the speaker's own audio energy, during that speaker's turn
    max_cross_ratio: 0.6       # the silent face's mouth motion over the speaking face's, during a turn
    max_both_moving_share: 0.2 # share of single-speaker frames where both mouths move

# Claude models by role. Low-volume judgement work runs on Opus; bulk roles
# (captions, first-pass judging) come in later days and can point elsewhere.
llm:
  roles:
    brain: claude-opus-5-5
    research: claude-opus-5-5
    creator: claude-opus-5-5
    judge: claude-opus-5-5
    # The paid second look at close calls (review.image/video.confirm_role) and the finished-file review.
    review_confirm: claude-sonnet-5-5
    # Qwen4-Max since 2026-11-22 (owner): blind-judged 5.21 vs Opus 5.15 over 7 batches, no voice-rule breaks, all
    # valid, at a third of the cost. Sonnet answers if it fails; Opus stays as a 10% shadow (llm.shadow.showrunner).
    showrunner: {model: qwen4-max, fallback: claude-sonnet-5-5}   # post ideas, captions, scripts (brain/agents/showrunner.py)
    # Haiku since 2026-11-22 (owner): 16 shadowed calls 0.59 points from Sonnet on average, all valid, at 5% of the
    # cost. Sonnet stays as a 10% shadow (llm.shadow.evaluator) to catch drift.
    evaluator: claude-haiku-5-5      # creative scoring at volume (manyworlds.brain.evaluation)
    evaluator_check: claude-sonnet-5-5   # scores a sample of the same items, to measure agreement (Opus was ~$0.15 a call, 40% of evaluator spend)
    review: claude-haiku-5-5     # first-pass image screen (manyworlds.review); every image
    comment_reply: {model: qwen4-max, fallback: claude-sonnet-5-5}   # replies in the creator's voice (publish/comments.py); same writing as the showrunner
    trend_features: {model: qwen3.8-flash, fallback: claude-haiku-5-5}   # describes public posts from cover, caption, speech (research/trends.py)
    trend_analyst: {model: qwen4-max, fallback: claude-sonnet-5-5}      # the daily niche brief
    # Shot sheets for accepted ideas (manyworlds.brain.director), asked with a strict schema (llm.strict_json_schema).
    director: {model: claude-sonnet-5-5, fallback: claude-haiku-5-5}
    # The talent manager (brain/agents/talent_manager.py): a few calls per creator a week, judgement-heavy.
    talent_manager: {model: claude-sonnet-5-5, fallback: claude-haiku-5-5}
    style_director: {model: claude-sonnet-5-5, fallback: claude-haiku-5-5}
    market_lead: {model: claude-sonnet-5-5, fallback: claude-haiku-5-5}   # one run per active market a week
    # One short call when a failed video ships as its photo (production.reroute_caption): the caption written for
    # the video is rewritten for a still. Haiku: a light edit of text that already exists.
    caption_rewrite: claude-haiku-5-5
    # Comment themes (brain/agents/comment_themes.py): a few themes from a creator's recent comments, at most daily;
    # light summarising, so the cheapest model. Batched (llm.batch.roles): nobody waits on it.
    comment_themes: claude-haiku-5-5
    # One call per idea that scored just under a feed-QA floor (brain/agents/idea_reviser.py): the showrunner's
    # fallback writer, on Claude so it goes through Message Batches at half price; Haiku if it fails.
    idea_revise: {model: claude-sonnet-5-5, fallback: claude-haiku-5-5}
    # Original lyrics for a song post (brain/lyrics.py, policy music.lyrics): one or two calls per song, creative
    # writing in the creator's voice, checked in code (no real artist names, no quoted lines).
    lyricist: {model: claude-sonnet-5-5, fallback: claude-haiku-5-5}
    # The music critic (brain/agents/music_critic.py, music.critic): one call per song, reasoning over measurements,
    # bands, nearest songs and what the listener heard. Judgement, not volume: Sonnet.
    music_critic: {model: claude-sonnet-5-5, fallback: claude-haiku-5-5}
    # The music department's roles (music.roles.<role>.llm_role): judgement roles on Sonnet, the settings roles on Haiku.
    head_of_music: {model: claude-sonnet-5-5, fallback: claude-haiku-5-5}
    a_and_r: {model: claude-sonnet-5-5, fallback: claude-haiku-5-5}
    music_talent_manager: {model: claude-sonnet-5-5, fallback: claude-haiku-5-5}
    music_songwriter: {model: claude-sonnet-5-5, fallback: claude-haiku-5-5}
    music_producer: claude-haiku-5-5
    music_vocal_director: claude-haiku-5-5
    music_melody: claude-haiku-5-5
    music_mix_master: claude-haiku-5-5
    music_curator: claude-haiku-5-5
  server_fallback_models: [claude-opus-5-5, claude-sonnet-5-5, claude-fable-5-2]   # models that take fallbacks: "default"
  usd_per_mtok:                  # input, output, cache_read, cache_write
    claude-opus-5-5:   [4.00, 20.00, 0.20, 5.00]
    claude-sonnet-5-5: [2.00, 10.00, 0.10, 2.50]
    claude-haiku-5-5:  [0.10, 0.50, 0.01, 0.125]
  max_output_tokens: 16000
  # System prompts at least this long go out as a cached block (llm._system): ~1000+ tokens, the smallest prefix
  # the API caches. Shorter ones are sent as plain text (caching would not apply anyway).
  cache_system_min_chars: 4000
  # Open-weight models (manyworlds.llm): a role may name one, as `{model: <open model>, fallback: <Claude model>}`.
  # hosts: OpenAI-compatible endpoints; the key lives in .env/Fly secrets under key_env (never in policy).
  # open_models: id is the host's model name; usd_per_mtok is [input, output]; vision: accepts images.
  # Names and prices must be checked on the host's live pricing page before a model is added here.
  hosts:
    together:  {base_url: https://api.together.xyz/v1, key_env: TOGETHER_API_KEY, timeout_seconds: 120}
    deepinfra: {base_url: https://api.deepinfra.com/v1/openai, key_env: DEEPINFRA_API_KEY, timeout_seconds: 120}
  # Probed live on Together 2026-11-21 (JSON schema valid; vision where marked). Qwen runs through a third-party
  # provider (the owner enabled data sharing in Together's privacy settings) and only answers streamed (`stream`).
  open_models:
    # Kimi thinks before it answers: long outputs timed out at 120 s, and it spent 2.5x Sonnet on one evaluation.
    kimi-k3.1-pro:       {host: together, id: moonshotai/Kimi-K3.1-Pro, usd_per_mtok: [2.00, 10.00], vision: true,
                          timeout_seconds: 300}
    glm-5.3:             {host: together, id: zai-org/GLM-5.3, usd_per_mtok: [1.40, 4.40]}
    glm-5.3-flash:       {host: together, id: zai-org/GLM-5.3-Flash, usd_per_mtok: [0.15, 0.50]}
    deepseek-v4.1-flash: {host: together, id: deepseek-ai/DeepSeek-V4.1-Flash, usd_per_mtok: [0.30, 1.20]}
    minimax-m3.1-flash:  {host: together, id: MiniMaxAI/MiniMax-M3.1-Flash, usd_per_mtok: [0.15, 0.60]}
    nemotron-3.5-vl:     {host: together, id: nvidia/NVIDIA-Nemotron-3.5-Super-VL, usd_per_mtok: [0.15, 0.50], vision: true}
    qwen3.8-flash:       {host: together, id: Qwen/Qwen3.8-Flash, usd_per_mtok: [0.15, 0.47], vision: true, stream: true}
    qwen3.7-plus:        {host: together, id: Qwen/Qwen3.7-Plus, usd_per_mtok: [0.32, 1.28], vision: true, stream: true}
    qwen4-max:           {host: together, id: Qwen/Qwen4-Max, usd_per_mtok: [1.05, 3.15], vision: true, stream: true,
                          timeout_seconds: 300}   # a showrunner batch is a long answer
  #   shape: {host: deepinfra, id: <host model id>, usd_per_mtok: [0.0, 0.0], vision: false, attempts: 2}
  # Shadow tests: a share of a role's calls also go to one of its candidates (open or Claude); compared by
  # `mw llm shadow-report <role>`. No role switches model until its report shows it holds up (owner 2026-11-21:
  # the best model per job at the lowest cost). Candidates were picked from the 2026-11-21 model review.
  shadow:
    showrunner: {candidates: [claude-opus-5-5], share: 0.1}   # quality check on the Qwen4-Max showrunner
    # Kimi out of all trials (owner 2026-11-22): it timed out often, cost the most, and lost its trials.
    # Sonnet added 2026-11-23: the low-risk step down from Opus (half the price) beside the open models.
    brain:      {candidates: [glm-5.3, qwen4-max, claude-sonnet-5-5], share: 0.2}   # strategist, analyst
    creator:    {candidates: [qwen4-max, glm-5.3], share: 0.2}   # creator bibles and profiles (rare)
    evaluator:  {candidates: [claude-sonnet-5-5, qwen3.8-flash], share: 0.1}   # drift check on the Haiku evaluator
    review:     {candidates: [nemotron-3.5-vl, qwen3.8-flash], share: 0.2}
    judge:      {candidates: [qwen4-max, qwen3.7-plus], share: 0.2}   # judging sends images: vision models only
    # The open-ended Sonnet roles (2026-11-23): judged by preference (llm.selection), so they can move too.
    director:       {candidates: [qwen4-max, glm-5.3], share: 0.15}
    talent_manager: {candidates: [qwen4-max, glm-5.3], share: 0.2}
    style_director: {candidates: [qwen4-max, glm-5.3], share: 0.2}
    market_lead:    {candidates: [qwen4-max, glm-5.3], share: 0.2}
  shadow_usd_per_day: 0.5
  shadow_request_chars: 12000   # the end of the request kept with each shadow row, for preference judging
  # Message Batches (manyworlds.llm_batch, 2026-11-23): on the brain worker, every call a brain job makes is journaled
  # (a rerun replays it for nothing) and the roles below, on a Claude model, go through Anthropic's batch API at
  # half price; the job steps aside until its answer lands (most within the hour). Only work nobody waits on by the
  # second: never the director, review or comment replies (those run outside brain jobs anyway).
  batch:
    enabled: true
    roles: [evaluator, evaluator_check, brain, talent_manager, style_director, market_lead, comment_themes, idea_revise, head_of_music, a_and_r, music_curator]   # music: nobody waits on the slate, pitches or a release
    discount: 0.5              # the batch price as a share of the standard one (Anthropic pricing, checked 2026-11-23)
    gather_seconds: 30         # wait this long for other jobs' calls so they share a batch
    max_requests: 1000         # per batch (the API takes up to 100,000)
    poll_seconds: 60           # how often an open batch is checked
    requeue_seconds: 900       # a waiting job's fallback wake-up; the flusher wakes it as soon as its answer lands
    max_wait_minutes: 120      # a batched call not answered by then is asked directly (the job won't wait all day)
    near_match_min: 0.9        # a rerun's prompt that changed a little still matches its row (word overlap)
    flush_lease_seconds: 300
    keep_days: 14
  # A call to an open model that times out or drops is billed by the host but returns no usage: the ledger records
  # an estimate (prompt characters / chars_per_token in, output_tokens out) so it matches the host's bill.
  failed_call_estimate: {chars_per_token: 4, output_tokens: 3000, image_tokens: 1500}
  # Model selection (manyworlds.selection): once a day the autoscaler's loop turns shadow evidence into proposals
  # (approvals): switch a role to the cheapest candidate that qualifies. It reads stored evidence only; judging
  # generative answers (quality mode) spends and runs with `mw llm judge <role> --usd N`. The owner approves.
  override_cache_seconds: 60   # how often each service re-reads approved role switches
  selection:
    every_hours: 24
    days: 14                    # evidence window
    rejected_cooldown_days: 14  # a rejected switch is not proposed again for this long
    max_cost_ratio: 0.7         # at least 30% cheaper per call, or it isn't worth a switch
    min_valid: 0.95
    roles:
      evaluator:  {mode: agreement, min_calls: 30, max_mean_abs_diff: 1.0}
      review:     {mode: agreement, min_calls: 30, max_mean_abs_diff: 1.0, min_agreement: 0.9}
      judge:      {mode: agreement, min_calls: 20, max_mean_abs_diff: 1.0, min_agreement: 0.9}
      brain:      {mode: agreement, min_calls: 20, min_agreement: 0.85}
      showrunner: {mode: quality, min_calls: 10, min_judged: 8, items: ideas, rubric: idea, max_items: 6,
                   max_score_drop: 0.3}
      # Open-ended answers (2026-11-23): `mw llm judge <role> --usd N` has the judge model (Opus, another family
      # than both the Sonnet primary and the open candidates) compare each pair blind; a candidate qualifies when it
      # is no worse in min_not_worse of the judged calls.
      director:       {mode: preference, min_calls: 10, min_judged: 8, min_not_worse: 0.8, judge_role: judge}
      talent_manager: {mode: preference, min_calls: 10, min_judged: 8, min_not_worse: 0.8, judge_role: judge}
      style_director: {mode: preference, min_calls: 10, min_judged: 8, min_not_worse: 0.8, judge_role: judge}
      market_lead:    {mode: preference, min_calls: 10, min_judged: 8, min_not_worse: 0.8, judge_role: judge}

# Logs (manyworlds.logs): one JSON object a line (ts, level, logger, msg, role, process group, and the post/job/
# attempt/creator/kind being worked on) when json is true or MW_LOG_JSON=1; plain text otherwise (MW_LOG_JSON=0 forces it).
logging: {json: true}

# Event-driven wakeups (manyworlds.wakeup, migration 033): a trigger on jobs NOTIFYs 'mw_jobs' (insert; status to
# done/failed/dead) and one on reviews NOTIFYs 'mw_reviews'. The producer and reviewer wait for a matching one or
# their usual sleep, whichever is first; a burst within debounce_seconds of the first is one tick. A listener that
# can't connect falls back to plain sleep and tries again after reconnect_seconds.
wakeups:
  enabled: true
  debounce_seconds: 2
  reconnect_seconds: 60
  refresh_seconds: 900   # renew the listening connection this often (a silently dropped one only times out)
  producer: {jobs: [done, failed, dead], reviews: true}   # a post moves on when its jobs finish and are reviewed
  reviewer: {jobs: [done], reviews: false}                # new outputs to review

queue:
  lease_seconds: 120          # a worker that stops heartbeating loses its job after this
  max_attempts: 3              # per job, then it is marked dead and reported
  worker_max_consecutive_faults: 3   # GPU faults in a row before a worker exits for a restart
  job_max_worker_faults: 6           # a job that faults this many machines fails (it's the cause)
  connect_timeout_seconds: 20        # a rented host that can't reach the database fails fast
  startup_connect_attempts: 3        # then the worker destroys its own machine (Vast/RunPod)
  retry_backoff_seconds: 30          # a failed job waits attempts x this before it can be claimed again

publishing:
  max_late_hours: 6            # a real post later than this is left ready, not sent in a burst with others
  # JPEG copies made for Instagram (public/ in the bucket) are deleted this many days after their post was published,
  # held or dropped (manyworlds.publish.public_copies, from the autoscaler's housekeeping).
  public_copy_keep_days: 7
  public_copy_purge_batch: 200   # posts per housekeeping tick

# Instagram (manyworlds.publish.instagram, metrics, comments), per Meta's docs v27.0 (read 2026-11-21).
# login unified: the Instagram API with Unified Login on graph.facebook.com, one Business Integration System User
# token (env token_env) for every professional account assigned to our app in the business portfolio; Standard
# Access is enough for our own accounts. `instagram` login (a token per account, graph.instagram.com) still works.
# quota_fallback: used only when Meta's content_publishing_limit doesn't say (it reads 50 a day today).
# ramp: posts a day a newly connected account may publish, by days since it was connected (null: no ramp limit);
# the planner plans no more than this, so nothing is made that can't go out.
instagram:
  login: unified
  token_env: META_SYSTEM_USER_TOKEN
  hosts: {unified: graph.facebook.com, instagram: graph.instagram.com}
  version: v27.0
  url_seconds: 3600
  max_attempts: 3              # attempts per post, then held
  quota_fallback: 50
  ramp:
    - {from_day: 0, posts_per_day: 1}
    - {from_day: 7, posts_per_day: 2}
    - {from_day: 21, posts_per_day: null}
  # The setup sheet (`mw account sheet <creator>`) a person follows to make the account by hand; `mw account
  # connect` then checks it through the API (disclosure in the bio required; photo and name warned).
  setup:
    bio_max_chars: 150
    photo_url_seconds: 604800
    checklist:
      - "Create the Instagram account with the username, display name, bio and profile photo on this sheet."
      - "Switch it to a professional account (Creator), and turn on Instagram's AI-generated label where the profile settings offer it."
      - "Add the account to our Meta business portfolio (Business Settings > Accounts > Instagram accounts)."
      - "Assign it to our app's system user with content publishing and comment permissions."
      - "Never follow, like or comment on our other creators' accounts."

# Comments on our posts (manyworlds.publish.comments), answered in the creator's voice when autonomy.comment_replies
# is draft (stored for the owner to read, `mw comments <handle>`) or autonomous (sent).
comments:
  watch_days: 7                # read comments on posts this young
  poll_minutes: 30             # per post
  polls_per_tick: 20
  max_age_hours: 48            # older comments are not answered
  keep_days: 30                # comment text cleared after this (commenters are only ever salted hashes)
  batch: 20                    # comments per LLM call (one call per creator per tick)
  creators_per_tick: 10
  max_replies_per_account_day: 30
  max_chars: 220

simulation:
  # Sandbox learning tests (manyworlds.brain.simulation). fast_forward also publishes planned posts
  # without making them, so the loop can be exercised in minutes; never applies to real creators.
  fast_forward: false
  ages_s: [3600, 21600, 86400, 259200]   # observation ages, matched by real ingestion (M4)

autonomy:
  # autonomous (approved 2026-11-14) | human_approval | sampled | paused (the kill switch: nothing is published)
  publish: autonomous
  comment_replies: draft        # disabled | draft (replies stored for the owner to read) | autonomous (sent)

limits:                        # bounds the Brain may not cross without a human
  daily_usd_max: 100.0
  max_attempts_max: 5
