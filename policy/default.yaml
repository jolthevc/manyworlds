# Manyworlds policy file. Every number here is a starting value, not a constant:
# the Brain may propose changes, and changes beyond `limits` need a human.
# Each decision and cost entry records the hash of the policy it ran under.

budgets:
  # No new GPU machine starts once today's whole bill (machines, LLM calls, data; UTC) reaches this
  # (manyworlds.deploy.autoscale). GPU alone is capped by gpu_runs.daily_gpu_usd; Brain LLM calls by
  # brain.llm_usd_per_day per agent. Machines already running keep their own deadline and spend cap.
  daily_usd: 25.0

# Storage retention (manyworlds.retention): rejected media (and a rejected clip's keyframes and voice line) older than
# retention_days is deleted once a day; anything a post or creator names is kept. ~60 MB a creator a day otherwise.
storage: {retention_days: 30, every_hours: 24, max_deletes_per_run: 5000}

# Fixed monthly charges, accrued to the ledger daily (usd_per_month / 30, category fixed) by the autoscaler loop.
fixed_costs:
  - {provider: "runpod:volume:mw-weights-us-nc-1", usd_per_month: 10.50}   # 150 GB standard at $0.07/GB, 2026-11-22

# Rented GPU machines. The autoscaler (manyworlds.deploy.autoscale) starts them when jobs
# wait and registers each with a deadline and spend cap first. Three independent layers
# stop them: the always-on autoscaler, the same tick on GitHub Actions, and workers on
# Vast/RunPod destroying their own machine when idle or past deadline.
gpu_runs:
  default_max_hours: 2
  default_max_usd: 1.0
  max_hours_by_family: {train: 3, talk: 2.5, comfy: 2.5, edit: 2, dance: 2, finish: 2}   # train: boot + model download + ~1h of training; talk: ~94 GB of weights first
  max_usd_by_family: {talk: 3.0, comfy: 3.0, edit: 3.0, dance: 3.0, finish: 0.25}   # an L40S at ~$1.09/h for its 2.5 h limit (full-precision download, load, renders); edit: an L40S for 2 h, or an H100 for ~1 h; finish: the finisher for its 2 h at ~$0.09/h, with room
  max_hours_limit: 12          # the launcher refuses anything longer
  idle_stop_minutes: 20        # no open jobs for this long -> stop (SaladCloud: nodes pull images slowly)
  # Vast/RunPod machines start and load models in ~4-5 min, so idling longer than that costs
  # more than starting a fresh one when work returns.
  idle_stop_minutes_by_provider: {vast: 5, runpod: 5, fly: 5}   # fly: the finisher starts in seconds
  # Nothing producing, nothing planned within reach, no job queued anywhere: no real work can come, so an idle
  # machine stops after this instead (production.pull_forward.demand).
  idle_stop_minutes_no_demand: 2
  boot_grace_minutes: 45       # until its first job, a machine may take this long (image pull + model download)
  boot_grace_minutes_by_provider: {runpod: 20, vast: 30, fly: 5}   # working machines started within 8 / 21 min (2026-11-14); fly: the finisher boots in seconds
  stuck_minutes: 10            # started work, jobs waiting, no heartbeat or attempt this long -> stop
  # One attempt running longer than this stops its machine (a stalled model download heartbeats
  # fine but never finishes). A first image job, model download included, takes ~5-6 min on Vast.
  max_attempt_minutes_by_family: {default: 20, video: 45, train: 240, talk: 90, comfy: 60, voice: 45, edit: 60, finish: 30}   # talk: first boot downloads ~90 GB of weights; voice: ~8 GB; edit: ~58 GB
  # image.mirror: one-time copy into our bucket; resumes across machines. talk.longcat: one continuous take of up to
  # generation.talk_profiles.longcat16.max_seconds (a 90 s line: ~47 GB of weights, then ~28 segments; estimate
  # ~60-100 min on an L40S, unmeasured), so its render timeout_s plus the download fit inside it.
  # music.convert_voice: the first job downloads the SVC weights; music.train_voice: RVC v2, 200 epochs on ~20 min of singing
  max_attempt_minutes_by_kind: {image.mirror: 120, talk.longcat: 180, music.convert_voice: 45, music.train_voice: 150}
  daily_gpu_usd: 10.0          # all groups together, billed, per UTC day
  serverless_idle_exit_seconds: 20   # a serverless request's worker returns once no job is left for this long

# Where GPU work runs. Prices are per GPU-hour (Nov 2026 snapshots; re-check).
# The router prefers the cheapest pool that can run the job kind.
gpu_pools:
  salad_batch_4090:  {provider: salad,  gpu: rtx4090, usd_per_hour: 0.16, interruptible: true}
  salad_batch_3090:  {provider: salad,  gpu: rtx3090, usd_per_hour: 0.09, interruptible: true}
  # Vast is a marketplace: usd_per_hour is the most we'll pay; the machine's actual
  # price (from Vast's instance listing, storage included) is what gets metered.
  # worker_env: Linux hosts have the whole card free, so image workers load the full model
  # (no CPU offload) when 22 GB is free; 24 GB cards report ~25 GB.
  vast_3090:         {provider: vast,   gpu: rtx3090, usd_per_hour: 0.20, interruptible: false, worker_env: {MW_OFFLOAD_BELOW_GB: 22}}
  vast_4090:         {provider: vast,   gpu: rtx4090, usd_per_hour: 0.40, interruptible: false, worker_env: {MW_OFFLOAD_BELOW_GB: 22}}
  vast_5090:         {provider: vast,   gpu: rtx5090, usd_per_hour: 0.50, interruptible: false, worker_env: {MW_OFFLOAD_BELOW_GB: 22}}
  runpod_comm_3090:  {provider: runpod, gpu: rtx3090, usd_per_hour: 0.22, interruptible: false, worker_env: {MW_OFFLOAD_BELOW_GB: 22}}
  runpod_comm_4090:  {provider: runpod, gpu: rtx4090, usd_per_hour: 0.34, interruptible: false, worker_env: {MW_OFFLOAD_BELOW_GB: 22}}
  # Secure cloud A40 (48 GB): RunPod community had no CUDA>=12.8 capacity on 2026-11-20; for talking video.
  runpod_secure_a40: {provider: runpod, gpu: a40, usd_per_hour: 0.60, interruptible: false, cloud: SECURE}
  # Secure L40S (48 GB VRAM, ~125 GB RAM): the full-precision talk model with the 4-step LoRA (talk_profiles.fast).
  # Price from 2026-11-20; the machine is metered at what RunPod reports once it runs.
  runpod_secure_l40s: {provider: runpod, gpu: l40s, usd_per_hour: 1.09, interruptible: false, cloud: SECURE}
  # The same card with the weights volume (mw-weights-us-nc-1, 150 GB standard, ~$10.50/month, created 2026-11-22):
  # talk weights are downloaded once onto it, then every machine loads them. Only in US-NC-1 (volume's data centre;
  # L40S capacity there was LOW on 2026-11-22), so the pool without the volume stays behind it as a fallback.
  # RunPod Serverless (manyworlds.deploy.serverless): per-second, scales to zero; inactive until endpoint_id is set
  # (creating the endpoint is an owner decision). A pool serves a kind when it comes first in that kind's pools.
  # usd_per_second must be checked on RunPod's serverless pricing before an endpoint is created.
  runpod_serverless_l40s: {provider: runpod_serverless, gpu: l40s, endpoint_id: null, usd_per_second: 0.0,
                           max_concurrency: 3, max_request_minutes: 60}
  # Secure H100 SXM (80 GB): the full-precision talk model on the card with no offloading, which ran out of memory
  # on a 48 GB L40S (2026-11-22). Ceiling $3/h: a pod RunPod prices above it is destroyed at once.
  runpod_secure_h100: {provider: runpod, gpu: h100, usd_per_hour: 3.00, interruptible: false, cloud: SECURE}
  runpod_secure_l40s_vol: {provider: runpod, gpu: l40s, usd_per_hour: 1.09, interruptible: false, cloud: SECURE,
                           network_volume: {id: 2pu9smb8gw, data_center: US-NC-1, path: /models}}
  local:             {provider: local,  gpu: none,    usd_per_hour: 0.0,  interruptible: false}
  # Hosted APIs (Together): jobs run on the control plane (fly.toml process `hosted`); the host bills per output
  # (ledger `hosted_api`), so no machine is rented and nothing idles.
  hosted:            {provider: local,  gpu: none,    usd_per_hour: 0.0,  interruptible: false}
  # The finisher (finish.video: production's finish encodes, worker/handlers/finish_video.py): a machine of this Fly app
  # (fly.toml process `finisher`, performance-2x, 4 GB) that the autoscaler starts while finish jobs wait
  # (deploy/autoscale.ensure_finisher: it starts the stopped machine of `process_group`, never creates one) and that
  # exits once its queue has been empty for idle_exit_seconds. usd_per_hour is an ESTIMATE for performance-2x with 4 GB
  # (2026-11-23): the owner should confirm it on Fly's pricing page (fly.io/docs/about/pricing).
  fly_finisher:      {provider: fly,    gpu: none,    usd_per_hour: 0.09, interruptible: false, process_group: finisher,
                      idle_exit_seconds: 120, deploy_grace_seconds: 60}   # grace: see cli worker (fly deploy)

# Job kinds and the pools allowed to run them. The autoscaler orders them by measured cost
# per accepted output (autoscale.scoring); this order only breaks ties and decides which
# unmeasured pool is tried first.
# RunPod community 4090s are out of the defaults: three pods in a row failed every job with "CUDA
# unknown error" (2026-11-13). runpod_comm_3090 is the last-resort pool (Vast ran out of credit on
# 2026-11-14): it gets a bounded trial and pauses itself if its machines fail too.
# SaladCloud A5000s were dropped too (2026-11-13): SaladCloud's 3090 and 4090 cost $0.023-0.025 per
# accepted image against Vast 3090's $0.0027 (same Windows consumer nodes), so its trial isn't worth it.
job_kinds:
  # salad_batch_3090 is out (2026-11-21): its machines never finished a job (attempt timeouts, never started).
  image.zimage:    {pools: [vast_3090, vast_4090, runpod_comm_3090, salad_batch_4090], outputs_per_job: 4}
  # Reference-conditioned scene photos (Qwen-Image-Edit-2511 bf16 + 4-step Lightning LoRA, handlers/image_qwen_edit.py,
  # policy `sets.edit`): ~58 GB of weights, so 48-80 GB cards only. Its jobs are pinned to these pools (creator.sets),
  # so the 24 GB image machines never take one. Not benchmarked yet. Its own worker family (`edit`, worker_images.edit):
  # its own machine limits, and the no-output guard counts its machines apart, so failing edit machines can't stop
  # Z-Image work (and image machines don't list the kind).
  image.qwen_edit: {pools: [runpod_secure_l40s, runpod_secure_h100], outputs_per_job: 4, family: edit}
  image.mirror:    {pools: [vast_3090, vast_4090, runpod_comm_3090], outputs_per_job: 0}   # copies model weights into R2 once
  image.narrated:  {pools: [vast_3090, vast_4090, runpod_comm_3090], outputs_per_job: 1}   # CPU edit (voice + ffmpeg) on image machines
  # video.wan_i2v (diffusers Wan 2.2 TI2V-5B, ~14 min a 5 s clip on a 3090; FastWan: 0 of 10 clips passed) retired
  # 2026-11-22: story clips are comfy.wan_i2v (ComfyUI, Wan 2.2 I2V A14B + lightx2v), with hosted.video as fallback.
  image.voice:     {pools: [vast_3090, vast_4090, runpod_comm_3090], outputs_per_job: 1}   # Kokoro voice sample on image machines
  train.lora:      {pools: [vast_3090, vast_4090, runpod_comm_3090, salad_batch_4090], outputs_per_job: 1}
  # Lip-synced talking video (InfiniteTalk on Wan2.1-I2V-14B). Benchmark first (M10): 24-32 GB cards, fp8 / low-VRAM mode.
  # fp8 + block swapping fits 24 GB cards: the volume L40S first (weights cached), then by price.
  talk.infinitetalk: {pools: [runpod_secure_l40s_vol, runpod_comm_3090, vast_4090, runpod_secure_l40s, vast_5090, runpod_secure_a40, runpod_comm_4090, runpod_secure_h100], outputs_per_job: 1}
  # One continuous talking take (worker/handlers/talk_longcat.py): LongCat-Video-Avatar 1.6 on its own repo, settings
  # generation.talk_profiles.longcat16. INT8 on a 48 GB card, bf16 on 80 GB; ~47-63 GB of weights at the first job,
  # onto the container disk, not the 150 GB weights volume (it holds the ComfyUI talk, story-clip and voice weights;
  # longcat16.weights_on_volume). Only the long-take comparison (manyworlds.long_take) queues it. Not run on a GPU yet.
  talk.longcat: {min_vram_gb: 44, pools: [runpod_secure_l40s_vol, runpod_secure_l40s, runpod_secure_h100], outputs_per_job: 1}
  # Image-to-video on a hosted API (worker/handlers/hosted_video.py; generation.hosted_video).
  hosted.video:    {pools: [hosted], outputs_per_job: 1}
  # The finish of a made video (production.finish_mode: queue): ffmpeg on the finisher, no GPU. Its outputs are the
  # post's (written by the producer), so the job itself has none.
  finish.video:    {pools: [fly_finisher], outputs_per_job: 0}
  # The join of a long talking video's takes (production.talk.advance_join, while finish_mode is queue): normalised and
  # joined on the finisher, not the producer's shared CPU (2026-11-23: it timed out there on every loop).
  finish.join:     {pools: [fly_finisher], outputs_per_job: 0}
  # A song's measurements (manyworlds.songs, music.measure.mode queue): librosa on the finisher's 4 GB, not the producer's
  # 512 MB (2026-11-24: a 2-minute 48 kHz stereo song was OOM-killed there).
  finish.measure_song: {pools: [fly_finisher], outputs_per_job: 0}
  # Story clips on the ComfyUI worker (handlers/comfy_video.py, generation.comfy_video): Wan 2.2 I2V A14B + lightx2v.
  # min_vram_gb (any kind): a worker whose card has less total memory doesn't serve the kind (worker.runner
  # kinds_that_fit); a card that can serve none destroys its own machine at start.
  comfy.wan_i2v:   {pools: [runpod_secure_l40s_vol, runpod_secure_l40s, runpod_comm_3090, vast_4090, vast_5090, runpod_secure_a40], outputs_per_job: 1}
  # Dance (handlers/dance_animate.py, policy `dance`, OFF: the handler refuses): Wan-Animate-2 14B int8 on the same ComfyUI
  # image, its own family so story-clip machines never load it. 48 GB+ cards until benchmarked; only `mw bench` queues it.
  comfy.wan_animate2: {min_vram_gb: 44, pools: [runpod_secure_l40s_vol, runpod_secure_l40s, runpod_secure_h100], outputs_per_job: 1, family: dance}
  # Designed voices (VoxCPM2, worker/handlers/tts_voxcpm.py, policy `voice`) on the talk image, in the talk pools.
  voice.design:    {pools: [runpod_secure_l40s_vol, runpod_comm_3090, vast_4090, runpod_secure_l40s, vast_5090, runpod_secure_a40, runpod_comm_4090, runpod_secure_h100], outputs_per_job: 4}
  voice.speak:     {pools: [runpod_secure_l40s_vol, runpod_comm_3090, vast_4090, runpod_secure_l40s, vast_5090, runpod_secure_a40, runpod_comm_4090, runpod_secure_h100], outputs_per_job: 1}
  # Original songs (worker/handlers/music_song.py, policy `music`): ACE-Step 1.5 in ComfyUI core on the ComfyUI image,
  # family music; then Demucs splits a vocal and an instrumental stem. turbo DiT 2B + 1.7B LM + VAE ~10 GB of weights,
  # fits 16 GB+; not benchmarked. Only `mw bench music.song` and production music_video posts (off) queue it.
  music.song:      {min_vram_gb: 16, pools: [runpod_secure_l40s_vol, runpod_comm_3090, vast_4090, runpod_comm_4090, vast_5090, runpod_secure_l40s], outputs_per_job: 1}
  # One singing voice per artist (worker/handlers/music_voice.py, policy music.voice, OFF): a song's vocal stem converted
  # into the artist's voice (SoulX-Singer-SVC zero-shot, or her RVC model) and remixed; and her RVC model trained from
  # her sung clips. Same image and family as music.song (a machine making songs converts them). Not benchmarked.
  music.convert_voice: {min_vram_gb: 16, pools: [runpod_secure_l40s_vol, runpod_comm_3090, vast_4090, runpod_comm_4090, vast_5090, runpod_secure_l40s], outputs_per_job: 1}
  music.train_voice:   {min_vram_gb: 20, pools: [runpod_secure_l40s_vol, runpod_comm_3090, vast_4090, runpod_comm_4090, vast_5090, runpod_secure_l40s], outputs_per_job: 1}
  brain.echo:      {pools: [local], outputs_per_job: 0}   # Brain agents run on the control host (manyworlds.brain.runtime)
  brain.evaluator: {pools: [local], outputs_per_job: 0}
  brain.showrunner: {pools: [local], outputs_per_job: 0}
  brain.idea_reviser: {pools: [local], outputs_per_job: 0}
  brain.analyst:   {pools: [local], outputs_per_job: 0}
  brain.creator_lab: {pools: [local], outputs_per_job: 0}
  brain.strategist: {pools: [local], outputs_per_job: 0}
  brain.talent_manager: {pools: [local], outputs_per_job: 0}
  brain.style_director: {pools: [local], outputs_per_job: 0}
  brain.market_lead: {pools: [local], outputs_per_job: 0}
  brain.comment_themes: {pools: [local], outputs_per_job: 0}
  brain.scouts:    {pools: [local], outputs_per_job: 0}
  fake.image:      {pools: [local], outputs_per_job: 4}
  fake.video:      {pools: [local], outputs_per_job: 1}
  fake.tts:        {pools: [local], outputs_per_job: 1}

# One worker image per job family, and what each machine needs. RAM is system memory:
# loading and quantising models happens there before anything reaches the GPU.
worker_images:
  # env: passed to every worker of the family; a pool's worker_env overrides it.
  # HF_HUB_DISABLE_XET: plain HTTP for the one-time mirror download. A Vast worker stalled in the Xet
  # downloader (2026-11-14); the "process() takes no keyword arguments" failures were Brotli 1.1 (fixed in v8).
  # download_gb: what a machine downloads at boot (compressed image + model weights), priced per GB on Vast.
  image: {image: mw-worker-image, tag: v30, min_cuda: 12.8, cpu: 4, ram_gb: 24, disk_gb: 80, download_gb: 30,
          env: {MW_OFFLOAD_BELOW_GB: 26, HF_HUB_DISABLE_XET: 1}}   # 26 = always offload on 24 GB cards (SaladCloud/WSL)
  # edit: reference-conditioned scene photos (image.qwen_edit, job_kinds family edit) on the image worker image:
  # Qwen-Image-Edit-2511 bf16 (~41 GB transformer, ~17 GB text encoder) + Lightning LoRA, ~58 GB downloaded at the
  # first job. With cpu offload (below MW_EDIT_OFFLOAD_BELOW_GB free, an L40S) the whole model sits in RAM.
  # Needs the image with handlers/image_qwen_edit.py in it (after v25).
  edit: {image: mw-worker-image, tag: v30, min_cuda: 12.8, cpu: 8, ram_gb: 96, disk_gb: 150, download_gb: 70,
         env: {HF_HUB_DISABLE_XET: 1, PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True", MW_EDIT_OFFLOAD_BELOW_GB: 64}}
  # talk: ComfyUI + WanVideoWrapper (docker/worker-talkcomfy.Dockerfile): fp8-scaled Wan2.1-I2V-14B 480p + InfiniteTalk
  # adapter (~16 GB), UMT5 text encoder (~11 GB), VAE, lightx2v LoRA; weights cached on the pool's volume if it has one.
  # The research-script image (mw-worker-talk v8, docker/worker-talk.Dockerfile) needed ~82 GB and 48 GB+ of RAM.
  # MW_LONGCAT_DIR: LongCat's ~47 GB on the container disk. The image's default (/models/longcat) is under the volume
  # mount (/models), so the 90 s test of 2026-11-24 filled the 150 GB volume and the next three volume machines died
  # at their first download (Disk quota exceeded).
  talk: {image: mw-worker-talkcomfy, tag: v18, min_cuda: 12.8, cpu: 8, ram_gb: 32, disk_gb: 100, download_gb: 35,
         env: {HF_HUB_DISABLE_XET: 1, PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True",
               MW_LONGCAT_DIR: /root/longcat}}
  # comfy: story clips on the same ComfyUI image (Wan 2.2 I2V A14B high + low experts, fp8-scaled, ~28 GB).
  comfy: {image: mw-worker-talkcomfy, tag: v18, min_cuda: 12.8, cpu: 8, ram_gb: 48, disk_gb: 120, download_gb: 45,
          env: {HF_HUB_DISABLE_XET: 1, PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"}}
  # dance: Wan-Animate-2 (comfy.wan_animate2, off) on the ComfyUI image; needs the image with handlers/dance_animate.py
  # (talkcomfy v11 and later). int8 model (~18 GB), UMT5 fp8 (~7 GB), CLIP vision, VAE, distill LoRA.
  dance: {image: mw-worker-talkcomfy, tag: v18, min_cuda: 12.8, cpu: 8, ram_gb: 48, disk_gb: 120, download_gb: 45,
          env: {HF_HUB_DISABLE_XET: 1, PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"}}
  # voice: designed voices (VoxCPM2 ~5 GB, Whisper large-v3 ~3 GB, ECAPA) on the same image; needs the image with
  # voxcpm in it (v9 and later).
  voice: {image: mw-worker-talkcomfy, tag: v18, min_cuda: 12.8, cpu: 8, ram_gb: 32, disk_gb: 60, download_gb: 30,
          env: {HF_HUB_DISABLE_XET: 1}}
  # music: original songs (music.song) on the ComfyUI image: ACE-Step 1.5 split files (~10 GB) + Demucs htdemucs
  # (~80 MB) + Whisper for the bench's lyric check. Needs a talkcomfy image with handlers/music_song.py and demucs in
  # it (v15, NOT BUILT YET: build and smoke-test it before any music job is queued).
  music: {image: mw-worker-talkcomfy, tag: v19, min_cuda: 12.8, cpu: 8, ram_gb: 32, disk_gb: 60, download_gb: 30,
          env: {HF_HUB_DISABLE_XET: 1, PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"}}
  train: {image: mw-worker-train, tag: v3, min_cuda: 12.8, cpu: 8, ram_gb: 48, disk_gb: 100, download_gb: 40,
          env: {HF_HUB_DISABLE_XET: 1}}

# What each provider calls each GPU.
gpu_names:
  rtx3060:  {salad: "RTX 3060",  vast: "RTX 3060",  runpod: "NVIDIA GeForce RTX 3060"}
  rtx3090:  {salad: "RTX 3090",  vast: "RTX 3090",  runpod: "NVIDIA GeForce RTX 3090"}
  rtx4090:  {salad: "RTX 4090",  vast: "RTX 4090",  runpod: "NVIDIA GeForce RTX 4090"}
  rtx5090:  {salad: "RTX 5090",  vast: "RTX 5090",  runpod: "NVIDIA GeForce RTX 5090"}
  rtxa5000: {salad: "RTX A5000", vast: "RTX A5000", runpod: "NVIDIA RTX A5000"}
  a40:      {vast: "A40", runpod: "NVIDIA A40"}
  l40s:     {vast: "L40S", runpod: "NVIDIA L40S"}
  h100:     {vast: "H100 SXM", runpod: "NVIDIA H100 80GB HBM3"}

# The autoscaler starts machines when jobs are waiting and stops them when the queue
# drains. A provider is skipped when its API key isn't configured.
autoscale:
  tick_seconds: 60
  tick_lease_seconds: 600      # a crashed tick's lock expires after this
  max_groups_per_kind: {default: 2, image: 6}   # most machines at once per job kind
  # How many machines a backlog gets: enough to finish it within drain_target_minutes,
  # from the median job time of the last history_days (default_job_seconds before any data).
  # Each extra machine costs one boot (~4-5 min on Vast), so small backlogs stay on one.
  scale:
    drain_target_minutes: {default: 30, train: 180}
    history_days: 7
    default_job_seconds: {default: 120, image: 60, video: 300, train: 7200, talk: 900, comfy: 180, edit: 240, music: 150}
  # Production work (made lead_hours ahead) waits to share one machine: each machine bills a boot,
  # model load and idle tail (~7-10 min) however few jobs it runs. Lab work and benchmarks start at once.
  batch:
    # image 20: a Salad image machine bills boot + a 20-min idle tail around ~20 min of work (39% busy, 2026-11-21)
    min_work_minutes: {default: 10, image: 20, video: 25, train: 0, talk: 25, comfy: 25, music: 15}   # start once this much work waits (median job times)...
    max_wait_minutes: {default: 180}                       # ...or once the oldest job has waited this long
    urgent_priority: 1                                     # jobs at this priority or above never wait
  bench_machines: 1              # machines for pinned benchmark work, whatever its size (it measures one machine)
  relaunch_cooldown_minutes: 15  # after a machine for a kind stops, wait before starting another
  # The last `machines` machines of a family (current worker image, within `hours`) all tried work and finished
  # none: stop renting that family and tell the owner. A new image tag or the window passing re-arms it.
  no_output_guard: {machines: 3, hours: 24}
  # CN: huggingface.co is unreachable there, so workers that fetch weights at start never begin.
  runpod_cuda_versions: ["12.8", "12.9", "13.0"]   # versions RunPod accepts in allowedCudaVersions
  # Vast hosts charge per GB downloaded (set per host, 20x apart): $29 of a $40 bill (2026-11-12..20) was boot
  # downloads. Offers above max_inet_down_usd_per_gb are skipped; the rest are ranked by expected_hours of rent
  # plus worker_images.<family>.download_gb at the host's rate.
  vast: {min_reliability: 0.98, verified_only: true, offers_to_try: 3, min_inet_down_mbps: 200, exclude_countries: [CN],
         max_inet_down_usd_per_gb: 0.005, expected_hours: 1.0, candidates: 50}
  reconcile_days: 3              # provider itemised charges pulled into the ledger (manyworlds.deploy.reconcile)
  reconcile_every_minutes: 60
  reconcile_settle_hours: 2      # reconcile a machine once stopped this long (the provider has posted its charges)
  worker_self_stop: true         # workers on Vast/RunPod destroy their own machine when idle or past deadline
  # Pools are tried cheapest per accepted output first, from what machines actually billed
  # (boot, idle and failures included) over the window. A number or {family: number, default: n}.
  scoring:
    enabled: true
    window_days: 7
    min_outputs: {default: 20, video: 5, train: 1, talk: 5}   # outputs before a pool is ranked
    trial_usd: {default: 0.30, video: 0.60, train: 1.00, talk: 1.50}   # most spent measuring an unranked pool per window
    pause_after_failed_machines: 3   # this many machines in a row with no output pauses the pool...
    pause_hours: 24                  # ...for this long, then it gets a new trial

# Review gates for generated images (manyworlds.review.gates). Scores are 0-10.
review:
  image:
    # Two stages: every image is screened by `role`; only screen passes go to `confirm_role`.
    # On Maren's LoRA test (2026-11-14) Haiku 5.5 and Opus 5.5 rejected the same 12 of 12;
    # Opus cost $0.012 per image (17x the image itself), Haiku $0.0003.
    role: review
    effort: low
    # Owner 2026-11-22: once an image exists only defects in the media kill it, and judging must cost far less than
    # making: the confirm is Sonnet (review_confirm), only for close calls (a screen pass by clear_pass_margin on
    # identity and realism skips it), and at most the best one per job.
    confirm_role: review_confirm
    confirm_effort: low
    confirm_top_per_job: 1
    clear_pass_margin: 2
    # 2026-11-19 (owner): keep images unless the face is clearly someone else (identity 5 = recognisably her,
    # small drift) or there are clear AI defects (realism 5 = passes a casual scroll). Scene fit only ranks
    # candidates (min_scene 0): rejecting on it threw away 9 in 10 of Maren's images.
    min_identity: 5
    min_realism: 5
    min_scene: 0
    reference_images: 3        # creator reference photos shown with every review
    max_jobs_per_run: 50
    loop_seconds: 120          # how often the reviewer looks for new images
    busy_loop_seconds: 15      # ...while a post is producing or the last run reviewed something
    # A job whose review keeps raising (a corrupt file, a judge error on it) is given up after this many tries, at
    # most one counted per spacing (so a judge outage uses up nothing): its images count as rejected (gate `review`,
    # stage `error`) and production repairs the scene, instead of a screen being paid for it every loop.
    max_review_errors: 3
    review_error_spacing_seconds: 600
  # Story clips (manyworlds.review.video), judged from keyframes the video worker stores.
  # 2026-11-14 benchmarks: the 480p clip drifted to another face by 4 s (must fail identity); the
  # 720p clip held her face, hands steady (should pass).
  video:
    role: review               # screen every clip...
    effort: low
    confirm_role: review_confirm   # ...confirm the close calls it passed (Sonnet; Opus was ~$0.05 a clip)
    confirm_effort: low
    keyframes: 4               # spread over the clip, ending on the last frame
    min_identity: 6            # in the worst keyframe (video drift compounds; a notch stricter than photos)
    min_motion: 6
    min_realism: 6
    # A clip the screen passes on identity, motion and realism by this many points skips the paid confirm (Opus,
    # ~$0.05 a clip, as much as the render; 2026-11-22). Rows record clear_pass, so the share can be audited.
    clear_pass_margin: 1
    min_scene: 0               # ranks only, as for photos
    reference_images: 3
    max_jobs_per_run: 10
    max_repairs_per_post: 2    # new seeds for a rejected clip (each is a ~$0.05 render) before the post is dropped
    # Clip job kinds the video gate judges: `x.*` is every kind with that prefix, anything else one kind exactly
    # (`*.mirror` jobs and intermediate clips are never judged).
    kinds: [video.*, talk.*, hosted.video, comfy.wan_i2v, comfy.wan_animate2]
    max_review_errors: 3       # as review.image: a clip whose review keeps raising counts as rejected
    review_error_spacing_seconds: 600
    # Talking clips: mouth openness vs voice loudness (worker/lipsync.py), recorded on every clip. Off until clips
    # judged by eye give the threshold (benchmark); then a clip below it is rejected before any paid review.
    # Enforced since 2026-11-22: 8-step clips passed the visual gate with lip-sync correlation 0.07 and 0.28 (the
    # keyframes can't show sync); 6-step clips scored 0.61-0.70.
    lip_sync: {enforce: true, min_corr: 0.3, min_face_share: 0.8}
    # Talking clips: the voice line transcribed (Whisper on Together, $0.0015 a minute, 2026-11-21) must match the
    # script within max_wer (word error rate), or the clip fails before any paid review (manyworlds.speech).
    # Voices are judged automatically, never by ear (owner 2026-11-21).
    # Script and transcript are compared after manyworlds.speech.normalise (numbers as digits, "No. 2" = "number two",
    # "6 p.m." = "six pm", contractions expanded). A line under short_line_words words is judged by short_line_max_wer
    # (one misheard word of two is 0.5; 2026-11-23 breadth run dropped "Look one" heard "Look ones").
    intelligibility: {enforce: true, host: together, model: openai/whisper-large-v3, language: en, max_wer: 0.15,
                      short_line_words: 4, short_line_max_wer: 0.5,
                      usd_per_minute: 0.0015, timeout_seconds: 120}
  # Directed outputs (a job payload with a `shot`, manyworlds.direction): the judge also sees the shot's summary and
  # beats and scores `direction` 1-10 on rubric policy/rubrics/direction-v<n>.yaml; below min_score it is rejected
  # (gate `direction`). Undirected outputs are judged as before.
  direction:
    # Report-only (owner 2026-11-22): whether the output followed the brief is scored and learned from, never a reason
    # to throw away good media; the brief is checked before any GPU instead (direction.feasibility, the director).
    min_score: 0
    rubric: direction
  # Finer checks (manyworlds.review.detail, 2026-11-22). Each has a switch (`enabled`: measured and recorded as its
  # own review row) and `enforce` (only then can it reject; a row that isn't enforced is written passed, with
  # details.would_pass). All report-only until calibrated against clips judged by eye. Outputs without the signal
  # (no hands in frame, no references, no mouth series) get no row and behave as before.
  #   hands, teeth  the judge rates them 1-10 when visible (null otherwise) and names defects
  #   lip_closure   talking clips: the lips close (inner-lip gap / mouth width at most closed_max_openness, or
  #                 relative_to_p90 x the clip's 90th-percentile openness) within tolerance frames of each b/p/m;
  #                 the share closed must be min_share. Word times are estimated from the voice's line timings or
  #                 the script, so the wider estimated_tolerance_frames applies until word timestamps exist
  #   background    keyframes' edges outside the subject box (exclude_box, fractions x0 y0 x1 y1) compared
  #                 frame to frame: flicker 0 = identical, 1 = unrelated; camera moves raise it too, so report only
  #   consistency   a shot with set.set_id / wardrobe.outfit_id and payload `references` [{kind: set|outfit, uri}]:
  #                 the judge compares against those images, 1-10
  detail:
    hands: {enabled: true, enforce: false, min_score: 5}
    teeth: {enabled: true, enforce: false, min_score: 5}
    lip_closure: {enabled: true, enforce: false, min_share: 0.6, closed_max_openness: 0.05, relative_to_p90: 0.25,
                  tolerance_frames: 2, estimated_tolerance_frames: 4, min_bilabials: 3}
    background: {enabled: true, enforce: false, max_flicker: 0.45, exclude_box: [0.2, 0.0, 0.8, 0.9], width: 160}
    consistency: {enabled: true, enforce: false, min_score: 6, max_references: 2}
    # Close-up crops for the judge (worker/crops.py): clip workers with MediaPipe (the talk images' lip-sync
    # environment) cut the mouth and each hand out of the keyframes (square, padded by `margin` x the landmark box,
    # scaled to `size` px), stored as assets kind crop; the video judge sees them beside the keyframes for the
    # hands and teeth scores. A worker without MediaPipe or the hand model makes none (full frames, as before).
    crops: {enabled: true, hands: true, mouth: true, size: 384, margin: 0.5, max_per_clip: 8}
  # The finished file (manyworlds.review.final, 2026-11-23): final.mp4 after sound, captions, labels and the finish,
  # judged once from frames cut out of it: text over the face or eyes, seams at the joins, sound vs picture at the end
  # (stream ends measured, plus the judge on the last words), and "would a viewer think this is real phone footage".
  # Report-only (enforce false) until calibrated by eye: scores land on the post (body.final_review), as review rows
  # (gates final_*) and a review.final decision. Frames: `keyframes` spread over the file, one either side of each
  # join (join_offset_seconds, at most max_joins), one per text span (max_text_frames), two at the end; frames
  # closer than min_gap_seconds merge, at most max_frames, scaled to frame_height px.
  final:
    enabled: true
    enforce: false
    # Sonnet (the confirm role) while report-only: up to max_frames frames per file on Opus cost more than the scores
    # are worth before they gate anything. Back to `judge` when enforce turns on, if calibration shows Sonnet misses.
    role: review_confirm
    effort: low
    keyframes: 6
    join_offset_seconds: 0.1
    max_joins: 6
    max_text_frames: 4
    max_spans_listed: 12
    end_window_seconds: 0.5
    end_margin_seconds: 0.1
    min_gap_seconds: 0.15
    max_frames: 20
    frame_height: 960
    spoken_kinds: [caption]        # text_spans kinds that are the spoken words (the last one is checked at the end)
    min_seams: 6
    min_end_sync: 6
    min_phone_real: 6
    max_end_drift_seconds: 0.1     # audio and video streams of the file end within this of each other
    timeout_seconds: 120
  # The finished file's lip-sync score on the CPU (manyworlds.review.sync, 2026-11-23): the clip gate reads each take's
  # score from its worker, before joins (long talks), V2V (walk-and-talk), the mix and the finish; this measures
  # final.mp4 itself in record_finish (the producer). Frames at sample_fps (fewer past max_frames), frame_height px;
  # mouth openness from MediaPipe's face landmarker (the control-plane image's `sync` extra, model at landmarker_path
  # or MW_FACE_LANDMARKER); loudness at audio_rate Hz. Score: best correlation within +-max_lag_ms. Voice frames:
  # loudness within speech_db_below_p95 dB of its 95th percentile. Open: above max(open_min, open_relative_to_p90 x
  # the clip's p90 openness); shut: at most max(closed_max, closed_relative_to_p90 x it). Report-only (enforce false)
  # until calibrated by eye: body.sync_review, a final_lip_sync review row, a review.sync decision.
  sync:
    enabled: true
    enforce: false
    formats: [talking_video]
    sample_fps: 25
    max_frames: 900
    frame_height: 480
    audio_rate: 16000
    max_lag_ms: 120   # +-200 rewarded a mouth half a syllable off on short syllables (2026-11-23)
    min_frames: 25
    min_corr: 0.3
    min_face_share: 0.8
    speech_db_below_p95: 30
    open_min: 0.08
    open_relative_to_p90: 0.35
    closed_max: 0.05
    closed_relative_to_p90: 0.15
    max_silent_mouth_moving: 0.3
    max_talking_mouth_closed: 0.5
    landmarker_path: /opt/models/face_landmarker.task
    timeout_seconds: 300
  max_repairs_per_post: 4    # day 5: regenerations allowed before a post is dropped
  # Targeted repair (manyworlds.review.repair): a rejected scene is diagnosed from its review rows (the gate that
  # failed most) and the next job gets that cause's fix, within max_repairs_per_post. Unsafe output is never
  # regenerated. {scene} is the scene text; `scene` leads the prompt, the others follow it. A hint is positive wording, or
  # {positive, avoid}: `avoid` goes to the job's negative_prompt, never the prompt (a clause of a string hint that starts
  # with "no", "without", "avoid"... is moved there too: manyworlds.review.repair.split_hint).
  repair:
    lora_scale_step: 0.1         # identity: each identity repair strengthens the likeness LoRA by this...
    lora_scale_max: 1.2          # ...up to this (mild: 1.3 did no better on Maren, 2026-11-14; the prompt hint does more)
    drop_on_safety: true
    hints:
      scene: "The photo must clearly show: {scene}. "
      identity: ". Face clearly visible, the same person as always, signature details present"
      realism:
        positive: ". Relaxed hands resting naturally or out of frame, natural anatomy, unbranded clothes and objects"
        avoid: [text, logos, extra fingers, warped hands]
    # Positive wording of a repair's avoid items for scene photos, which have no negative channel (review.repair
    # with_negative); added only to a repaired prompt, on top of direction.positive_instead_of.
    stand_ins:
      text: "blank, unprinted surfaces"
      extra fingers: "five fingers on each hand"
      warped hands: "natural, relaxed hands"

generation:
  image: {width: 896, height: 1152, steps: 9, guidance: 0.0}
  # A story clip of several scenes: one clip per scene photo, joined with each shot's transition in (production
  # clip_edit). Each clip costs a GPU job: tiers cap how many video posts a creator makes.
  clip_edit: {enabled: true, max_clips: 4}
  # Scene photos per format, merged over `image` (4:5 for photos and carousels). Every video format and Stories get a
  # native 9:16 photo: a 4:5 photo cover-cropped into a 9:16 clip lost ~26% of its width and the framing with it.
  # 864x1536 is exactly 9:16, both sides multiples of 16 (Z-Image's VAE factor x patch size; the pipeline refuses
  # others), ~1.33 MP: Z-Image Turbo's 1280 resolution class (896x1152 is ~1.03 MP), so ~30% more GPU time per
  # image, and enough pixels for a 1080x1920 narrated edit. `video` is the rule for any video format
  # (planner.video_formats, and new ones); the named formats repeat it (a YAML alias) until production falls back
  # to `video` by itself.
  image_by_format:
    video: &video_scene_photo {width: 864, height: 1536}
    story: *video_scene_photo
    talking_video: *video_scene_photo
    story_clip: *video_scene_photo
    narrated_edit: *video_scene_photo
  # Base clip payload (size, length, fps); each engine's own block (comfy_video, hosted_video) overrides it.
  video: {width: 704, height: 1280, frames: 121, steps: 30, guidance: 5.0, fps: 24}
  # Lip-sync (talk.infinitetalk) on ComfyUI + WanVideoWrapper (worker image mw-worker-talkcomfy, worker/comfy.py):
  # fp8-scaled InfiniteTalk with the 4-step lightx2v LoRA and SageAttention, at Kijai's example settings (6 steps,
  # cfg 1, shift 11, dpm++_sde, 81-frame windows, 9 motion frames). 480x832 is Wan's 480p vertical bucket (2.6% narrower
  # than 9:16); the approved photo is fitted to it (talk_comfy.fit_box): scaled whole when within fit_stretch_tolerance
  # of its aspect, else cover-cropped, so a 9:16 scene photo loses 2.5% of its height (480x848 would lose nothing:
  # benchmark it before leaving the trained bucket). Cards under swap_below_gb swap blocks_to_swap transformer blocks to
  # the CPU. The research
  # script's settings (InfiniteTalk's own repo, image mw-worker-talk) are kept below as talk_profiles.script.
  talk:
    width: 480
    height: 832
    fit_stretch_tolerance: 0.01   # a photo within 1% of the frame's aspect is scaled, not cropped (invisible stretch)
    # Walk-and-talk: the 16 fps motion clip reaches InfiniteTalk's 25 fps by motion interpolation on the worker
    # (talk_comfy.at_fps, media.fps_filter; same options as finishing.interpolate) instead of repeated frames, which
    # judder. V2V redraws about half of each frame afterwards, which smooths interpolation seams. enabled false =
    # repeat frames. Unproven on a GPU run: check the first walk-and-talk takes.
    motion_interpolate: {enabled: true, method: minterpolate, mi_mode: mci, mc_mode: aobmc, me_mode: bidir, vsbmc: 1,
                         scd: fdiff, scd_threshold: 10, blend_below_seconds: 1.0}
    # 10 steps since 2026-11-22 (3-clip benchmarks on the L40S, lip-sync gate at corr 0.3): 6 steps 1 of 3 accepted,
    # 8 steps 1 of 3 (two clips lost lip sync, corr 0.07 and 0.28), 10 steps 2 of 3 (corr 0.62-0.69; the reject scored
    # realism and motion 4), ~50 s of GPU per output second, ~$0.08 a clip. Small samples: re-measure on 8-10 clips.
    steps: 10
    cfg: 1.0
    shift: 11.0
    scheduler: dpm++_sde
    # 1.5 since 2026-11-22: Kijai's InfiniteTalk example uses 1.5. audio_cfg acts only when cfg > 1 (s10cfg below).
    audio_scale: 1.5
    audio_cfg: 1.0
    frame_window: 81
    motion_frame: 9
    swap_below_gb: 40
    blocks_to_swap: 20
    timeout_s: 3000              # one render; the attempt limit (gpu_runs, talk: 90 min) also covers the download
    # One take per shot (manyworlds.direction): a take longer than this (words / talk_long.words_per_second) is split
    # at the nearest sentence end, as a safety net. Production only; not sent to the worker.
    max_take_seconds: 60
    voice: af_heart
  # Settings to benchmark against `talk` (mw bench talk.infinitetalk --profile NAME), merged over it. fast: the
  # README's lightx2v recipe (4 steps, text cfg 1, audio cfg 2, shift 2), ~15-30x less compute than 40 steps x 3
  # passes. It runs at full precision (no fp8 LoRA build exists), so the ~82 GB base model loads in host RAM: pin it
  # to runpod_secure_l40s (48 GB VRAM, ~125 GB RAM). No CPU offload flag: the 14B model fits a 48 GB card.
  talk_profiles:
    # 2026-11-22 benchmark (L40S, 3 clips of 4.8-6.3 s): 684-902 s each, ~145 s of compute per output second, all three
    # passed the gate (lip-sync corr 0.41-0.56). The script offloads the model to CPU after every forward on one GPU
    # (offload_model defaults to True): keep it on the card. Not --t5_cpu: InfiniteTalk crashes with it (context
    # stays a list: "'list' object has no attribute 'dtype'", 2026-11-22); the whole model fits a 48 GB card at 480p.
    fast: {steps: 4, text_cfg: 1.0, audio_cfg: 2.0, shift: 2, extra: ["--offload_model", "False", "--max_frame_num", "1525"],
           lora: {repo: Kijai/WanVideo_comfy, file: Wan21_T2V_14B_lightx2v_cfg_step_distill_lora_rank32.safetensors, scale: 1.0}}
    # ComfyUI talk at more steps (2026-11-22: at 6 steps 1 of 3 passed; the 2 rejected scored realism or motion 5,
    # a hair clip doubling and the face softening late in the clip; lip sync 0.61-0.70, speech WER 0).
    steps8: {steps: 8}
    steps6: {steps: 6}
    steps10: {steps: 10}
    # Speed levers (2026-11-22), each benchmarked against the gate before adoption: fp8 fast matmul, torch.compile.
    fp8fast: {quantization: fp8_e4m3fn_scaled_fast}
    compiled: {quantization: fp8_e4m3fn_scaled_fast, compile: true}
    # 8 steps looked better but lip sync fell (0.07-0.60): stronger audio conditioning at 8 steps. Result 2026-11-22:
    # s8audio 1 of 3 accepted (lip sync 0.54-0.69, rejects on realism and motion 4-5); s8audiocfg 1 of 1 (corr 0.70)
    # but ~607 s for 6.3 s, since audio cfg adds a pass: not worth it.
    s8audio: {steps: 8, audio_scale: 1.5}
    s8audiocfg: {steps: 8, audio_cfg: 2.0}
    # 10 steps with real guidance (plan 2026-11-22 task 6): cfg 2 turns on the text and audio cfg passes (slower: an
    # extra pass per step); benchmark against `talk` before adopting.
    s10cfg: {steps: 10, cfg: 2.0, audio_cfg: 2.0}
    # Second lip-sync model (worker/comfy.py graph_longcat): LongCat-Video-Avatar (MIT) at Kijai's example settings
    # (distill LoRA 0.9, longcat_distill_euler, shift 12, cfg 1, 93-frame windows overlapping 13; the example runs 12
    # steps, 10 here per the plan; audio cfg 3, the bottom of the example note's 3-5 range). sdpa attention: the
    # example says SageAttention 1.0.6 (our image) fails with LongCat. 48 blocks: 25 swapped on small cards.
    # longcat_version 1.0 (Kijai's fp8 avatar model, wav2vec audio, 16 fps): no 1.5 checkpoint in the wrapper's
    # format exists from Kijai or Comfy-Org (2026-11-22). longcat15: the v1.5 Whisper path on a community GGUF,
    # untested and without 1.5's own distillation LoRA: benchmark before trusting it.
    longcat: {model: longcat, longcat_version: "1.0", steps: 10, cfg: 1.0, shift: 12.0, audio_cfg: 3.0,
              frame_window: 93, overlap: 13, scheduler: longcat_distill_euler, lora_strength: 0.9, attention: sdpa,
              blocks_to_swap: 25}
    longcat15: {model: longcat, longcat_version: "1.5", steps: 10, cfg: 1.0, shift: 12.0, audio_cfg: 3.0,
                frame_window: 93, overlap: 13, scheduler: longcat_distill_euler, lora_strength: 0.9, attention: sdpa,
                blocks_to_swap: 25}
    # 720p close-ups (plan 2026-11-22 wave 2; direction.talk_profile_for picks it for direction.hd_for_shot_sizes
    # while direction.hd_close_ups is on). 720x1280 is ~2.3x the pixels of 480x832, so InfiniteTalk needs more VRAM
    # (latents and attention grow with it; small cards swap more blocks) and roughly 2.2-2.5x the time per clip.
    # Same 10 steps as `talk`. Not benchmarked yet: mw bench talk.infinitetalk --profile hd720 before turning it on.
    hd720: {width: 720, height: 1280, steps: 10}
    # LongCat-Video-Avatar 1.6 (MIT, 2026-11-15) as ONE continuous take (worker/handlers/talk_longcat.py, job kind
    # talk.longcat, or talk.infinitetalk with this profile): WanVideoWrapper has no 1.6 support (newest commit
    # a7439db, 2026-11-13), so it runs on LongCat's own repo (docker/worker-talkcomfy.Dockerfile, LONGCAT_REF).
    # The README's 1.6 recipe: --use_distill (8 steps, text and audio guidance 1), loraB (OPSD) with the first
    # mix_steps steps blending in loraA (DMD) at mix_alpha, long video by continuation re-anchored to the photo
    # (ref_img_index 10, mask_frame_range 0). frames_per_segment, cond_frames and fps are the script's own fixed
    # numbers (93 frames, 13 carried over, 25 fps): only used here to work out how many segments cover the line.
    # Memory (estimate, not measured): INT8 DiT ~16 GB + UMT5 bf16 ~11 GB + Whisper fp32 ~6 GB + both LoRAs ~5 GB +
    # VAE, ~39 GB resident before activations on one card; mixing keeps both LoRAs unmerged and turns the KV cache
    # off. A third-party test of 1.5 (bf16) peaked at 46.8 GB on an H200. auto = int8 below bf16_min_vram_gb (an L40S),
    # bf16 on an 80 GB H100. If an L40S runs out of memory: mix_steps 0 (loraB merged, KV cache on) or the H100.
    # 480p is 480x832 (the script's bucket; the photo is fitted to it first). timeout_s: one render (gpu_runs
    # max_attempt_minutes_by_kind talk.longcat, 180 min, also covers the ~47 GB download).
    longcat16: {model: longcat_native, quantization: auto, bf16_min_vram_gb: 70, resolution: 480p, width: 480,
                height: 832, max_seconds: 120, frames_per_segment: 93, cond_frames: 13, fps: 25, mix_steps: 4,
                mix_alpha: 1.0, lora_path: loraB/lora.safetensors, ref_img_index: 10, mask_frame_range: 0,
                compile: false, weights_on_volume: false, min_free_disk_gb: 10, timeout_s: 9000}
  # Story clips on the ComfyUI worker (comfy.wan_i2v): Kijai's Wan 2.2 I2V A14B example (6 steps, 3 on the high-noise
  # expert with cfg 2 on its first step, 3 on the low-noise one; lightx2v LoRA 3 / 1; dpm++_sde; shift 8), 81 frames at
  # 16 fps (5 s), 9:16 at 480p (the photo fitted as for talk, fit_stretch_tolerance). Cards under swap_below_gb swap
  # blocks_to_swap blocks to the CPU. The finish stage interpolates 16 fps to finishing.fps.
  comfy_video: {width: 480, height: 832, frames: 81, fps: 16, steps: 6, high_steps: 3, shift: 8.0, high_cfg: 2.0,
                high_lora_strength: 3.0, low_lora_strength: 1.0, swap_below_gb: 40, blocks_to_swap: 20, timeout_s: 1800,
                fit_stretch_tolerance: 0.01}
  # Story clips on a hosted API (production.video_kind: hosted.video): Wan 2.7 i2v on Together, $0.10 per 5 s clip
  # (catalog 2026-11-21; the job records the host's own cost). Same approved photo as first frame, 9:16 720P.
  hosted_video: {host: together, model: Wan-AI/wan2.7-i2v, seconds: 5, resolution: 720P, ratio: "9:16",
                 usd_per_clip: 0.10, poll_seconds: 10, timeout_s: 900}
  # Long talking videos (manyworlds.talk_segments, production): a script longer than one segment is split at
  # sentence boundaries, each segment rendered and judged as its own talk job, then joined (a finish.join job on the
  # finisher while production.finish_mode is queue; in the producer when inline).
  # join: cut = every segment from the approved photo, in parallel, joined with jump cuts (talking-head style);
  #       chain = each segment starts from the last frame of the one before (continuous, one at a time).
  # 60 s (was 25, 2026-11-22): InfiniteTalk's streaming mode makes one continuous take, clean to about a minute
  # (model review); longer scripts are cut at sentences into ~60 s takes. One take, one voice line, no seams.
  # Each ffmpeg call of the join (normalise a take, join them) may run join_seconds_per_input_second per second of its
  # input, never under join_timeout_s (a flat 600 s killed a three-take hybrid join on the producer every loop,
  # 2026-11-23; minterpolate to 30 fps and a 1080x1920 encode cost tens of CPU seconds per second of video).
  talk_long: {max_segment_seconds: 60, words_per_second: 2.5, join: cut, join_timeout_s: 600,
              join_seconds_per_input_second: 30}
  # Hybrid talking video (owner 2026-11-22): when the post has cutaway photos, the script is cut into short segments;
  # the hook, the sign-off and enough of the middle to reach on_camera_share are lip-synced, the rest are the cutaway
  # photos moving under the same voice (image.narrated). All segments are brought to `output` and joined. Only the
  # on-camera part pays for the lip-sync render (about a third of a 30 s reel costs a third as much).
  # Only posts WITHOUT shot sheets get the length-based split. A directed post (body.shots) is always cut only at scene
  # changes (2026-11-23, owner: cuts only where the shots change): one take per shot that speaks, on camera unless the
  # shot is a cutaway (narrated over that shot's photo, while this is enabled), split only past
  # generation.talk.max_take_seconds; each join gets the next shot's edit.transition_in (direction.transition_kind).
  # output: every segment is brought to the delivery size and rate (finishing.output, finishing.fps) before the join,
  # the slower lip-synced ones by motion interpolation (finishing.interpolate), so the finish stage scales nothing.
  talk_hybrid: {enabled: true, segment_seconds: 8, on_camera_share: 0.4,
                output: {width: 1080, height: 1920, fps: 30, lufs: -14}}
  # Cut-based talking edits (manyworlds.cuts; owner 2026-11-24: one long take reads clunky and costs the most GPU).
  # A talking post follows a grammar: the idea's edit_grammar, else its creator's first archetype's (by_archetype),
  # else default. punch_in: the finish crops in and out of a lip-synced take at word gaps (CPU only, the voice
  # untouched): about every every_s [lo, hi] seconds, cycling through scales (1 = the full frame), never a stretch
  # under min_shot_s; centred on her face, else on center (shares of the frame). lip_sync on_camera: a speaking shot
  # without her face to camera (direction.faceless, or an angle in narrated_angles) is a cutaway under the voice,
  # not a lip-sync render; all: only the director's own cutaways. director: rules added to the director's brief.
  # STARTING VALUES, to calibrate from docs/research/2026-11-24-talking-video-calibration.md (real videos measured).
  talk_edit:
    default: story_time
    by_archetype: {storyteller: story_time, educator: story_time, beauty_grwm: story_time, lifestyle_slow: commercial,
                   food_home: commercial, maker: commercial, fashion_style: commercial, city_explorer: commercial,
                   movement: commercial}
    grammars:
      story_time:
        punch_in: {every_s: [2.0, 4.0], scales: [1.0, 1.2], min_shot_s: 1.2, center: [0.5, 0.4]}
        lip_sync: on_camera
        narrated_angles: ["over the shoulder", "from behind"]
        director:
          - "Most of it is her talking to the lens, close and handheld, one take per shot; the finish punches in and out between words, so don't plan a cut for every sentence."
          - "Open on the hook line within the first second, her face already close; no greeting or intro."
          - "Use a cutaway (cutaway true, her hands, the thing she talks about, the place) every 6-10 seconds at most, under the same voice; never for the hook or the punchline."
          - "Keep each speaking shot to a few sentences; change the shot where the story moves (a new place, a time jump), not mid-thought."
      commercial:
        punch_in: {every_s: [3.0, 5.0], scales: [1.0, 1.12], min_shot_s: 1.5, center: [0.5, 0.4]}
        lip_sync: on_camera
        narrated_angles: ["over the shoulder", "from behind"]
        director:
          - "Cover one scene from 3-6 different angles: wide, medium, close-up, over the shoulder, her hands from her point of view; each shot is its own first frame."
          - "Only the lines she says looking into the lens are lip-synced; give the other lines to shots that don't show her face to camera (hands, product, the place, from behind) so her voice carries over them."
          - "Shots run 1.5-3 seconds; cut on an action (a pour, a reach, a turn) or at the end of a line."
          - "End on her face to camera with the last line."
      long_take:
        punch_in: null
        lip_sync: all
        director:
          - "One continuous take to camera; only for a sit-down talk where the cut would break the moment."
  # Walk-and-talk (plan 2026-11-22-video-quality-autonomous item 1; production, worker/comfy.py graph_v2v): a talking
  # take whose shot moves is made in two stages. First a silent motion clip from the take's photo (the story-clip
  # path, prompt compiled from the shot for i2v, as long as the take's voice line up to max_motion_seconds), then
  # InfiniteTalk video-to-video lip sync of that clip with the voice line, so she moves and talks. Static takes keep
  # image-to-video talk. Audio longer than the clip continues from its last frame (she stops and keeps talking).
  # trigger: a shot moves when its camera move is in camera_moves (static and handheld are not: InfiniteTalk's own
  # image-to-video already sways like a held phone) or one of its beats' actions contains one of beat_words, matched
  # as whole words, the first word also with s/es/ed/ing ("walk" matches "walks", "walking"; "stand up" matches
  # "stands up", "standing up"). A small turn of the head is not movement; "turn around" is.
  # kind: the motion clip's job kind; comfy.wan_i2v runs on the talk worker image, so both stages share a machine
  # (null = the story clip's kind and routing). Production does not wait for a review of it (an intermediate, marked
  # payload.intermediate; `keyframes` is the fewest a clip job makes); the lip-synced take is judged. v2v: merged over generation.talk for the talk job: Kijai's V2V example
  # (4 steps, sampling from step 2, so about half of the motion clip is redrawn: lower start_step redraws more, which
  # helps the mouth but can alter details when the camera moves; research 2026-11-22). clip_vision: the example's CLIP
  # vision embeds of the first frame (one more ~1.3 GB download); off, as in our image-to-video talk graph.
  # Unproven: benchmark before trusting; enabled because a moving take without it is a still photo that talks.
  talk_motion:
    enabled: true
    trigger:
      camera_moves: [push_in, pull_out, pan_left, pan_right, tilt_up, tilt_down, follow, orbit_slow]
      beat_words: [walk, stroll, wander, pace, pacing, step, stepping, jog, jogging, approach, enter, head toward,
                   head towards, turn around, turn away, spin, spinning, twirl, dance, dancing, stand up, standing up,
                   get up, getting up, sit down, sitting down, lie down, lying down, climb]
    max_motion_seconds: 5          # Wan 2.2 I2V's trained length (81 frames at 16 fps); longer clips loop and drift
    # A take longer than one clip gets a chain: each next clip starts from the last frame of the one before (its
    # keyframe), all joined on the control plane before the lip sync; at most max_motion_chain clips, and a remainder
    # under chain_min_seconds gets none. What the chain doesn't cover ends on a hold (the talk continues from the last
    # frame). Each clip is a GPU job (~5 s of Wan 2.2 I2V A14B): 3 caps a take's motion at 15 s.
    max_motion_chain: 3
    chain_min_seconds: 1.5
    # V2V lip sync needs the ComfyUI talk engine (handlers/talk_comfy.py). The worker image chooses the engine
    # (MW_TALK_ENGINE); production reads it from worker_images.<talk family>.env.MW_TALK_ENGINE when set, else
    # treats these images as ComfyUI. With any other talk image a moving take is lip-synced from its photo.
    v2v_images: [mw-worker-talkcomfy]
    kind: comfy.wan_i2v
    keyframes: 1
    v2v: {steps: 4, start_step: 2, clip_vision: false}
    # Repairs of a V2V take that failed lip_sync (production.talk.talk_repair; breadth run 2026-11-23: the mouth was
    # never redrawn, openness ~0.001, and every reseeded repair scored the same corr): each repair lowers start_step
    # by start_step_step (redraws more of the clip) down to start_step_floor. A knob (start_step, seed) whose repair
    # scored the same lip-sync corr as the attempt before (within same_score_tolerance) is not tried again; with
    # every knob spent the post is dropped with the reason instead of rendering the same clip again.
    v2v_repair: {start_step_step: 1, start_step_floor: 0, same_score_tolerance: 0.005}

# Designed voices (manyworlds/creator/voice_lab.py, worker/handlers/tts_voxcpm.py; owner 2026-11-22: a voice of
# their own). VoxCPM2 (Apache-2.0) designs `candidates` voices from the bible's voice notes and appearance, each
# reading anchor_text (~15 s); one is picked automatically, never by ear: word error rate within max_wer (the speech
# gate's Whisper, run on the GPU worker), speaker-embedding cosine distance at least min_distance from every other
# creator's voice (SpeechBrain ECAPA, Apache-2.0), then the lowest WER, then the highest pitch variance (least
# monotone). Speech is generated piece by piece (long text degrades), `takes` per piece, the lowest WER kept, pieces
# joined as set out under "Natural speech" below. cfg_value / inference_timesteps are VoxCPM2's README values.
# optimize: torch.compile on load (slower start, untested here). pitch_hz: the pitch tracker's range.
# Creators without a designed voice keep Kokoro (anchors.voice.engine: kokoro).
voice:
  engine: voxcpm
  model: openbmb/VoxCPM2
  candidates: 4
  takes: 2
  anchor_text: "Okay, so this morning did not go to plan. I missed the early train, spilled half my coffee, and still
    made it on time somehow. Honestly, I think the trick is just not panicking. Anyway, here's what I learned."
  pause_s: 0.25
  max_wer: 0.1
  min_distance: 0.35
  cfg_value: 2.0
  inference_timesteps: 10
  optimize: false
  embedding: speechbrain/spkrec-ecapa-voxceleb
  pitch_hz: [65, 500]
  kinds: {design: voice.design, speak: voice.speak}
  # Natural speech (plan 2026-11-22-video-quality-autonomous item 7; research 2026-11-22-video-quality-wave2-3 §6).
  # synthesis: whole_line (one generation per line: the model's own intonation across the sentence) or clauses
  # (each line spoken clause by clause: commas, semicolons, colons, dashes, ellipses, sentence ends; never inside
  # numbers or after abbreviations; a clause under clause_min_words joins its neighbour). whole_line until the two
  # are compared by ear and by WER in the breadth test (voice.speak payload `compare: true` makes both; clauses
  # resets intonation at every comma). Either way pieces are joined with our silences, each drawn from its range
  # with the job's seeded RNG
  # (spontaneous English: clause pauses mostly under 0.5 s, sentence pauses mostly over). A line's explicit
  # pause_after_s replaces the gap after it; pause_s above is only the fallback for payloads without these keys.
  # Each take is trimmed of its own silence (frames more than threshold_db below its loudest, keeping pad_ms) and
  # faded over fade_ms at both edges (no clicks), so the gaps are exactly what we chose. Takes are scored per
  # clause; a clause whose every take is above max_wer x clause_retry_wer_factor gets one more round of seeds; a
  # line still above line_max_wer after assembly fails the job (retried with new seeds).
  synthesis: whole_line
  # clone: ultimate (every line cloned from the reference clip AND its transcript, the delivery as the instruction:
  # one timbre across lines) or controllable (a line with a delivery from the clip alone: the timbre drifted). The
  # VoxCPM README shows the delivery parenthetical with controllable cloning; with ultimate cloning it is unmeasured:
  # listen to a few directed lines in the breadth test.
  clone: ultimate
  # Measured 2026-11-24 (breadth rerun): with ultimate cloning the model READS the delivery aloud ("Musing, a little
  # out of breath, walking home...", "A quiet, sincere, one thing..."): every directed line failed intelligibility.
  # So deliveries go to the model only with controllable cloning (creator/voice_lab.speak_payload).
  deliveries_spoken: {ultimate: false, controllable: true}
  clause_min_words: 2
  clause_gap_s: [0.18, 0.30]
  sentence_gap_s: [0.45, 0.70]
  trim: {threshold_db: -40, frame_ms: 10, pad_ms: 30}
  fade_ms: 8
  clause_retry_wer_factor: 3.0
  line_max_wer: 0.25
  # EXPERIMENTAL, off: a quiet synthetic in-breath (numpy pink noise, band-limited, Hann envelope; nothing sampled)
  # in the gap before every n-th sentence, ending lead_s before it; skipped when the gap is shorter than the breath.
  breaths: {enabled: false, every_n_sentences: 3, gain_db: -42, seconds: [0.12, 0.22], band_hz: [500, 4000],
            lead_s: 0.05}
  # EXPERIMENTAL, off: now and then (rate per clause, at most max_per_line) a filler before a clause. Changes what is
  # spoken, never the scripted words: meta.clauses keeps the script and meta.fillers lists what captions must drop.
  disfluency: {enabled: false, rate: 0.06, max_per_line: 1, fillers: [so, um, like]}

# What the Brain may explore. It picks creators and niches inside this scope itself.
scope:
  niche: "lifestyle, wide net: daily life, style, food, home, travel, fitness-as-lifestyle, humor"
  platforms: [instagram, tiktok]
  # News is allowed (owner 2026-11-19): real everyday news or fictional, but never hot-button or sensitive
  # stories. Fictional organisations a creator belongs to are fine and persist (memory, key employer).
  excluded_topics: [politics, elections, wars and conflicts, tragedies and disasters, crime stories,
                    health scares, culture-war topics, health advice, medical claims, financial advice,
                    crypto, gambling, sexualized content, minors, real brands without rights]
  creator_min_age: 21
  disclosure_line: "AI-generated character"

research:
  hashtags_per_platform: 6
  items_per_hashtag: 30
  max_items_per_run: 400
  theses_per_run: 5
  apify_actors:
    instagram: apify~instagram-hashtag-scraper
    tiktok: clockworks~tiktok-scraper
  usd_per_1k_items: {instagram: 2.70, tiktok: 1.70}   # for the ledger; check the Apify invoice
  # Discovery on a cadence (brain.discover.ensure_due, from the Brain cycle; a brain.scouts job): every_days after the
  # last discovery (scheduled or `mw discover`); 0 = by hand only. Never while operations.mode is paused.
  discover: {every_days: 7}

# Trend watcher (manyworlds.research.trends; `mw trends tick|loop|brief <niche>|spend`; Fly process `trends`).
# Owner 2026-11-22: know what is working, hot or cooling, hooks and patterns, at most $3 a day. Off until the owner
# sets enabled: true. Every cent is in the ledger under agent trends:<stage>; each stage stops at its share.
# ScrapeCreators bills one credit per request (a search page returns many posts); usd_per_credit is an estimate
# (its pricing page was unreadable 2026-11-21): check the invoice and correct it.
trends:
  enabled: false
  daily_usd_max: 3.0
  stage_share: {collect: 0.4, analyze: 0.45, synthesize: 0.15}
  usd_per_credit: 0.002
  loop_minutes: 30
  refresh_hours: 3             # per niche: searches again (posts seen again give velocity)
  region: US
  tiktok_date_posted: this-week
  tiktok_sort_by: relevance
  instagram_date_posted: last-week
  trending_feed: true          # TikTok's trending feed too, as niche `_trending`
  window_days: 7
  min_outlier: 0.5             # log10 views over the niche median: 0.5 is ~3x the median
  outliers_per_group: 8        # per niche and platform, per tick
  controls_per_group: 4        # ordinary posts described too, so winners are compared with something
  feature_batch: 8
  usd_per_feature_batch_estimate: 0.01
  cover_max_bytes: 400000
  min_n: 5                     # a pattern needs this many outliers behind it
  min_outliers_for_brief: 10
  usd_per_brief_estimate: 0.05
  hook_examples: 12
  patterns_max: 25
  findings_per_brief: 6
  tentative_min_n: 20          # research findings are speculative below this, tentative above; never proven
  default_market: night routine   # for creators with no market of their own
  markets:
    - {name: night routine, queries: [night routine, 4am routine, cozy night in], platforms: [tiktok, instagram]}
    - {name: talking to camera, queries: [storytime, honest rant, things nobody tells you], platforms: [tiktok, instagram]}
    - {name: ai creators, queries: [ai influencer, ai generated character], platforms: [tiktok, instagram]}

creator_lab:
  # Who a creator is (owner 2026-11-21): someone people would choose to follow. Added to the bible and profile prompts,
  # with `captions.voice_guide` for how they write.
  persona_guide: >-
    Design someone a stranger would follow after three posts: real taste (specific places, music, food and
    objects; never real brands), a clear point of view and a few opinions people could disagree with, a sense of
    humour that is theirs (dry, chaotic, deadpan, warm), a flaw or two, and a life with texture (a job, friends,
    a neighbourhood, routines). Current and culturally aware without chasing trends. Never a generic wholesome
    lifestyle account, a mood board, a motivational voice or a polished brand; never cringe.
  # A voice of their own (manyworlds.voices): a fixed blend of `mix` stock Kokoro voices led by the bible's pick
  # (weight >= lead), at least min_distance (L1 over the weights) from every other creator's voice.
  voice_blend: {mix: 3, lead: 0.5, min_distance: 0.5}
  reference_prompts: 12          # angles/scenes in the reference pack
  candidates_per_reference: 4
  lora: {steps: 1200, rank: 16, learning_rate: 0.0001, resolution: 1024, log_upload_seconds: 120}
  lora_scale: 1.0               # 1.3 did no better on Maren (2026-11-14)

# Model weights served from our bucket (manyworlds.worker.models): rented machines load them
# from R2 (free egress, no rate limits) instead of Hugging Face. The producer queues one
# mirror job per repo that isn't in the bucket yet.
models:
  mirror:
    - {repo: Tongyi-MAI/Z-Image-Turbo, kind: image.mirror}
  max_mirror_jobs: 8           # each try resumes from what the bucket already has
  priority: 10

# Creator profiles (manyworlds.creator.profile). Dials are set per creator by the Brain (or a
# human) within dials_limits; these defaults seed new profiles.
creators:
  profile_role: creator
  dials_default:
    posts_per_day: {tiktok: 3, instagram: 2}
    images_per_video: 3          # early on: three photo posts per video post
    hashtags_max: {instagram: 1, tiktok: 2}   # Instagram says hashtags barely affect reach; TikTok reads caption words
  dials_limits: {posts_per_day_max: 6, images_per_video_min: 1, images_per_video_max: 6, hashtags_max: 3}

# Content planner (manyworlds.brain.planner): one Brain call per creator per period, rolling.
# formats: images per post [min, max]. Video posts belong to one of the creator's video series.
# The Brain (docs/superpowers/specs/2026-11-14-brain-design.md): agents run as brain.<agent> jobs on the
# control host. Daily LLM budgets per agent sit inside the master operating budget.
# The master switch (owner 2026-11-21): nothing runs on its own until the owner says so (manyworlds.operations).
# paused: no planning, production, publishing or launches; the Brain worker runs only test jobs; GPU machines
# start only for batches with these prefixes. Safety enforcement always runs. Only the owner sets `live`.
# test_overlay: the breadth test's settings (policy/test_overlay.yaml, `mw test breadth`), deep-merged over this policy
# for work in batches starting with `batches` only: the driver's own posts, and the autoscaler's choice of machine for
# them (autoscale.merge_families there). Production never reads it.
operations: {mode: paused, test_batch_prefixes: [bench-, test-],
             test_overlay: {path: policy/test_overlay.yaml, batches: [test-breadth-]}}

# What rented GPU machines (hosts we don't control) may hold (manyworlds.deploy.credentials).
# required: no machine starts without the scoped credential; shared: fall back to the control plane's own.
# worker_storage is shared until a bucket-scoped R2 token exists (WORKER_AWS_ACCESS_KEY_ID/_SECRET_ACCESS_KEY).
# worker_storage: presigned gives machines no storage key at all: every job carries presigned links for what it reads
# and writes (manyworlds.deploy.presign), signed on the control plane by the autoscaler tick. Off (shared) until both
# GPU worker images are rebuilt with it and it has run on a GPU.
security:
  worker_database: required
  worker_storage: shared           # presigned passed one image job on a Vast 4090 (2026-11-24); talk/comfy/music workers untested
  presigned:
    link_seconds: 43200              # a link's life: queue wait plus the attempt (at least attempt + 2 x refresh_ahead)
    max_link_seconds: 604800         # S3 SigV4's limit (7 days)
    refresh_ahead_seconds: 1800      # re-sign a claimable job's links this long before its claim_by (> tick_seconds)
    upload_margin_seconds: 900       # added to the longest attempt (gpu_runs.max_attempt_minutes_*): outputs upload last
    refresh_batch: 500               # jobs signed per autoscaler tick
    http_timeout_seconds: 600        # one GET or PUT through a link on the worker
    # Kinds on our own machines keep the store's keys and get no links: the Fly finisher, hosted APIs and the Brain.
    keyed_kinds: ["finish.*", "hosted.*", "brain.*"]
    # Write links per job: assets/<creator>/<job>/<NN><suffix> for NN below max(outputs_per_job, output_slots).
    output_slots: 8
    output_suffixes: [.png, .jpg, .webp, .mp4, .wav, .mp3, .json, .safetensors]
    extra_puts: {train.lora: ["logs/{job_id}/train.log"]}   # objects a handler writes itself (train_lora's log)

# Owner alerts (manyworlds.notify): owner events and pending approvals pushed via ntfy (topic in NTFY_TOPIC).
# max_age_hours: older unsent items are never pushed (no flood when the topic is first set).
# machine_stop_reasons: GPU stops worth a message (idle and deadline stops are routine).
notify:
  ntfy_server: https://ntfy.sh
  timeout_seconds: 10
  max_per_run: 5
  max_age_hours: 24
  body_chars: 400
  body_chars_by_type: {daily_summary: 1500}
  daily_summary_hour: 13         # UTC: yesterday's summary (manyworlds.summary) after this hour
  quiet: []
  machine_stop_reasons: [max_usd, daily_gpu_budget, stuck, never_started, attempt_timeout, unregistered]
  priority: {publish_held: high, launch_failed: high, provider_unfunded: high, not_launching: high,
             machine_stop_failed: urgent, machine_stopped: default, autoscaler_failed: high,
             brain_step_failed: default, account_needed: default, approval_launch: high, daily_summary: low}

# Master operating budget (spec 6): the Brain allocates inside it; raising it needs the owner.
budget: {master_usd_per_month: 750, reserve_share: 0.15}

brain:
  # The archetype library (manyworlds.brain.archetypes): playbooks the talent manager, showrunner and director read.
  # extra: more playbook files merged in (a name already in `file` wins); musician-v1: AI musician creators (music.*).
  archetypes: {file: archetypes-v1.yaml, extra: [musician-v1.yaml]}
  # The aesthetics library (policy/aesthetics): shot vocabulary, consistency and variety rules, grades, carousel templates.
  aesthetics: {file: aesthetics-v1.yaml}
  # The style director (brain/agents/style_director.py): each creator's style, world (anchor sets, travel, carousel
  # brand) and a monthly season (capsule wardrobe, trips). A launch step; existing creators get one when missing.
  style_director: {enabled: true, role: style_director, effort: medium, season_days: 30, min_faceless_families: 4}
  llm_usd_per_day: {default: 2.0, showrunner: 3.0, evaluator: 3.0, strategist: 2.0, scouts: 3.0, sandbox: 1.0,
                    creator_lab: 5.0, director: 2.0, talent_manager: 2.0, market_lead: 1.0, style_director: 1.0,
                    comment_themes: 0.5, idea_reviser: 0.5, lyricist: 0.5, music_critic: 0.5,
                    head_of_music: 0.5, a_and_r: 0.5, music_talent_manager: 1.0, songwriter: 1.0, producer: 0.3,
                    vocal_director: 0.3, melody: 0.3, mix_master: 0.3, curator: 0.3}   # lyricist: original lyrics for song posts (music, off); director: one shot-sheet call per scheduled post; creator_lab: bible + vision anchor picks + profile per launch   # sandbox: all test runs together
  # Added per active real creator per day, for agents whose work grows with the portfolio (budget.daily_cap).
  # Measured 2026-11-21 (Claude): showrunner ~$0.06 a creator a day; evaluator ~$0.11 at 3 samples an idea, about a
  # third of that at one.
  llm_usd_per_creator_day: {showrunner: 0.10, evaluator: 0.10, director: 0.20, talent_manager: 0.05}
  runtime: {loop_seconds: 30, max_jobs_per_tick: 10, lease_seconds: 600}
  # Experiments (manyworlds.brain.experiments): a tentative finding becomes a randomised two-arm test. Slots are
  # assigned per batch; the result is read once, when each arm has its sample (no peeking). The sample per arm
  # is sized for `power` to detect `mde` (log-lift; 0.4 = ~50% more reach) given the creator's measured outcome
  # spread (default_sd until there is enough data), within [min_sample, max_sample]. Small samples miss real
  # effects: 6 per arm could not confirm a planted +0.5 (2026-11-20 sandbox).
  experiments: {max_open_per_creator: 1, slots_per_batch: 4, min_sample: 10, max_sample: 60, mde: 0.4, power: 0.8,
                alpha: 0.05, default_sd: 0.6}
  # Exploration directions (manyworlds.brain.exploration): Thompson draws over measured effects and untried
  # formats/stagings (prior N(0, prior_sd) in log-lift); the top `directions` steer the exploratory ideas.
  exploration: {directions: 3, prior_sd: 0.3}
  # Feed QA at scheduling (manyworlds.brain.feed_qa): ideas that would repeat an attribute value more than
  # max_repeat times in the last `window` posts, near-duplicate a recent caption or scene (similarity 0-1), or
  # score below a floor on an idea-rubric dimension (naturalness: doesn't sound like them) are dropped.
  # Experiment ideas are exempt, so their arms stay comparable.
  qa: {window: 12, max_repeat: 2, repeat_attributes: [outfit, setting], similarity: 0.85, min_chars: 20,
       min_scores: {naturalness: 4}}   # min_chars: shorter texts (a word or two) may repeat
  # Critic-revise (manyworlds.brain.revise, brain/agents/idea_reviser.py): an idea under a qa.min_scores floor by at
  # most `margin` on every dimension it misses is rewritten once (role idea_revise, one call, the critic's reasons in
  # hand) instead of dropped; the rewrite is evaluated like any idea and scheduled or dropped on its own score. At most
  # max_per_idea revisions in an idea's line and max_per_batch per batch, within brain.showrunner.max_wait_hours.
  revise: {enabled: true, margin: 1, max_per_idea: 1, max_per_batch: 2, role: idea_revise, effort: low}
  # Events (manyworlds.brain.events): detectors over durable state, each event raised once and routed; at most
  # max_per_type_per_creator_per_day per type and creator, and one routed job per creator and route per tick.
  events:
    window_hours: 72             # breakouts among posts published this recently
    baseline_posts: 10           # previous posts compared at a similar age (age_tolerance: +-50%)
    age_tolerance: 0.5
    lookback_posts: 60
    breakout_ratio: 3.0          # reach >= this x baseline
    drop_posts: 4                # this many posts in a row...
    drop_ratio: 0.5              # ...below this x baseline
    qa_min_posts: 4              # qa_surge: of at least this many posts touched in a day...
    qa_drop_share: 0.5           # ...more than this share dropped
    max_per_type_per_creator_per_day: 3
    routes: {breakout: analyst, drop: talent_manager, qa_surge: owner}   # drop: the manager diagnoses (mode diagnose)
  # Launches (manyworlds.brain.launches): an approved launch walks bible -> reference pack -> anchors -> LoRA ->
  # profile -> ready (sandbox + account request); a step whose jobs fail is retried this many times, then stops.
  launches: {max_step_retries: 2, step_timeout_hours: 48, min_reference_renders: 8}
  # The strategist (manyworlds.brain.agents.strategist, daily): proposes stage moves and launches; code checks them.
  strategist:
    enabled: true
    effort: medium
    stages: [exploring, iterating, growing, breaking_out, established, paused, retired]
    downward_stages: [paused, retired]
    min_posts_before_downward: 30      # real posts...
    min_days_before_downward: 21       # ...and days live before any move down (patience: principle 2)
    min_adjustments_before_retire: 2   # strategy changes tried first
    approval_moves: [retired]          # the owner confirms retirements
    launch_requires_approval: true     # until the owner says otherwise, launches wait in mw brain approvals
    max_active_creators: 5             # incl. launching and pending launch approvals
    launches_per_week: 0               # owner 2026-11-21: no new creator launches for now (was 2)
    est_launch_usd: 3.0                # reference pack + voice + LoRA + Claude steps, roughly
    thesis_candidates: 8
    # Conviction: belief about weekly log growth of reach (real data only), prior N(prior_mean, prior_sd).
    conviction: {prior_mean: 0.0, prior_sd: 0.15, min_weeks: 3, voi_weight: 0.5, alternative_mean: 0.0, retire_margin: 0.02}
  exploration_share: 0.3          # share of each batch spent on untried directions and open experiments
  # Creative evaluation (manyworlds.brain.evaluation): each item scored `samples` times; median and
  # spread kept. check_rate of items also get an evaluator_check score. max_spread: calibration bar.
  # samples: 1 since 2026-11-21 (was 3): two more only for an idea within resample.margin of a feed-QA floor, the
  # only place a score drops an idea. At thousands of creators, three calls per idea tripled the largest Brain bill.
  evaluation: {samples: 1, resample: {margin: 1, extra: 2}, check_rate: 0.1, check_samples: 1, effort: low,
               prompt_version: "eval-v1", max_spread: 2, reference_images: 2}
  # The talent manager (brain/agents/talent_manager.py): one per creator, reports to the strategist. Onboard builds
  # the dossier (manyworlds.creator.dossier) at launch; a weekly review (review_weekday, 0 = Monday) writes the brief
  # the showrunner plans from and changes the profile only under `editable` (path prefixes; identity, the never-list,
  # disclosure and handle never). max_overlap: positioning word overlap with a sibling above which it is rewritten.
  # resolved_predictions: its own scored predictions about the creator, shown at each review. look.wardrobe stays
  # editable, but once the style director has written her style, profile.render_bible renders the wardrobe and the
  # signature details from the style instead (one source of truth for the look).
  talent_manager: {enabled: true, role: talent_manager, effort: medium, diagnose_effort: high, recent_posts: 30, stats_days: 14,
                   max_overlap: 0.35, resolved_predictions: 10,
                   # how often a creator's review comes round, by stage (days); events (a drop) come on top
                   review_days_by_stage: {default: 7, exploring: 7, iterating: 5, growing: 3, breaking_out: 2,
                                          established: 7, paused: 30},
                   editable: [look.wardrobe, look.situational_looks, look.makeup, persona.traits, persona.humour,
                              content, content_system, arc, story, audience_insight, positioning, dials.tone_mix]}
  # Decision rights (manyworlds.brain.proposals; docs/superpowers/plans/2026-11-23-agency.md): who decides each kind
  # of request, and what each role may decide alone. Code checks them; the model only argues. Anything over a role's
  # rights goes to the owner.
  rights:
    routes: {tier_change: strategist, production_upgrade: strategist, budget: strategist, cohort: strategist,
             research: analyst, experiment: talent_manager, escalate: owner, artist_concept: head_of_music}
    # kinds accepted as filed (within the requester's weekly allowance below): research runs the analyst at once,
    # an experiment is the manager's own call
    auto_accept: [research, experiment]
    cooldown_days: 14              # a rejected request comes back only with new evidence or after this
    due_days: 3                    # undecided past this, it expires (the chief of staff reports it)
    max_open_per_creator: 3
    talent_manager: {research_per_week: 2, budget_per_week: 1, tier_change_per_week: 1}
    strategist: {max_usd_per_request: 20, tier_changes_per_day: 5}
    head_of_music: {tier_change_per_week: 3}
    music_talent_manager: {tier_change_per_week: 1}
  # Production tiers (creator_states.tier, set by the CEO). usd_per_day is the planning estimate the finance check uses
  # for a change. The showrunner plans within posts_per_day_max and
  # video_share_max (proposals.tier_dials); production spends within `production` (production.common.tier_production):
  # image candidates per scene (else production.candidates_per_scene) and the routes each output may take (a subset
  # of production.routing.<output>.kinds, in its order; unlisted = all). Economy never pays a hosted video API.
  tiers:
    default: economy
    levels:
      economy:  {posts_per_day_max: 2, video_share_max: 0.3, usd_per_day: 0.5,
                 production: {candidates_per_scene: 2, routes: {story_clip: [comfy.wan_i2v]}}}
      standard: {posts_per_day_max: 3, video_share_max: 0.5, usd_per_day: 1.5,
                 production: {candidates_per_scene: 3}}
      premium:  {posts_per_day_max: 4, video_share_max: 0.7, usd_per_day: 4.0,
                 production: {candidates_per_scene: 4}}
  # The predictions ledger (manyworlds.brain.predictions): a claim with nothing published to measure closes unscored.
  predictions: {give_up_days: 14, min_horizon_days: 7, max_horizon_days: 180}
  # Market leads (brain/agents/market_lead.py): activated for a market with min_creators active portfolio creators, or
  # one the CEO opened (markets.dossier.lead = open); a run every review_days.
  market_lead: {enabled: true, role: market_lead, effort: medium, min_creators: 3, review_days: 7, trend_briefs: 3}
  # The chief of staff (manyworlds.brain.chief_of_staff, code): predictions resolved, overdue requests expired, failing
  # agents and spend without decisions reported, owner requests chased.
  # decision_agents: the agents that record a decision every run (brain/runtime); only they can spend "without output"
  # (the director, evaluator, reviewers and comment drafts spend without decisions by design).
  chief_of_staff: {enabled: true, window_hours: 24, failing_jobs: 3, idle_spend_usd: 0.5, owner_wait_days: 3,
                   decision_agents: [strategist, talent_manager, market_lead, showrunner, analyst, creator_lab, style_director, scouts,
                                     idea_reviser, comment_themes, music_critic, head_of_music, a_and_r,
                                     music_talent_manager, curator]}
  # The showrunner (brain/agents/showrunner.py) plans `days` ahead from memory, recent scores and findings.
  showrunner: {role: showrunner, enabled: true, days: 3, recent_posts: 30, memory_facts: 60, max_wait_hours: 6, max_period_attempts: 3, retry_after_hours: 12, effort: medium}
  # Series continuity (manyworlds.brain.series): episodes enter at publication; the showrunner sees, per series (at
  # most max_series), its next episode number, the last episodes_shown episodes and up to threads_shown open threads.
  series: {max_series: 6, episodes_shown: 3, threads_shown: 5}
  # Comment themes (brain/agents/comment_themes.py): at most every every_hours per creator, once min_new comments
  # arrived since the last summary; reads the last window_days (at most max_comments, each cut to comment_chars) and
  # keeps max_themes themes; the showrunner sees the `shown` largest. No comments, no call.
  comment_themes: {enabled: true, role: comment_themes, effort: low, every_hours: 24, min_new: 3, window_days: 14,
                   max_comments: 80, comment_chars: 240, max_themes: 6, theme_chars: 200, shown: 6}
  # The analyst agent (brain/agents/analyst.py): reasoning effort of its notes call.
  analyst: {effort: medium}
  # The analyst (brain/analysis.py): outcomes at target_age_s as log-lift over the baseline window; effects
  # graded tentative only past a Bonferroni-corrected interval at family-wide alpha with min_n_tentative posts.
  analysis: {target_age_s: 259200, target_age_tolerance_s: 86400, min_n_any: 8, min_n_tentative: 20, min_group: 5, min_group_tentative: 10, bootstrap: 300, alpha: 0.1,
             baseline_window: 20, min_baseline: 3, breakout_ratio: 3.0}
  # What the Brain may change on its own (manyworlds.brain.overrides), with inclusive bounds; `*` is one
  # path segment. Anything else, and always `limits.*` and `budget.master*`, waits for owner approval.
  authority:
    # Sections read through the effective policy. Only Brain agents do so today; the producer, reviewer
    # and autoscaler read this file, so overrides elsewhere are refused rather than silently ignored.
    observed_sections: [brain]
    # Single paths read through overrides outside those sections: llm.roles.<role> by every service's LLM router
    # (an approved model switch from manyworlds.selection). Never autonomous: a switch always waits for the owner.
    observed_paths: ["llm.roles.*"]
    autonomous:
      - {path: "brain.exploration_share", min: 0.1, max: 0.6}
      - {path: "brain.llm_usd_per_day.*", min: 0, max: 5}

planner:
  role: brain
  effort: medium
  days: 3                      # short periods: each plan sees the latest posts and settings
  plan_ahead_days: 2           # the producer plans the next period when less than this is planned
  auto_statuses: [draft, active]   # creators the producer plans for (needs a profile and reference images)
  formats: {photo: [1, 1], carousel: [2, 4], narrated_edit: [3, 6], story_clip: [1, 4], story: [1, 1], talking_video: [1, 3]}
  video_formats: [narrated_edit, story_clip, talking_video]
  # What each format can show; the planner writes to these limits.
  format_notes:
    photo: "one candid photo"
    carousel: "2-4 photos of the same moment, evening or day, in order"
    narrated_edit: "3-6 photos in sequence with the creator's own voice reading `script` (15-30 s of natural speech, said the way they talk) and burned-in captions; routine montages belong here"
    story_clip: "a silent video: 1-4 shots of about 5 seconds, each animated from its own photo with one simple motion (steam rising, a hand lifting a mug, a few steps down a street), joined with cuts or transitions (generation.clip_edit): outfit checks, recipe steps, a walk through a city, a slow morning; `script` says what moves in the first shot. One action per shot, never a montage inside one shot"
    talking_video: "the creator talks to camera, lip-synced in their own voice: ONE scene where they face the camera, chest-up, in the place they are speaking from (the start frame), optionally followed by one or two cutaway scenes (what they talk about, or their hands, room or street, never another face to camera) shown while they keep talking, and `script` = exactly what they say (10-90 s of natural speech in full sentences, said the way they talk, no stage directions; long scripts are rendered in segments)"
    story: "ONE vertical throwaway Story photo: a quick in-the-moment glimpse (the view, the coffee, the mess, a mood); casual, unposed, 0-6 words of caption; not a grid post"
  post_hours_utc: [12, 15, 17, 19, 21, 23]   # nth post of a day goes out at the nth hour
  recent_posts: 30             # shown back to the planner for continuity

# Flavors (owner 2026-11-19: "more flavors"): conventions for the pipelines we have, offered like stagings and
# recorded as an idea attribute. Flavors that need text drawn on the image (tier list, recipe card, text-on-photo
# memes) wait for a text-overlay step for photos; until then they are not listed here.
flavors:
  library:
    photo_dump: {formats: [carousel], note: "3-4 different moments from the past days (not one scene), in order, a casual round-up"}
    expectation_vs_reality: {formats: [carousel], note: "photo 1 is what they pictured, photo 2 what actually happened; the caption lands the joke"}
    travel_diary: {formats: [carousel], note: "a day somewhere (a nearby town counts), one photo per moment, morning to night"}
    outfit_of_the_week: {formats: [carousel], note: "the week's outfits, one per photo, same mirror or spot, small changes in mood"}
    before_after: {formats: [carousel], note: "the same place or thing before and after (tidying, a plant, a haircut, a repaint)"}

# Stagings (owner 2026-11-19): a format plus a recognisable setting, framing, wardrobe and script conventions.
# The showrunner may give an idea one (or none: most posts are plain); each idea records its staging as an
# attribute, so the analyst learns which work for which creator. Only stagings whose formats production makes
# are offered. Outlets, leagues, teams and shows are always fictional; a creator who reports for an outlet keeps
# it (memory fact `employer`); changing outlet is a storyline beat (canon with canon_key `employer`).
stagings:
  rules: "Fictional outlets, leagues, teams and shows only, never real ones. If a staging needs an outlet and the creator has no `employer` fact, invent a fictional one and record it as canon with canon_key `employer`; afterwards always use that outlet."
  library:
    press_conference: {formats: [talking_video], setting: "post-game press conference: podium with a fictional league's sponsor-free backdrop, or a locker room or courtside", framing: "chest-up behind a mic cluster, slightly off-centre", wardrobe: "team kit or warm-up jacket of a fictional team", script: "short answers to an unheard question, a little out of breath, deadpan or emotional"}
    field_reporter: {formats: [talking_video], setting: "on location where the story is: a street, a market, a queue, a park", framing: "chest-up holding a mic with a fictional outlet's flag, the scene behind", wardrobe: "practical coat, outlet lanyard", script: "news-report cadence about an everyday or fictional story, signs off with name and outlet"}
    news_desk: {formats: [talking_video], setting: "studio news desk of the creator's fictional outlet, screens behind", framing: "seated, chest-up, centred", wardrobe: "smart blazer", script: "anchor cadence, a headline then two lines, a light closing aside"}
    weather_map: {formats: [talking_video], setting: "in front of a weather map of a real or fictional place", framing: "half-body, gesturing at the map", wardrobe: "bright presenter dress or suit", script: "forecast delivery, can be about mood or life instead of weather"}
    commentary_booth: {formats: [talking_video], setting: "commentary booth above a fictional match or an everyday event", framing: "headset, chest-up, looking down then to camera", wardrobe: "headset, casual shirt", script: "play-by-play energy about something small (a cat, a parking attempt)"}
    nature_documentary: {formats: [talking_video], setting: "outdoors among the 'wildlife' (pigeons, a flatmate, a toddler-free park)", framing: "crouched, whispering to camera", wardrobe: "field jacket", script: "hushed documentary narration of ordinary behaviour"}
    late_night_monologue: {formats: [talking_video], setting: "small stage with a curtain or a desk with a city backdrop", framing: "standing, waist-up", wardrobe: "suit or sharp outfit", script: "two or three jokes about the creator's week, setup and punchline"}
    reality_confessional: {formats: [talking_video], setting: "a confessional booth or a chair against a plain wall", framing: "seated, tight chest-up, direct to camera", wardrobe: "everyday", script: "candid, slightly dramatic aside about something that just happened"}
    tour_guide: {formats: [talking_video], setting: "a street, landmark-free square, museum-like hall or the creator's own flat", framing: "walking backwards or standing, chest-up", wardrobe: "lanyard, comfortable shoes", script: "guide patter, facts (true or playful) about the place"}
    cooking_host: {formats: [talking_video], setting: "the creator's kitchen, ingredients out", framing: "behind the counter, waist-up", wardrobe: "apron", script: "one recipe step or tip, a small mess, chatty"}
    walk_and_talk: {formats: [talking_video], setting: "walking down a street or a path", framing: "selfie-held phone at arm's length", wardrobe: "the creator's usual outfit", script: "talking to the phone like to a friend: a story, an opinion, an update"}
    asmr: {formats: [talking_video], setting: "a quiet, softly lit room", framing: "close-up, soft focus behind", wardrobe: "cosy", script: "very softly spoken, slow, describing small things"}

# Capabilities (owner 2026-11-23: "have all the necessary weapons in our arsenal... exact content will depend on the
# creator archetype"; manyworlds.direction.capabilities): what the pipeline can render, which the director composes
# shots from and the planner and showrunner think in. Formats are containers, not recipes. Each entry:
#   description  what it is, in a few words
#   how          the pipeline paths that render it: photo (Z-Image), story_clip (Wan i2v from the scene photo), talk
#                (lip-synced take), walk_and_talk (motion clip, then V2V lip sync), motion_reference (Wan-Animate from
#                a licensed clip), narrated_edit (photos moving under the voice), joiner (media.concat transitions),
#                finish_overlays (manyworlds.overlays), captions (burned_captions), sound_mix (manyworlds.sound)
#   requires     policy switches that must be on ('a.b' truthy; 'a.b:x,y' a list containing x or y); one off = the
#                entry is unavailable and the director is told not to use it
#   limits       what the models do badly (from the 2026-11-23 research and our benchmarks)
#   write        how a shot sheet asks for it
# Only what production can render is listed (motion references: production renders a shot's motion_reference while
# dance.enabled).
capabilities:
  devices:
    propped: {description: "phone set down on a surface, locked off: talk to camera, GRWM, outfit checks", how: [photo, story_clip, talk], requires: [], limits: "the frame never moves, so the first frame must already have motion in it", write: "framing.device propped, framing.handheld none"}
    locked_off: {description: "the same tripod-still frame repeated across shots, for outfit changes and cuts on motion", how: [photo, story_clip, talk], requires: [], limits: "matches only when set_id, shot_size, angle and light are repeated exactly", write: "device propped, camera_move static, the same set_id, shot_size and angle in every shot"}
    mirror: {description: "she films her reflection, phone in hand at chest height: fit checks, mirror talk", how: [photo, story_clip, talk], requires: [], limits: "reflections and the phone in hand can warp: a plain mirror, the phone still, medium or full body", write: "framing.device mirror; name the mirror in set.set_dressing"}
    selfie_arm: {description: "she holds the phone at arm's length: vlogs, quick updates, walk-and-talk", how: [photo, story_clip, talk, walk_and_talk], requires: [], limits: "close framing only (medium close-up); a light sway, never gimbal-smooth", write: "framing.device selfie, framing.handheld light"}
    pov: {description: "the camera is her eyes: her hands, a cup, the view, the street; faceless B-roll", how: [photo, story_clip], requires: [], limits: "her face is never seen, so in a talking video it is a cutaway; hands stay simple", write: "framing.device pov; blocking names only her hands; cutaway true in a talking video"}
    handheld_follow: {description: "someone walks with her holding the phone: walking vlog, street", how: [story_clip, walk_and_talk], requires: ["production.formats:story_clip,talking_video"], limits: "short and slow; no crowds; motion clips are ~5 s", write: "framing.device held, framing.camera_move follow"}
  framing:
    close_up: {description: "face or a detail fills the frame", how: [photo, story_clip, talk], requires: [], limits: "hands in close-up read as AI; for a detail, a still object", write: "framing.shot_size close-up"}
    medium_close_up: {description: "chest up: the talking frame", how: [photo, story_clip, talk], requires: [], limits: "the default for talk; captions sit low, under the chin", write: "framing.shot_size medium close-up"}
    medium: {description: "waist up: gestures, a prop, a mirror", how: [photo, story_clip, talk], requires: [], limits: "", write: "framing.shot_size medium shot"}
    full_body: {description: "head to toe: outfits, poses, walking in", how: [photo, story_clip, talk], requires: [], limits: "the face is small, so identity is weaker; captions and labels sit mid or upper", write: "framing.shot_size full body, a little headroom, the floor in frame"}
    wide: {description: "she is small in the room or the street: the phone-native look of top clips", how: [photo, story_clip], requires: [], limits: "not for talk (the mouth is too small to read)", write: "framing.shot_size wide"}
    low_angle: {description: "phone low, looking up: walk-ins, full body", how: [photo, story_clip], requires: [], limits: "never for close-ups (it exaggerates the chin)", write: "framing.angle low angle"}
  camera_moves:
    still_or_handheld: {description: "a locked-off frame or a phone held with natural micro-shake", how: [story_clip, talk], requires: [], limits: "", write: "framing.camera_move static or handheld"}
    push_pull: {description: "slow push in or pull out", how: [story_clip, walk_and_talk], requires: ["production.formats:story_clip,talking_video"], limits: "photos ignore camera moves; in talk any move makes the take a walk-and-talk", write: "framing.camera_move push_in or pull_out"}
    pan_tilt: {description: "a slow pan or tilt across the set or an outfit", how: [story_clip, walk_and_talk], requires: ["production.formats:story_clip,talking_video"], limits: "slow, one direction, ~5 s", write: "framing.camera_move pan_left, pan_right, tilt_up or tilt_down"}
    follow: {description: "the camera moves with her", how: [story_clip, walk_and_talk], requires: ["production.formats:story_clip,talking_video"], limits: "short and steady", write: "framing.camera_move follow"}
    orbit: {description: "a slow half circle round her or an object", how: [story_clip], requires: ["production.formats:story_clip"], limits: "small arcs only; backgrounds can bend", write: "framing.camera_move orbit_slow"}
  actions:
    talk: {description: "she talks to the lens in her own voice, lip-synced", how: [talk], requires: ["production.formats:talking_video"], limits: "lip sync cannot hit timed beats: one continuous take per shot, its lines set its length; a still face talking from frame 1 is the weakest AI shape, so open on motion or a hook label", write: "performance.lines (the script's words), eyeline lens on the hook and punchlines"}
    walk_and_talk: {description: "she talks while walking, standing up, turning", how: [walk_and_talk], requires: ["production.formats:talking_video", generation.talk_motion.enabled], limits: "motion clips are ~5 s, chained up to 3 for a longer line; slow steps, no crowds", write: "a beat that says walks, stands up, turns around; or a camera move"}
    walk: {description: "a few slow steps: into frame, toward the lens, along a street", how: [story_clip, walk_and_talk], requires: ["production.formats:story_clip,talking_video"], limits: "short, steady, no turns; feet can warp in full body", write: "a beat 'walks slowly toward the camera'"}
    pose: {description: "small confident poses: hand on hip, hair touch, a step, a look away", how: [photo, story_clip], requires: [], limits: "one pose change per 5 s clip; hold the pose on a cut", write: "one beat per pose, eyeline lens or off"}
    spin_or_hair_flip: {description: "a half spin or hair flip, the motion a match cut hides a change in", how: [story_clip, walk_and_talk], requires: ["production.formats:story_clip,talking_video"], limits: "a quick half turn; full fast spins smear", write: "a beat 'does a quick half spin'; edit.transition_in 'match cut on the spin' on the next shot"}
    motion_reference: {description: "she performs the motion of a licensed reference clip: a casual dance, a pose sequence, a twirl", how: [motion_reference], requires: [dance.enabled], limits: "only the listed clips; ~5 s; the identity gate decides; never the clip's audio", write: "motion_reference: a listed id"}
    prop_work: {description: "a simple action with one prop: holds, lifts, sips, points", how: [photo, story_clip, talk], requires: [], limits: "hands doing fine work (typing, tying, cutting, writing) read as AI: hold, lift, brush only", write: "set.props names it; a beat with eyeline prop and simple hands"}
    makeup: {description: "a brush or wand in hand while she talks (GRWM)", how: [photo, story_clip, talk], requires: [], limits: "application close-ups read as AI: show the tool raised or the result, talk between strokes", write: "set.props the tool; look.makeup the state now"}
    outfit_change: {description: "a different outfit in the next shot of the same set and framing", how: [photo, story_clip, talk], requires: [], limits: "never the change itself; the cut hides it", write: "a new wardrobe.outfit_id per shot, the same set_id and framing"}
    sit_stand: {description: "sits down, stands up, settles on the sofa", how: [story_clip, walk_and_talk], requires: ["production.formats:story_clip,talking_video"], limits: "one movement per clip", write: "a beat 'sits down on the sofa'"}
    stairs: {description: "a few steps up or down", how: [story_clip, walk_and_talk], requires: ["production.formats:story_clip,talking_video"], limits: "short and slow; full body or from behind; feet can warp", write: "a beat 'walks down the stairs'"}
    sing_to_camera: {description: "she sings a part of her own song to the lens, lip-synced to the song's vocal stem; the full mix plays under the video", how: [talk, song], requires: ["production.formats:music_video", music.enabled], limits: "one continuous take, at most music.video.max_seconds; the mouth reads only in medium close-up or closer; sing, don't perform choreography", write: "a music_video post: body.song (lyrics with section tags, tags, bpm, key); the shot's performance is singing, eyeline lens on the hook"}
  edits:
    text_slides: {description: "branded text slides in a carousel: a cover headline, numbered tips, steps, a quote, a comparison, a recap, a save-this ask; her photos sit inside or between them", how: [slides], requires: [slides.enabled], limits: "carousels only; 1-8 slides, short words (a cover 8 words or fewer); for instructive and list posts, never every post", write: "the idea's slides (template, heading, text, items, photo = a scene index)"}
    cut_on_motion: {description: "the cut lands inside a motion both shots share (spin, hair flip, hand over the lens)", how: [joiner], requires: ["production.formats:talking_video,narrated_edit"], limits: "only where shots are joined (talking-video takes and cutaways, narrated edits); a carousel or one clip has none; never mid-sentence", write: "edit.transition_in 'match cut on the spin' (or whip, blur, flash)"}
    labels: {description: "a short label in the upper third: a tip, numbered looks '1.' '2.'", how: [finish_overlays], requires: [on_screen_text.enabled, finishing.enabled], limits: "video only (photos carry no overlays); a few words, 1-3 s each", write: "edit.on_screen_text item kind label (number for a numbered look)"}
    hook_text: {description: "big text in the first second that opens the story", how: [finish_overlays], requires: [on_screen_text.enabled, finishing.enabled], limits: "first shot only, gone by 2 s", write: "edit.on_screen_text item kind hook at start_s 0 in the first shot"}
    timestamps: {description: "a time per moment ('7:30 AM coffee'), day-in-the-life", how: [finish_overlays], requires: [on_screen_text.enabled, finishing.enabled], limits: "one per shot", write: "edit.on_screen_text item kind timestamp"}
    question_bubbles: {description: "a question in a white bubble at the top, as if replying to a comment", how: [finish_overlays], requires: [on_screen_text.enabled, finishing.enabled], limits: "never a real username; the first seconds", write: "edit.on_screen_text item kind question"}
    voiceover_broll: {description: "her voice over moving photos of the day, no lip sync", how: [narrated_edit], requires: ["production.formats:narrated_edit"], limits: "the photos move gently; the voice carries the story", write: "a narrated edit: the script is the voiceover, the shots are the B-roll"}
    cutaways: {description: "B-roll under her voice inside a talking video", how: [talk, narrated_edit], requires: ["production.formats:talking_video", generation.talk_hybrid.enabled], limits: "never another face to camera; one per idea or two", write: "cutaway true on the shot"}
  text:
    word_captions: {description: "her spoken words burned in, word-timed, in a caption style", how: [captions], requires: [burned_captions.enabled], limits: "spoken formats only (burned_captions.formats); talk-led creators; outfit, pose and aesthetic videos carry labels instead", write: "edit.caption_style a caption style name, or empty for the creator's"}
    labels_only: {description: "no word captions: only labels and the hook", how: [captions, finish_overlays], requires: [], limits: "", write: "edit.caption_style none"}
  sound:
    voice: {description: "her designed voice, on camera", how: [talk], requires: ["production.formats:talking_video"], limits: "", write: "performance.lines with a delivery"}
    voiceover: {description: "her voice over B-roll", how: [narrated_edit, talk], requires: ["production.formats:narrated_edit,talking_video"], limits: "", write: "the script (narrated edit) or a cutaway's lines"}
    room_tone: {description: "the room's own quiet sound under everything, so nothing ships dry", how: [sound_mix], requires: [sound.enabled, sound.room_tone.procedural], limits: "rooms, streets, rain, cars; no cafe murmur or crowds (noise can't fake voices)", write: "sound.room_tone in plain words that name the place ('her kitchen, fridge hum', 'rain on the window')"}
    music_bed: {description: "a quiet instrumental bed", how: [sound_mix], requires: [sound.enabled, sound.library.entries], limits: "only licensed library beds; none shipped yet, so room tone carries silent clips", write: "sound.music in a few words ('quiet lo-fi bed')"}
  # Music (policy `music`, OFF): original songs made by ACE-Step 1.5 (music.song). Original artists only: never a real
  # artist's name, voice or song in a prompt, tag or lyric.
  music:
    original_song: {description: "an original song in the creator's own artist voice: lyrics written for her, made with vocals, plus a vocal and an instrumental stem", how: [song], requires: [music.enabled], limits: "song snippets for posts (music.video.max_seconds); original lyrics only (brain/lyrics.py checks them); genre and mood words only, never 'in the style of' anyone", write: "body.song: title, lyrics with [Verse]/[Chorus] tags, tags (genre, mood, instruments, vocal), bpm, key, duration_s"}
    instrumental_bed: {description: "an original instrumental bed (no vocals) for any creator's silent clips or edits", how: [song, sound_mix], requires: [music.enabled, sound.library.generated.enabled], limits: "quiet, no hard drops; joins the sound library only after its objective check passed", write: "sound.music in a few words ('quiet lo-fi bed'); the bed comes from the generated library"}

# Moves (owner 2026-11-22, manyworlds.direction): recipes a post may draw on, composed from `capabilities` (`uses`),
# each tagged with the archetypes it suits (`suits`, plain words matched against the creator's archetype and niche)
# and the length that works (`length_s`, from the 2026-11-23 research). Examples, never code paths or formats: the
# director may follow one or compose its own. The showrunner offers them (set `move`; recorded as an idea attribute)
# only when production makes one of their formats AND their readiness is in direction.offer_readiness. readiness:
# ready (the models do it well), partial (short and slow only), not_yet (not offered). `shot` holds the shot-sheet
# defaults for the scene that performs the move (any ShotSheet field).
moves:
  library:
    phone_down_reveal: {formats: [talking_video, story_clip], readiness: partial, suits: [lifestyle, fashion, comedy, beauty], uses: [devices.propped, actions.prop_work, edits.hook_text], length_s: [5, 15], note: "she lowers the phone she was holding in front of her face, revealing her expression; one slow motion, then still", shot: {framing: {shot_size: medium close-up, device: propped, camera_move: static}, blocking: [{at_s: 0, action: "holds her phone up in front of her face", eyeline: screen, hands: "both hands on the phone"}, {at_s: 1.5, action: "slowly lowers the phone and looks into the lens", eyeline: lens}]}}
    walk_to_camera: {formats: [talking_video, story_clip], readiness: partial, suits: [fashion, lifestyle, fitness], uses: [devices.propped, framing.full_body, actions.walk], length_s: [5, 15], note: "she walks a few slow steps toward the propped phone and stops at medium shot; short, steady, no turns", shot: {framing: {shot_size: medium shot, device: propped, camera_move: static}, blocking: [{at_s: 0, action: "walks slowly toward the camera", eyeline: lens, hands: "relaxed at her sides"}, {at_s: 3, action: "stops and settles", eyeline: lens}]}}
    point_at_caption: {formats: [talking_video, story_clip], readiness: ready, suits: [educator, commentary, lifestyle], uses: [devices.propped, actions.pose, edits.labels], length_s: [5, 30], note: "she points to the empty space where the on-screen text overlay goes; the text itself is edit.on_screen_text, never in the image", shot: {framing: {shot_size: medium close-up, device: propped, headroom: generous}, blocking: [{at_s: 0, action: "points up to the empty space above her head", eyeline: lens, hands: "one hand pointing, the other out of frame"}]}}
    storytime_to_camera: {formats: [talking_video], readiness: ready, suits: [storyteller, commentary, comedy, educator], uses: [devices.propped, framing.medium_close_up, actions.talk, edits.hook_text, text.word_captions], length_s: [45, 90], note: "seated, talking to the camera like to a friend; one continuous take; the most surprising line first, as a hook label too; open on a small motion, not a still face", shot: {framing: {shot_size: medium close-up, angle: eye level, device: propped, camera_move: static}, blocking: [{at_s: 0, action: "sits and talks to the camera", eyeline: lens, hands: "relaxed in her lap"}]}}
    outfit_change_spin: {formats: [talking_video, carousel], readiness: partial, suits: [fashion, style, beauty, lifestyle], uses: [devices.locked_off, framing.full_body, actions.spin_or_hair_flip, actions.outfit_change, edits.cut_on_motion, edits.labels, text.labels_only, sound.room_tone], length_s: [9, 20], note: "outfit check: the same spot, framing and light in every shot, a different outfit_id in each; each shot opens inside a half spin or hair flip (edit.transition_in 'match cut on the spin'); numbered labels '1.' '2.' '3.' with a two-word note; one short line per look or none; caption_style none; never the change itself", shot: {framing: {shot_size: full body, device: propped, camera_move: static}, blocking: [{at_s: 0, action: "does a quick half spin and settles into a pose", eyeline: lens, hands: "one hand on her hip"}], edit: {transition_in: match cut on the spin, caption_style: none}}}
    talk_while_doing: {formats: [talking_video], readiness: partial, suits: [beauty, lifestyle, storyteller, wellness], uses: [devices.propped, framing.medium_close_up, actions.talk, actions.makeup, actions.prop_work, edits.question_bubbles, text.word_captions], length_s: [45, 95], note: "GRWM: she talks to the propped phone while doing something simple with her hands (a brush raised, hair being clipped up, a mug); the first frame is already in motion; a question bubble at the top in the first seconds; eyes to the lens on the hook and punchlines, down at her hands between; the finished look at the end", shot: {framing: {shot_size: medium close-up, device: propped, camera_move: static}, blocking: [{at_s: 0, action: "already clipping her hair up as she starts to talk", eyeline: prop, hands: "both hands at her hair"}, {at_s: 2, action: "looks into the lens", eyeline: lens}]}}
    pov_day_timestamps: {formats: [narrated_edit, talking_video], readiness: ready, suits: [lifestyle, wellness, food, student, home], uses: [devices.pov, framing.close_up, edits.voiceover_broll, edits.cutaways, edits.timestamps, sound.voiceover, sound.room_tone], length_s: [33, 75], note: "day in the life: open on the day's most unusual moment, then morning; 2-4 s per moment, mostly POV B-roll of her hands and the places; a timestamp label per shot ('7:30 AM coffee'); her voiceover tells one thread; she is rarely on camera", shot: {cutaway: true, framing: {shot_size: close-up, device: pov}}}
    mirror_talk: {formats: [talking_video], readiness: partial, suits: [fashion, beauty, lifestyle], uses: [devices.mirror, framing.medium, actions.talk, text.word_captions], length_s: [10, 30], note: "she talks to her reflection, phone in hand at chest height, adjusting her outfit between lines; a plain mirror", shot: {framing: {shot_size: medium shot, device: mirror, camera_move: static}, blocking: [{at_s: 0, action: "adjusts her jacket in the mirror and starts talking", eyeline: screen, hands: "one hand on the phone, one on her jacket"}]}}
    walking_vlog: {formats: [talking_video], readiness: partial, suits: [lifestyle, storyteller, commentary, travel], uses: [devices.selfie_arm, actions.walk_and_talk, framing.medium_close_up, text.word_captions, sound.room_tone], length_s: [20, 60], note: "she walks and talks to the phone at arm's length like to a friend; glances ahead at the path between lines, eyes to the lens on the key lines", shot: {framing: {shot_size: medium close-up, device: selfie, handheld: light}, blocking: [{at_s: 0, action: "walks along the pavement talking to the phone", eyeline: lens}, {at_s: 3, action: "glances ahead at the path", eyeline: "off"}]}}
    pose_sequence: {formats: [carousel, story_clip], readiness: partial, suits: [fashion, fitness, lifestyle], uses: [devices.locked_off, framing.full_body, actions.pose, edits.labels, text.labels_only], length_s: [8, 19], note: "named poses, one per photo or per beat, the same spot and light; on video a short label names each pose; no talking", shot: {framing: {shot_size: full body, device: propped, camera_move: static}, blocking: [{at_s: 0, action: "holds a relaxed pose, weight on one leg", eyeline: "off"}, {at_s: 2.5, action: "shifts into a second pose and looks into the lens", eyeline: lens}], edit: {caption_style: none}}}
    silent_aesthetic: {formats: [story_clip, carousel], readiness: partial, suits: [fashion, lifestyle, beauty, food, home], uses: [devices.pov, framing.close_up, actions.prop_work, edits.labels, text.labels_only, sound.room_tone, sound.music_bed], length_s: [7, 17], note: "one beautiful, legible action in a beautiful first frame (fabric in hand, light on a bag, steam from a cup); no voice, one label at most, room tone or a quiet bed; reads without sound", shot: {framing: {shot_size: close-up, camera_move: push_in}, set: {depth_of_field: shallow}, edit: {caption_style: none}}}
    b_roll_detail: {formats: [talking_video, story_clip, carousel], readiness: ready, suits: [lifestyle, food, home, educator, storyteller], uses: [devices.pov, framing.close_up, camera_moves.push_pull, edits.cutaways], length_s: [2, 5], note: "a close detail of the place or the thing she talks about, no face; in a talking video a cutaway under her voice", shot: {cutaway: true, framing: {shot_size: close-up, camera_move: push_in}, set: {depth_of_field: shallow}}}

# Captions, on-screen text and scripts (manyworlds.brain.planner): the rules go into the planner's and the
# showrunner's prompts (`voice_rules`), and anything that still breaks them is dropped (`caption_issues`).
# Owner 2026-11-21: never cringy or "too AI"; every creator should read as a real, cool person worth following.
captions:
  max_emoji: 2
  # Matched at a word start, case-insensitive ("drop a" catches "drop a comment", never "raindrop a").
  banned_phrases: [embrace, "little things in life", romanticiz, "core memory", "living my best", "game changer",
                   "game-changer", journey, self-care, "self care", "main character", "vibes", "let's dive", "here's to",
                   "cozy season", "soul", "magic of", "the simple joys", "nothing beats", "who else", "drop a",
                   "comment below", "link in bio", delve, tapestry, "testament to", elevate, unleash, "in a world",
                   "pure bliss", blissful, serene, nestled, breathtaking, cherish, "grateful for", blessed, manifest,
                   "sun-kissed", wanderlust, "hey guys", "welcome back", "so today", "in this video", "don't forget to"]
  # Sentence shapes AI writing falls into; regexes. pattern_notes say the same in words, for the prompt.
  banned_patterns:   # single-quoted: backslashes are literal, '' is an apostrophe
    not_just: '\b(it[''’]?s not|this is not|that[''’]?s not|this isn[''’]?t|it isn[''’]?t) (just|only|about) [^.!?]{1,40}[,;] (it[''’]?s|this is)\b'
    audience_question: '(what about you|what[''’]?s your (favou?rite|go-to)|anyone else\b|tell me (in the comments|below)|thoughts\?$)'
    lesson: '\b(a (gentle )?reminder (that|to)|remember to|life is (too short|about)|the lesson|note to self:)'
    narrated_gratitude: '\bfeeling (so )?(grateful|thankful|blessed)\b'
  pattern_notes:
    not_just: "'it's not just X, it's Y'"
    audience_question: "questions to the audience ('what about you?', 'anyone else?')"
    lesson: "lessons, reminders or morals"
    narrated_gratitude: "narrated gratitude"
  # Scripts written to be said (planner.voice_rules, planner.spoken_issues; owner 2026-11-24: the voice sounded read).
  # Writers are asked for sentences under max_words_per_sentence; one over drop_over_words drops the idea before any
  # GPU (it is prose, and leaves no gap to cut on).
  spoken:
    max_words_per_sentence: 22
    drop_over_words: 40
    rules:
      - "Contractions always (I'm, it's, don't); short sentences and fragments; one idea per sentence."
      - "Start in the middle of the moment, never with a greeting, an intro or 'so today'."
      - "Leave room for her: a quick aside ('which, fine'), a small restart ('I mean, no, okay') at most once; never brackets."
      - "Say numbers, times and names the way she would say them out loud ('two am', 'like forty quid')."
      - "Put the punchline or the turn at the end of a sentence, where she can pause before it."
  no_em_dash: true
  voice_guide: >-
    Write like a real person people choose to follow, not a brand, a poet or an assistant. Be specific: name the
    actual thing (the bodega, the bus line, the exact snack, the song). Have a point of view and small opinions;
    be a little dry and self-aware; leave things unsaid. Captions are usually short, often one line or a fragment,
    written the way this person texts (their casing and punctuation; slang only if it is theirs and current, never
    forced). Never explain the joke, narrate feelings, moralise, sum up a lesson, sound inspirational or wholesome
    on purpose, or perform gratitude. Hashtags rarely, never in the caption. Talking-video scripts sound spoken:
    contractions, short sentences, an aside or a restart is fine, no lists, no intros. If a line would make a
    stylish 25-year-old cringe, cut it. Cool comes from taste and restraint, not adjectives.

# Burned-in captions (manyworlds.captions, owner 2026-11-22): the spoken words on the video itself, word-timed,
# in a style preset, inside the Reels/TikTok safe zones, burned in by ffmpeg (libass, fonts in manyworlds/fonts).
# Not the post caption above (that is `captions`). A creator's default is a style name; an unknown name gets
# default_style. Sizes and spacings in a style are shares of the em (`size` is the em as a share of the frame
# height, so 1080x1920 and 720x1280 look the same). Burned in by production's finish stage (production.finish_video)
# for the formats listed, timed from the voice lines (clauses when the voice has them; fillers never shown); story
# clips say nothing, so they get none. With these on, narrated edits and cutaways draw no captions of their own.
# A creator's style is the profile dial `caption_style`; placement by the first shot's shot size
# (placement_by_shot_size: words found in it -> placement), else default_placement.
burned_captions:
  enabled: true
  formats: [talking_video, narrated_edit]
  default_style: clean
  # Which style a video gets (captions.caption_style_for), first found in this order: the shot sheet's
  # edit.caption_style (a style name or free text naming one), the format's entry below, the creator's dial.
  style_precedence: [shot, format, creator]
  # Post format -> style; `none` = no spoken captions, on-screen labels only. Keys are real post formats only (photo,
  # carousel, story, story_clip, narrated_edit, talking_video): whether a video is talk-led (word captions) or
  # label-led (an outfit check, a pose sequence, a silent aesthetic: labels, not karaoke) is the director's choice per
  # post, written as the shot's edit.caption_style (a style name, or none), from the creator's archetype
  # (direction.director.archetypes) and the capabilities it uses. Talking formats are left out on purpose: without a
  # shot's style they take the creator's style, else default_style (clean). A story clip has no voice.
  style_by_format: {story_clip: none}
  no_caption_words: ["no captions", "labels only", "no subtitles", "text only"]   # free text meaning `none`
  # Time captions from the voice line's transcript (review.video.intelligibility's hosted Whisper, verbose_json word
  # timestamps; paid once per voice line and cached on its asset as meta.words) instead of estimating them from
  # the line's spans. `word_timestamps: true` turns it on for every format; word_timestamps_formats for those listed
  # (captions.word_timestamps_for(policy, format)): on for every spoken format that burns captions (talking videos
  # since 2026-11-23: estimated timings drift on real takes; narrated edits since 2026-11-24; the words are cached per
  # voice line). A narrated edit needs a designed voice line (payload.audio_uri) for them; without one it keeps the
  # edit's own measured cues (docs/tech-debt.md). Any failure falls back to estimates and is logged.
  word_timestamps: false
  word_timestamps_formats: [talking_video, narrated_edit]
  # Characters the style's font cannot draw (emoji: libass draws no colour emoji, no bundled font has any) are
  # dropped (strip) rather than burned in as empty boxes or a fallback system font; keep = leave them.
  missing_glyphs: strip
  default_placement: lower
  # Shot size words -> placement, first match wins ('medium close-up' matches close): close-ups put captions in the
  # lower band under the chin; wide and full-body shots in the middle-lower area, over the body, not the face.
  placement_by_shot_size: {close: lower, medium: lower, full: mid_lower, wide: mid_lower}
  # Shares of the frame kept clear of platform UI: top bar, bottom account/caption/audio rows, right-side
  # buttons; left matches right so centred text clears the buttons.
  safe_zone: {top: 0.14, bottom: 0.25, left: 0.12, right: 0.12}
  # anchor: which edge of the text block sits at y (share of the frame height). lower = lower third, just above
  # the bottom safe zone; upper = upper-middle, for shots where the face is low (placement_for).
  placements:
    lower: {anchor: bottom, y: 0.74}
    mid_lower: {anchor: middle, y: 0.62}
    upper: {anchor: top, y: 0.24}
    center: {anchor: middle, y: 0.5}
  # Face-safe placement (captions.placement_for, with a face box from the keyframes): the shot's placement unless
  # a caption block there would cover the face, else the first in face_safe_order that clears it.
  face_band: 0.12              # a caption block's height as a share of the frame (two lines of the largest style)
  face_margin: 0.02            # kept clear around the face box
  face_safe_order: [lower, mid_lower, upper, center]
  chunking:
    max_words: 6               # a style may lower it
    target_words: 4
    max_lines: 2
    max_duration_s: 2.8
    gap_break_s: 0.6           # never one chunk across a longer silence
    pause_s: 0.3               # a silence this long is a free break, and makes a lone word an utterance
    costs: {after_clause: 1.0, before_starter: 2.0, mid_phrase: 5.0, after_sticky: 12.0, internal_sentence: 6.0,
            size: 0.6, over_duration_per_s: 8.0, orphan: 100.0, line_balance: 0.15, line_break_factor: 0.5,
            two_lines: 1.0, single_word_line: 2.0}
    # Breaking before these is natural; breaking after sticky words ("the | bodega") never is.
    phrase_starters: [and, but, so, or, because, cause, when, while, if, then, that, which, who, where, until,
                      before, after, like, just, with, without, to, for, from, in, "on", at, of, about]
    sticky_words: [a, an, the, my, your, his, her, our, their, its, this, "that's", to, of, in, "on", at, for, with,
                   from, by, i, "i'm", "i've", "i'd", "i'll", "you're", "it's", is, was, very,
                   so, too, not, "no", and, but, or]
  timing:
    syllable_weight: 1.0       # estimate_timings: a word's share of its line ~ syllables + letters
    char_weight: 0.08
    clause_pause_weight: 0.8   # room after a comma, in the same units
    sentence_pause_weight: 1.4
    lead_s: 0.05               # a chunk appears this long before its first word
    hold_s: 0.25               # and stays this long after its last
    min_display_s: 0.6
    bridge_s: 0.35             # a shorter gap to the next chunk is closed (no flicker)
  encode: {crf: 18, preset: veryfast}
  style_defaults:
    font: Poppins              # ASS font name: the TTF's family or full name (manyworlds/fonts/README.md)
    file: Poppins-Bold.ttf     # that TTF: measures text exactly; drawn by the fallback when ffmpeg has no libass
    bold: true
    italic: false
    size: 0.037                # em / frame height (71 px at 1920)
    case: none                 # none | upper | lower | smallcaps
    smallcaps_scale: 0.8
    letter_spacing: 0.0
    line_spacing: 1.18         # baseline to baseline
    max_chars_per_line: 20
    max_words: 6
    color: "#FFFFFF"
    accent: "#FFD54A"          # emphasis words (*asterisks* in the script, or a list)
    highlight: "#FFD54A"       # the word being said (mode karaoke)
    outline: {width: 0.0, color: "#000000", opacity: 1.0}
    shadow: {depth: 0.0, color: "#000000", opacity: 0.0}
    soften: 0.0                # blur of outline and shadow
    box: {enabled: false, color: "#000000", opacity: 0.6, pad_x: 0.35, height: 1.3, radius: 0.3}
    mode: phrase               # phrase (whole chunk) | karaoke (word highlight) | reveal (words appear as said)
    fade_in_ms: 90
    fade_out_ms: 70
    pop: {from: 1.0, peak: 1.0, ms: 0}       # the chunk scales from -> peak -> 1 as it appears
    word_pop: {from: 1.0, ms: 0}             # the highlighted word scales from -> 1 (karaoke)
  styles:
    # White bold sans with a soft dark halo and shadow; settles in slightly. The everyday default.
    clean:
      outline: {width: 0.045, opacity: 0.45}
      shadow: {depth: 0.03, opacity: 0.45}
      soften: 0.05
      pop: {from: 0.96, peak: 1.0, ms: 120}
    # Word-by-word highlight with a small pop on the word being said; heavier weight, firm outline.
    karaoke:
      font: Poppins ExtraBold
      file: Poppins-ExtraBold.ttf
      bold: false
      size: 0.04
      max_chars_per_line: 16
      max_words: 4
      highlight: "#FFD23F"
      accent: "#FFD23F"
      outline: {width: 0.07, opacity: 0.9}
      shadow: {depth: 0.035, opacity: 0.4}
      soften: 0.02
      mode: karaoke
      word_pop: {from: 1.1, ms: 110}
      fade_in_ms: 60
      fade_out_ms: 60
    # Text on a rounded translucent box per line (no outline needed on any background).
    boxed:
      font: Poppins SemiBold
      file: Poppins-SemiBold.ttf
      bold: false
      size: 0.033
      max_chars_per_line: 21
      line_spacing: 1.42
      accent: "#FFD23F"
      box: {enabled: true, color: "#0E0E10", opacity: 0.72, pad_x: 0.42, height: 1.32, radius: 0.34}
      fade_in_ms: 110
      fade_out_ms: 90
    # Calm and literary: serif italic small caps in warm ivory, soft shadow, slow fades. For calm creators.
    editorial:
      font: DM Serif Display
      file: DMSerifDisplay-Italic.ttf
      bold: false
      italic: true
      size: 0.038
      case: smallcaps
      smallcaps_scale: 0.78
      letter_spacing: 0.03
      line_spacing: 1.12
      max_chars_per_line: 18
      max_words: 5
      color: "#F6F1E7"
      accent: "#F2C46D"
      shadow: {depth: 0.03, opacity: 0.5}
      outline: {width: 0.03, opacity: 0.25}
      soften: 0.06
      fade_in_ms: 180
      fade_out_ms: 150
    # High energy: heavy condensed capitals, thick outline, a punchy pop with overshoot. Few words at a time.
    bold_pop:
      font: Anton
      file: Anton-Regular.ttf
      bold: false
      size: 0.052
      case: upper
      letter_spacing: 0.02
      line_spacing: 1.05
      max_chars_per_line: 16
      max_words: 3
      target_words: 2
      accent: "#FFE600"
      outline: {width: 0.08, opacity: 1.0}
      shadow: {depth: 0.05, opacity: 0.6}
      soften: 0.01
      pop: {from: 0.82, peak: 1.07, ms: 150}
      fade_in_ms: 40
      fade_out_ms: 50
    # Understated lower case; each word appears as it is said.
    minimal:
      font: Poppins SemiBold
      file: Poppins-SemiBold.ttf
      bold: false
      size: 0.031
      case: lower
      max_chars_per_line: 23
      outline: {width: 0.04, opacity: 0.4}
      shadow: {depth: 0.025, opacity: 0.4}
      soften: 0.05
      mode: reveal
      fade_in_ms: 80
      fade_out_ms: 80
    # TikTok-native: TikTok Sans SemiBold, white, soft shadow, no visible outline; phrase at a time.
    tiktok:
      font: TikTok Sans SemiBold
      file: TikTokSans-SemiBold.ttf
      bold: false
      size: 0.034
      max_chars_per_line: 22
      shadow: {depth: 0.03, opacity: 0.4}
      soften: 0.06
      fade_in_ms: 70
      fade_out_ms: 70

# On-screen text that is not the spoken words (manyworlds.overlays, 2026-11-23 build): labels, the hook, day-in-life
# timestamps, GRWM question bubbles. Top clips put one short label in the upper third or centre, TikTok-native (white
# sans with a soft shadow, or black on a white rounded box); word captions are for talking and storytime only
# (docs/research/2026-11-23-readiness-and-craft.md). A shot sheet's edit.on_screen_text items are
# {kind, text, start_s, end_s, style, position} (+ number, time); a missing style or position takes the kind's.
# Burned in the same ASS script and pass as the captions (overlays.make_script). Sizes as in burned_captions.
on_screen_text:
  enabled: true
  # Kept clear of platform UI at 1080x1920: top bar ~250 px, bottom account/caption rows ~320 px, the right-side
  # button rail ~130 px; left is narrower so numbered labels can sit left (centred text centres on the frame).
  safe_zone: {top: 0.13, bottom: 0.17, left: 0.08, right: 0.12}
  missing_glyphs: strip        # as burned_captions.missing_glyphs: emoji have no glyph in any bundled font
  default_duration_s: 3.0      # an item with no end and no known video length
  face_margin: 0.02            # kept clear around a face box (share of the frame)
  wrap: {orphan_cost: 50}      # a lone last word costs this many characters of imbalance
  default_style: tiktok_plain
  # anchor: which edge of the drawn block (box and tail included) sits at y (share of the frame height);
  # align: center on the frame, or left at the safe zone's edge.
  positions:
    top_bubble: {anchor: top, y: 0.14, align: center}
    upper_third: {anchor: middle, y: 0.3, align: center}
    upper_left: {anchor: middle, y: 0.27, align: left}
    centre: {anchor: middle, y: 0.5, align: center}
    lower: {anchor: bottom, y: 0.72, align: center}
  position_aliases: {center: centre, middle: centre, top: top_bubble, upper: upper_third, upper_third_left: upper_left,
                     bottom: lower, lower_third: lower}
  # Tried in order when an item would cover the face or another item showing at the same time.
  alternatives:
    top_bubble: [upper_third, centre]
    upper_third: [top_bubble, centre, lower]
    upper_left: [top_bubble, upper_third]
    centre: [upper_third, lower]
    lower: [centre, upper_third]
  kinds:
    label: {style: tiktok_plain, position: upper_third, numbered_style: numbered}
    hook: {style: hook, position: upper_third, start_s: 0.0, duration_s: 1.5, max_duration_s: 2.0}
    timestamp: {style: serif_small, position: upper_left, caption_scale: 0.8}   # "7:30 AM" over a smaller caption
    question: {style: question_bubble, position: top_bubble}
  style_defaults:
    font: TikTok Sans SemiBold
    file: TikTokSans-SemiBold.ttf
    bold: false
    italic: false
    size: 0.03                 # em / frame height (58 px at 1920)
    case: none
    letter_spacing: 0.0
    line_spacing: 1.2
    max_chars_per_line: 24
    max_lines: 3
    color: "#FFFFFF"
    outline: {width: 0.0, color: "#000000", opacity: 1.0}
    shadow: {depth: 0.0, color: "#000000", opacity: 0.0}
    soften: 0.0
    # mode: line (a box per line, TikTok's classic label) | block (one box round all lines; tail = speech bubble)
    box: {enabled: false, mode: line, color: "#FFFFFF", opacity: 1.0, pad_x: 0.35, pad_y: 0.3, height: 1.32,
          radius: 0.28, tail: {enabled: false, width: 0.55, height: 0.4, x: 0.12}}
    fade_in_ms: 120
    fade_out_ms: 120
    pop: {from: 1.0, peak: 1.0, ms: 0}
  styles:
    # TikTok's plain text: white sans, soft shadow, no hard outline.
    tiktok_plain:
      shadow: {depth: 0.035, opacity: 0.45}
      soften: 0.08
    # TikTok's classic label: black text on a white rounded box per line, boxes touching.
    tiktok_box:
      color: "#000000"
      line_spacing: 1.32
      max_chars_per_line: 22
      box: {enabled: true}
    # Day-in-life timestamps: small serif, soft shadow.
    serif_small:
      font: DM Serif Display
      file: DMSerifDisplay-Regular.ttf
      size: 0.028
      shadow: {depth: 0.03, opacity: 0.45}
      soften: 0.08
    # Numbered looks and tips ("1.", "2. tight on baggy"): bolder, a touch bigger.
    numbered:
      font: TikTok Sans
      file: TikTokSans-Bold.ttf
      bold: true
      size: 0.036
      max_chars_per_line: 20
      shadow: {depth: 0.035, opacity: 0.5}
      soften: 0.08
    # The hook: big, first second or two, settles in.
    hook:
      font: TikTok Sans
      file: TikTokSans-Bold.ttf
      bold: true
      size: 0.044
      max_chars_per_line: 18
      line_spacing: 1.12
      outline: {width: 0.03, opacity: 0.3}
      shadow: {depth: 0.04, opacity: 0.5}
      soften: 0.06
      pop: {from: 0.9, peak: 1.03, ms: 160}
      fade_in_ms: 60
      fade_out_ms: 150
    # A question as if replying to a comment: black on one white bubble with a tail (no user named, ever).
    question_bubble:
      color: "#111111"
      size: 0.027
      max_chars_per_line: 26
      box: {enabled: true, mode: block, pad_x: 0.6, pad_y: 0.45, radius: 0.45, tail: {enabled: true}}

# Direction (manyworlds.direction, owner 2026-11-22): the words the shot-sheet compiler adds to every directed
# prompt. Moves not in camera_moves are dropped; the planner offers only moves whose readiness is offered.
# Phone-native realism (2026-11-23, docs/research/2026-11-23-readiness-and-craft.md): the top clips are bright, flat,
# ordinary rooms lit by a window or lamp, real skin, no cinematic grade. The AI tells are waxy skin, unmotivated
# studio light, a dead stare, a gimbal-smooth "phone" and a glossy ad look. Words are short: they share the budgets.
direction:
  realism:
    photo: "ordinary phone camera photo, natural auto exposure, bright and slightly flat, visible pores and fine skin texture, a few flyaway hairs, small everyday imperfections"
    i2v: "real phone footage, natural auto exposure, ordinary room, real skin texture"
    talk: "real phone footage, natural auto exposure, real skin texture, natural eyeline"
    # added when the shot says nothing about its light (motivated light, never studio light)
    light_fallback: "natural available light from a real source in the scene"
    # video only: how the phone moves, by framing.handheld; with none set, by framing.device (device_shake)
    shake:
      none: "locked-off phone resting still on a surface"
      light: "handheld phone, slight natural micro-shake"
      held: "handheld phone, natural hand shake and small reframes"
    device_shake: {propped: none, held: held, selfie: light, mirror: light, pov: held}
  style:
    photo: "realistic"
    i2v: "small natural movements, steady face, realistic"
    talk: "small natural head movements and expressions, steady face, realistic"
  # The video models cannot render sound: the shot sheet's sound stays for the mix, and only these targets spend
  # prompt budget on it (none).
  sound_targets: []
  # Negatives never go in the positive prompt (a negation where there is no negative channel tends to summon the
  # thing). channel: whether the target's model reads a negative prompt (Wan i2v and InfiniteTalk/LongCat graphs:
  # a negative text encode, job payload `negative_prompt`; Z-Image Turbo at guidance 0: none). base: the start of
  # the negative for a target with a channel: Wan's standard list (worker/comfy.py NEGATIVE) without "bright tones,
  # overexposed", which fight the bright, slightly overexposed phone look. Items: `always`, `solo` (only when nobody
  # is asked for in the background), `by_target`; an item is left out when its `unless_mentioned` words appear in the
  # shot's own prompt (a mirror shot asks for the mirror).
  negatives:
    channel: {photo: false, i2v: true, talk: true}
    base:
      i2v: "static, blurred details, subtitles, style, works, paintings, images, overall gray, worst quality, low quality, JPEG compression residue, ugly, incomplete, extra fingers, poorly drawn hands, poorly drawn faces, deformed, disfigured, misshapen limbs, fused fingers, still picture, messy background, three legs, walking backwards"
      talk: "static, blurred details, subtitles, style, works, paintings, images, overall gray, worst quality, low quality, JPEG compression residue, ugly, incomplete, extra fingers, poorly drawn hands, poorly drawn faces, deformed, disfigured, misshapen limbs, fused fingers, still picture, messy background, three legs, walking backwards"
    always: [text, logos, watermark, mirror reflections]
    solo: [extra people]
    by_target:
      photo: [waxy skin, airbrushed skin, studio lighting]
      i2v: [waxy plastic skin, airbrushed face, studio lighting, cinematic color grade, gimbal-smooth camera, glossy advert look]
      talk: [waxy plastic skin, airbrushed face, studio lighting, cinematic color grade, dead stare, frozen eyes, glossy advert look]
    unless_mentioned:
      mirror reflections: [mirror, reflection]
      extra people: [crowd, friend, people, person]
  # For a target without a negative channel: the positive phrasing that stands in for a negative (Z-Image photos).
  # An item without one is dropped. Mirrors and text have none on purpose: "a plain wall behind the person" on every photo
  # would flatten the ordinary rooms the research asks for, and any wording of "text" asks for text.
  # The checkpoint before any GPU (owner 2026-11-22: make sure the brief is drawable before paying to draw it; after
  # media only defects kill). Props beyond max_props are cut from the prompt; the director is told the same.
  feasibility: {max_props: 2}
  positive_instead_of:
    logos: "unbranded clothes and objects"
    extra people: "the only person in the frame"
    waxy skin: "real skin with pores and fine lines"
    studio lighting: "lit only by real sources in the scene, a window, a lamp or daylight"
  camera_moves: [static, handheld, push_in, pull_out, pan_left, pan_right, tilt_up, tilt_down, follow, orbit_slow]
  offer_readiness: [ready, partial]
  # Natural eyes (plan 2026-11-22 wave 2): added to the action of talk prompts, and of i2v prompts unless the shot is
  # a cutaway. A beat whose eyeline is off, prop or screen adds one `glance` ({target}, {t} in seconds); a prop
  # glance names the shot's first prop, else glance_targets.prop. Not used for photos or undirected prompts.
  eyes:
    talk: "blinks naturally and irregularly, glances away between thoughts, returns to the lens"
    i2v: "blinks naturally and irregularly, eyes alive"
    glance: "looks at {target} at {t}s"
    glance_targets: {"off": "something off-camera", prop: "the object in hand", screen: "the screen"}
  # Micro-expressions and idle movement, by the shot's performance energy; without one, the first level whose word
  # appears in performance.body_language; else default_energy for the target (talk only).
  idle:
    by_energy:
      low: "slow, small movements, soft micro-expressions, a relaxed jaw between words"
      medium: "easy natural gestures, small nods and brow lifts, a faint smile between lines"
      high: "animated hands near the chest, quick head tilts, bright brow raises"
    keywords:
      high: [animated, excited, energetic, lively, bouncy, gesturing, fast]
      low: [slouch, tired, sleepy, calm, still, relaxed, quiet, deadpan, low-key]
    default_energy: {talk: medium}
  # 720p for close talking shots: direction.talk_profile_for returns hd_profile (generation.talk_profiles) for these
  # shot sizes. Off until the hd720 profile passes the talk benchmark (owner's go).
  hd_close_ups: false
  hd_for_shot_sizes: [close-up, extreme close-up]
  hd_profile: hd720
  # Prompt length (plan 2026-11-22, 21:20 gap): estimated tokens per directed prompt (direction.estimate_tokens:
  # the larger of words x 1.35 and chars / 3.6). Wan 2.1/2.2's umt5-xxl (i2v, talk) and Z-Image's Qwen3-4B (photo,
  # diffusers' max_sequence_length 512) read 512 tokens and silently drop the rest; these leave headroom for the
  # estimate's error. Over budget, the compiler shortens set_dressing, props and outfit to their first clause
  # (clause_words at most), then uses the short appearance for video, then drops optional detail, then cuts the
  # lowest-priority section; camera, action and the positive stand-ins are kept
  # (a negative prompt is outside the budget). Undirected prompts are not budgeted.
  prompt_budget: {photo: 400, i2v: 300, talk: 300}
  prompt_trim:
    clause_words: 20
  # The director (manyworlds.brain.director): when an accepted idea becomes a post, one LLM call writes a shot sheet
  # per scene (body.shots) for the formats below. A failed call never drops the post: it is made undirected.
  enabled: true
  direct_formats: [talking_video, story_clip, narrated_edit, photo, carousel]
  role: director
  effort: medium
  memory_facts: 40             # creator memory facts shown to the director
  recent_posts: 20             # recent directed posts whose named sets and outfits are shown for reuse
  # More context for the director (owner 2026-11-23: within reason, more rather than less): the idea's reasoning and
  # attributes, its series' premise and hook, her persona, the dossier's planning view, the talent manager's focus
  # and stop, her archetype's hooks, edit grammar and pitfalls, and the shot types of her recent posts (to vary them).
  # Caps: recent_shot_type_posts directed posts read; list_items per list in the dossier and playbook views.
  context: {recent_shot_type_posts: 12, list_items: 8}
  # Posts the director failed on at scheduling (a transient error) are retried by ideas.redirect_undirected, run at
  # the end of every ideas.schedule_ready: planned posts in direct_formats with no shots, at most max_attempts calls
  # per post (body.direct_attempts), each retry at least retry_after_minutes after the last, max_per_sweep per tick.
  redirect: {max_attempts: 3, retry_after_minutes: 30, max_per_sweep: 10}
  # A shot's free-text edit.transition_in -> the joiner's kind (direction.transition_kind; media.TRANSITIONS): a
  # kind's own name, else the first kind below one of whose words starts a word in the text; anything else is a cut
  # ("hard cut", "jump cut"). Order matters: "whip on the spin" is a whip, "cut on the spin" a match.
  transitions:
    keywords:
      whip: [whip, swish, "fast pan", "swipe pan"]
      flash: [flash, "dip to white", "white out"]
      blur: [blur, dissolve, "soft cross", fade]
      match: [match, spin, twirl, "hair flip", "hand over the lens", "cover the lens", "covers the lens", "on motion",
              "on the move", "mid motion", "inside the motion", "shoe kick"]
  # The director's brief (manyworlds.brain.director): the craft rules it directs by, the "reads as AI" tells it
  # avoids, length by intent, and how a creator communicates by archetype. From the 2026-11-23 research
  # (docs/research/2026-11-23-readiness-and-craft.md; graded sources in the craft notes). Short: they go in every call.
  director:
    craft:
      - "Every shot is drawable in one frame: one action, at most two named props, one place; what a picture can't show (a smell, a backstory, a thought) belongs in the caption or the voice, never the scene."
      - "The first frame is moving (a hand, hair, a step, a door, a spin) or beautiful (an aesthetic plate), never a still face starting to talk."
      - "The hook is on screen in the first second as hook text, and is the most surprising line or a story tease, never a greeting."
      - "Eyes to the lens on the hook and the punchlines; motivated glances (hands, mirror, the path ahead) between; never a fixed stare."
      - "Light is motivated: one real source (a window, a lamp, low sun) named with its direction; bright, flat, a little overexposed is fine; never studio light in a casual room."
      - "Phone-native: ordinary rooms, the person often small in the frame, no cinematic grade; the device matches the genre (locked off for transitions, a light sway for selfie, walking bob for walk-and-talk)."
      - "Cut on motion (a spin, a hair flip, a hand over the lens), never mid-sentence; same set, framing and light across an outfit change."
      - "On-screen text is a short label in the upper third or centre, 1-3 s, not karaoke; word captions only for talk-led posts."
      - "Every post has a point of view and one thing a viewer would send to a friend."
    avoid:
      - "a static talking face from frame 1"
      - "waxy skin or a beauty-filter sheen"
      - "unmotivated studio light"
      - "a dead stare or a drifting eyeline"
      - "a gimbal-smooth phone"
      - "hair, clothes or jewellery changing between shots of one moment"
      - "text on signs, screens or packaging"
      - "hands doing fine work in close-up"
      - "fast cuts to hide artefacts"
      - "a glossy advert look"
      - "a pretty face in a pretty place with nothing to say"
    lengths:
      visual: "7-20 s, built to loop (outfit checks, poses, silent aesthetic, dance)"
      talk_led: "45-95 s when the story holds (GRWM ~95 s, talking head ~66 s, storytime ~63 s); hook in the first second"
      day_in_life: "33-75 s, 2-4 s per moment"
      quick_update: "10-30 s (mirror talk, a walk-and-talk thought)"
    # How a creator communicates comes from the archetype library (policy/archetypes, brain.archetypes.file).

# Set and wardrobe bibles (manyworlds.creator.sets, plan 2026-11-22 wave 2 item 5): a set or outfit the director names
# for the first time is registered on the creator (anchors.sets / anchors.outfits) with its canonical description
# (the first shot's set_dressing / outfit), and gets one image of the empty room (plate) or the clothes alone
# (outfit reference), judged by the image gate against the `*_scene` text. The gate's identity row always fails for
# them (nobody to match), so a plate is chosen from its realism, safety and scene rows at the bars below.
# Every later scene in that set gets the canonical description in its prompt and the plate and outfit reference as
# `references` for the consistency check (review.detail.consistency).
# Carousel text slides (manyworlds.slides): drawn on the producer in the creator's carousel brand (profile.world.carousel,
# the style director's), 1080x1350 with text inside the centre square the grid shows.
slides: {enabled: true, formats: [carousel], width: 1080, height: 1350, margin: 96, cover_size: 104, max_slides: 8}

sets:
  enabled: true
  generate_plates: true
  # Scene images made by sets.edit.kind from [creator anchor, set plate, outfit reference] instead of text-only
  # Z-Image. Off until `mw bench image.qwen_edit` passes the image gate (owner rule: no unbenchmarked switch-over).
  reference_conditioning: false
  plate_kind: image.zimage
  plate_candidates: 4
  max_plate_attempts: 3        # plate jobs per set or outfit before giving up (it then has text only)
  min_plate_scene: 7           # the gate's scene score (matches the description, nobody in it)
  min_plate_realism: 6
  # {name}, {description}; {unbranded}: direction.positive_instead_of.logos. `set` and `outfit` go to Z-Image Turbo at
  # guidance 0, which has no negative channel: a negation there ("no people, no text, no logos") summons the thing,
  # so they say what IS there (an empty room, plain surfaces, unbranded objects). The `*_scene` texts are read by the
  # image gate's judge, not a generator, so they may say "nobody".
  prompts:
    set: "Candid smartphone photo of an empty, quiet room: {name}. {description}. Natural light, realistic, plain unlabelled surfaces, {unbranded}."
    set_scene: "{name} with nobody in it, no people at all, matching: {description}"
    outfit: "Smartphone photo of clothes hanging alone on a hanger against a plain wall: {description}. Soft daylight, realistic, {unbranded}."
    outfit_scene: "clothes on a hanger with nobody wearing them, no people at all: {description}"
  # Qwen-Image-Edit-2511 (Apache-2.0) with lightx2v's 4-step Lightning LoRA (Apache-2.0): 4 steps, true CFG 1.0. bf16
  # only (fp8 base + Lightning gave grid artifacts). Each input picture is named by its words below ({n}: 1-based).
  edit:
    kind: image.qwen_edit
    candidates: 4
    steps: 4
    true_cfg: 1.0
    negative_prompt: " "
    lightning: true
    person: "Picture {n} is the person: keep their face, hair, skin and build exactly as in it."
    set: "Place them in the room from picture {n}, keeping its layout, furniture, colours and light fittings."
    outfit: "Dress them in the clothes from picture {n}."

# Production (manyworlds.production): planned posts -> image jobs -> reviewed images.
# On Maren with the full appearance prompt, 12 of 12 images passed review, so 4 candidates
# per scene (one job) leaves room for the confirm stage to pick; failures get repaired.
production:
  image_kind: image.zimage
  # narrated_edit is out (owner 2026-11-19): anything with a voice is lip-synced talking video, which is not
  # built yet (M10). The edit pipeline stays in code for the talking-video work.
  formats: [photo, carousel, story_clip, story]   # formats production makes now; others wait in 'planned' until added
  video_kind: comfy.wan_i2v       # used when routing has no entry for the output (owner 2026-11-22: ComfyUI first)
  # Which job kind makes each output (manyworlds.routing): the cheapest per accepted output over `days`, once it has
  # min_accepted; an `explore` share (by post) goes to the others. Before anything is measured, the order below.
  routing:
    story_clip: {kinds: [comfy.wan_i2v, hosted.video], min_accepted: 5, explore: 0.1, days: 14}   # ComfyUI default
  talk_kind: talk.infinitetalk   # lip-synced talking video (talking_video posts)
  # A shot with a motion_reference (dance.references) while dance.enabled: rendered by Wan-Animate-2 from its photo
  # (a story clip's shot, or a talking take's silent motion clip that the talk job lip-syncs onto).
  dance_kind: comfy.wan_animate2
  candidates_per_scene: 4
  lead_hours: 48               # start making a post this long before it is scheduled
  # Paid GPU time goes to real posts or the machine stops (owner, 2026-11-23): when a warm image machine is about to
  # run dry (<= low_water_jobs open scene jobs), start up to max_posts_per_tick planned posts due within
  # horizon_hours early, if the machine has min_remaining_minutes left, has spent < max_spend_share of its cap and
  # today is under budget_share of gpu_runs.daily_gpu_usd. Never alternates or extra takes. (production.pull_forward)
  pull_forward: {enabled: true, horizon_hours: 120, low_water_jobs: 2, max_posts_per_tick: 2, min_remaining_minutes: 20,
                 max_spend_share: 0.8, budget_share: 0.8}
  loop_seconds: 120
  busy_loop_seconds: 15        # while a post is producing: light ticks (production only) this often
  max_advance_errors: 5        # ticks in which advancing a post raised before it is dropped and the owner told
  # One producer per post (production.locks): a post's start or advance holds a lease row this long at most; a post
  # whose lease another producer holds is skipped that tick. Longer than the slowest advance (a finish with its review).
  post_lease_seconds: 1800
  max_job_failures_per_post: 6   # failed jobs (machines, downloads) per post; apart from review repairs
  max_ready_unpublished: 6       # no new batch while a creator has this many made-but-unpublished posts
  # A video post whose clips keep failing review ships as a photo from its already-approved start frame.
  reroute_failed_video: {story_clip: photo, talking_video: photo}
  # The rerouted post's caption, written for the video, is rewritten once for a still (llm role caption_rewrite);
  # the old one is kept in body.caption_before_reroute. A failed call keeps the old caption.
  reroute_caption: {enabled: true, effort: low}
  edit: {speed: 0.95, width: 1080, height: 1920, fps: 30, loudness_lufs: -14}   # narrated edits (image.narrated)
  # Where a video post's finish (production.finish: mix, grade, captions, cover) renders: `queue`, a finish.video job on the
  # finisher (a Fly machine the autoscaler starts; gpu_pools.fly_finisher), so minutes of 1080x1920 encodes never block
  # the producer's loop or its 512 MB VM; `inline`, in the producer's own tick (as before 2026-11-23).
  # queue since 2026-11-23: the autoscaler starts the finisher with an app-scoped deploy token (Fly secret
  # FLY_API_TOKEN; the in-machine API proxy answers 403); one start/stop checked live the same day.
  finish_mode: queue

# Finishing (manyworlds.finishing, 2026-11-22): grade, grain, hook text, loudness and the cover frame of a finished
# video: production's finish stage (production.finish; on the finisher machine while production.finish_mode is queue)
# runs it once per video post of the formats listed, with the burned-in captions in the same ffmpeg pass where ffmpeg has libass. A finish that fails
# max_failures times is held (never published) and the owner told; on_give_up: ship ships the unfinished video instead.
# Looks are gentle and natural: every value is clamped to `limits`, so no look can oversaturate.
finishing:
  enabled: true
  formats: [talking_video, narrated_edit, story_clip, music_video]
  trim_head_s: 0.4   # silent clips lose their still opening (an I2V clip starts frozen on its photo); spoken ones keep sync
  max_failures: 3
  on_give_up: hold   # after max_failures: hold (fails closed: status held, owner told) or ship (the unfinished video)
  # Top clips look like plain phone footage: bright, flat, slightly overexposed, no cinematic grade, no vignette
  # (docs/research/2026-11-23-readiness-and-craft.md). So the default is phone_native; the phone_* looks are what a
  # phone's own processing does in that light. In a look, `grain` and `sharpen` are that look's strengths (phones
  # denoise and sharpen a little): finishing.filters applies them in place of the global `grain` / `sharpen` blocks
  # below (0 = none in that look); a look without them gets the global blocks.
  default_look: phone_native
  look_by_creator: {}          # handle -> look
  look_by_set: {}              # shot set.set_id -> look (wins over the creator's)
  looks:
    # Phone HDR: a slight exposure lift (brightness, gamma), gentle contrast, lifted shadows and protected highlights
    # (the curve), neutral white balance (no balance), mild saturation, no vignette.
    phone_native: {contrast: 0.98, brightness: 0.02, gamma: 1.04, saturation: 1.03,
                   curves: {master: "0/0.03 0.25/0.29 0.5/0.54 0.75/0.78 0.92/0.9 1/0.97"}, grain: 0, sharpen: 0.25}
    # Low warm sun: warmer mids and highlights, a touch more colour, shadows still lifted.
    phone_golden_hour: {contrast: 1.0, brightness: 0.02, gamma: 1.03, saturation: 1.05,
                        balance: {rm: 0.03, rh: 0.04, bm: -0.02, bh: -0.04},
                        curves: {master: "0/0.03 0.25/0.28 0.5/0.53 0.75/0.78 1/0.97"}, grain: 0, sharpen: 0.25}
    # Indoors at night under warm practicals: warm cast, lifted shadows the phone pulls up (with its noise), a bit
    # less saturation, softer sharpening.
    phone_night_indoor: {contrast: 0.97, brightness: 0.01, gamma: 1.06, saturation: 0.97,
                         balance: {rs: 0.02, rm: 0.04, bm: -0.03, bh: -0.02},
                         curves: {master: "0/0.04 0.25/0.29 0.5/0.53 0.75/0.77 1/0.96"}, grain: 5, sharpen: 0.15}
    # Flat grey daylight: low contrast, slightly cool, the phone's colour boost, a lifted exposure.
    phone_overcast: {contrast: 0.96, brightness: 0.03, gamma: 1.03, saturation: 1.04, balance: {bm: 0.01, bh: 0.01},
                     curves: {master: "0/0.03 0.25/0.29 0.5/0.54 0.75/0.79 1/0.98"}, grain: 0, sharpen: 0.25}
    # Older gentle looks, kept for look_by_set / look_by_creator; not defaults.
    neutral: {contrast: 1.02, saturation: 1.0}
    daylight: {contrast: 1.03, brightness: 0.01, saturation: 1.03, balance: {bh: -0.02, rh: 0.01},
               curves: {master: "0/0 0.25/0.24 0.75/0.77 1/1"}}
    warm_night: {contrast: 1.04, brightness: -0.01, saturation: 0.97, gamma: 0.98,
                 balance: {rm: 0.04, bm: -0.03, rh: 0.03, bh: -0.02, bs: 0.02},
                 curves: {master: "0/0.02 0.25/0.23 0.75/0.76 1/0.98"}}
  # sharpen: the unsharp amount any look or call may ask for (luma_amount; above ~1 halos show on upscaled 480p).
  limits: {contrast: [0.9, 1.12], brightness: [-0.05, 0.05], saturation: [0.85, 1.08], gamma: [0.9, 1.1],
           balance: 0.08, sharpen: [0, 0.6]}
  # Phones denoise: grain stays very light (it was 4). A look's own `grain` wins over this block.
  grain: {enabled: true, strength: 2, max_strength: 10}   # ffmpeg noise, temporal + uniform
  # Phone processing sharpens mildly: the phone looks carry their own `sharpen` (0.15-0.25, applied after the lanczos
  # upscale); this global block stays off for looks without one (an upscaled 480p source sharpened harder shows
  # halos: check the phone looks' amounts on the breadth test).
  sharpen: {enabled: false, amount: 0.3, size: 5}         # luma unsharp mask; size odd, 3-23
  vignette: {enabled: false, angle: 0.35}                 # radians (PI/9 is subtle); phones add none: keep off
  # The hook text is an on-screen text of kind `hook` (style, position and timing: on_screen_text.kinds.hook), in the
  # one ASS script with the captions (overlays.make_script) that finishing.finish burns (`ass=`). Only a pointer here
  # (the breadth test's `hooks` capability requires this key).
  hook: {defer_to: on_screen_text.kinds.hook}
  # Loudness: a video with a voice is loudnormed to `lufs`. A bed-only video (finish(has_voice=False): room tone or
  # music, nobody speaks) is not: -14 LUFS would lift a -44 dB room tone ~30 dB into loud hiss. bed_only.mode:
  # skip = keep the level the sound mix gave it; cap = a constant gain towards bed_only.lufs, never more than
  # max_gain_db up (a bed louder than that target is turned down). First guesses: check on the breadth test.
  loudness: {lufs: -14, true_peak: -1.0, lra: 11, two_pass: true, sample_rate: 48000,
             bed_only: {mode: cap, lufs: -32, max_gain_db: 6}}
  encode: {preset: veryfast, crf: 18, audio_bitrate: 160k, timeout_seconds: 900}
  # Delivery size: 1080x1920, the platforms' native 9:16 (Reels, TikTok and Shorts all play it full screen; a 720p
  # upload is upscaled by the app and looks soft next to phone footage). A smaller video (480x832 talk and story clips,
  # 704x1280 TI2V clips) is upscaled until it covers it, keeping its aspect, then centre-cropped, in the finish pass
  # before the grade (so captions burn at this size). Never scaled down. flags: the scale chain (any ffmpeg swscale
  # flags; lanczos is the sharpest plain resampler, "lanczos+accurate_rnd+full_chroma_int" a slower, cleaner variant).
  # A 1080p libx264 encode at `encode.preset` veryfast takes ~1-2x real time on the control plane's shared CPU.
  output: {width: 1080, height: 1920, flags: lanczos}
  # Optional AI upscale on a GPU worker before the finish pass (production would queue `kind` for the post's video;
  # nothing queues it yet). OFF: needs a GPU benchmark of time and cost per output second and a gate comparison with
  # lanczos on the same clips. Candidates (licences as published in their repos; re-check at adoption):
  # Real-ESRGAN (xinntao/Real-ESRGAN, BSD-3-Clause; frame by frame, fast, can flicker on faces) and SeedVR2
  # (ByteDance-Seed/SeedVR, Apache-2.0; temporally consistent video restoration, heavy: 3B/7B on a 48 GB card).
  upscaler: {enabled: false, kind: null, model: null, scale: 2}
  # One frame rate for all published video: 30 fps, what phones record and the platforms show (25 is a PAL broadcast
  # rate no phone feed uses; 60 would double interpolated frames for nothing). Story clips (Wan 2.2) render at 16,
  # talk (InfiniteTalk) at 25, narrated edits at 30.
  fps: 30
  # How a slower video reaches `fps` (manyworlds.media.fps_filter): minterpolate = motion-compensated new frames
  # (mi_mode mci, overlapped-block compensation aobmc, bidirectional search, variable-size blocks), with scene-change
  # detection (scd fdiff over scd_threshold) so a hard cut is never morphed; it runs at the source size, before the
  # upscale (a few minutes of CPU for a 60 s 480p talk at most). blend = ffmpeg framerate (cross-blended frames), used
  # instead for clips under blend_below_seconds (too few frames for motion estimation); duplicate = repeat frames
  # (the old behaviour). enabled false = repeat frames. Faster sources just drop frames. Interpolated mouths and
  # hands can warp on fast motion: check on the breadth test (method: blend is the fallback, softer but never warps).
  interpolate: {enabled: true, method: minterpolate, mi_mode: mci, mc_mode: aobmc, me_mode: bidir, vsbmc: 1,
                scd: fdiff, scd_threshold: 10, blend_below_seconds: 1.0}
  # Transitions between joined segments (manyworlds.media.concat(transitions=...), one per join; a shot sheet's
  # edit.transition once production passes it). cut is the default and needs nothing here. Each other kind lasts
  # `frames` frames at the output rate, clamped to frames_range, and never more than half of either side.
  # match: a cut that first trims each side to the given times (out_at, in_at: the motion peak), snapped to the
  #   nearest frame, so a movement carries across the cut.
  # whip: a fast slide (xfade per direction) with a horizontal (left/right) or vertical (up/down) box blur of
  #   blur_px pixels over both sides of the overlap: a whip pan.
  # blur: both sides blur (gaussian sigma) through a dissolve.
  # flash: a short dip through white (xfade fadewhite).
  transitions:
    frames_range: [4, 8]
    whip: {frames: 6, direction: left, blur_px: 48,
           xfade: {left: slideleft, right: slideright, up: slideup, down: slidedown}}
    blur: {frames: 8, sigma: 14, xfade: fade}
    flash: {frames: 4, xfade: fadewhite}
  # Cover frame: the sharpest frame with the face, eyes open, mouth closed (face-mesh ratios: lid gap over eye
  # width, inner-lip gap over mouth width). Without MediaPipe here it is the sharpest frame. From the finished video
  # (finishing.pick_cover(video, avoid=...)): a frame every sample_every_s, edge_s in from both ends, at most
  # max_samples; a frame within avoid_margin_s of a caption or on-screen text window is taken only if all are.
  cover: {mediapipe: true, analysis_width: 512, eyes_open_min: 0.18, mouth_closed_max: 0.08,
          sample_every_s: 0.5, edge_s: 0.2, max_samples: 24, avoid_margin_s: 0.1}

# Sound design (manyworlds.sound, plan 2026-11-22 wave 3 item 9; research 2026-11-22-video-quality-wave2-3.md s.2):
# the shot sheet's `sound` (mic, room tone, effects, music) mixed under the voice in one ffmpeg pass before the finish
# stage (which sets loudness; the mix does not). Every sound file must carry a licence.
# ON for the parts that need no GPU (2026-11-23, docs/research/2026-11-23-readiness-and-craft.md: silent clips and a
# studio-dry voice are the biggest tell after resolution): procedural room tone (`room_tone`, made by ffmpeg, so no
# licence question) and the voice polish chain (`voice_polish`). The generators (`sfx`, `music`) stay off.
sound:
  enabled: true
  sample_rate: 48000
  # Procedural room tone: band-limited ffmpeg noise (anoisesrc), an optional hum (sine), a slow seeded swell
  # (tremolo), per post deterministic (seed from the post). The preset comes from the shot sheet's sound.room_tone
  # text by keyword (first rule in order that matches), else the set's words (set_id, location, weather, dressing),
  # else `default`. A library file for the cue, when one resolves, wins. Levels are first guesses: a bed should sit
  # ~30-40 dB under the voice; measure on the breadth test. Cafe murmur, crowds and voices are NOT procedural
  # (noise can't fake speech): those need a library file.
  room_tone:
    procedural: true
    amplitude: 1.0             # anoisesrc peak before the band filters and the preset's gain
    default: room_quiet
    gain_db_limits: [-60, -30]   # no preset (or jitter) can push a bed louder than this
    modulation: {rate_hz: [0.1, 0.35], depth: [0.05, 0.18], gain_jitter_db: 1.5}   # seeded per post
    duck: {enabled: true, threshold: 0.05, ratio: 2, attack_ms: 80, release_ms: 450, makeup: 1}   # gentle: rooms don't duck much
    presets:
      room_quiet: {colour: pink, highpass: 60, lowpass: 2500, gain_db: -44}
      bedroom: {colour: brown, highpass: 40, lowpass: 1200, gain_db: -46}
      kitchen: {colour: pink, highpass: 50, lowpass: 2200, gain_db: -42, hum: {hz: 100, gain_db: -14},
                bands: [{f: 200, q: 1.2, gain_db: 2}]}   # fridge compressor hum (50 Hz mains x2)
      living_room: {colour: pink, highpass: 50, lowpass: 3000, gain_db: -44}
      bathroom: {colour: pink, highpass: 120, lowpass: 5000, gain_db: -44, bands: [{f: 900, q: 1.5, gain_db: 3}]}
      street_window: {colour: brown, highpass: 40, lowpass: 900, gain_db: -38, bands: [{f: 120, q: 0.8, gain_db: 3}]}
      outdoors: {colour: pink, highpass: 80, lowpass: 6000, gain_db: -40}
      rain_glass: {colour: white, highpass: 900, lowpass: 7000, gain_db: -40, bands: [{f: 3000, q: 0.7, gain_db: 2}]}
      car_interior: {colour: brown, highpass: 30, lowpass: 600, gain_db: -36}
    keywords:
      - {preset: rain_glass, words: [rain, raining, drizzle, downpour, storm, rain on glass, wet window]}
      - {preset: car_interior, words: [car, driving, passenger seat, parked car]}
      - {preset: street_window, words: [street, traffic, city, cars, road, bus, outside window, open window]}
      - {preset: kitchen, words: [kitchen, fridge, hum, kettle, appliance]}
      - {preset: bathroom, words: [bathroom, sink, shower]}
      - {preset: bedroom, words: [bedroom, bed, duvet, quiet night, late night]}
      - {preset: living_room, words: [living room, sofa, couch, lounge, flat]}
      - {preset: outdoors, words: [park, garden, beach, outdoors, outside, walk, balcony, rooftop]}
  # Voice polish: so TTS sounds recorded in the room, not studio-dry. Each element has its own off-switch. Runs
  # after the mic EQ on every spoken video. ffmpeg deesser options are 0-1 (intensity, max reduction, frequency).
  # The room is a short aecho (no impulse response needed) sized to the set by keyword; an impulse response, when
  # one resolves, replaces it. A size `none` adds no room (outdoors).
  voice_polish:
    enabled: true
    highpass: {enabled: true, hz: 80}
    deess: {enabled: true, intensity: 0.35, max_reduction: 0.5, frequency: 0.5}
    compress: {enabled: true, threshold: 0.125, ratio: 2.5, attack_ms: 15, release_ms: 200, makeup: 1.5}
    room:
      enabled: true
      default: small
      sizes:
        small: {in_gain: 1.0, out_gain: 0.95, delays_ms: [7, 13, 19], decays: [0.14, 0.09, 0.05]}    # kitchen, bedroom
        medium: {in_gain: 1.0, out_gain: 0.95, delays_ms: [12, 23, 37], decays: [0.15, 0.1, 0.06]}   # living room, cafe
        large: {in_gain: 1.0, out_gain: 0.95, delays_ms: [21, 43, 67], decays: [0.16, 0.11, 0.07]}   # hall, gym, shop
      by_set:
        - {size: none, words: [park, garden, beach, outdoors, outside, street, walk, rooftop, balcony]}
        - {size: large, words: [hall, gym, church, shop, store, warehouse, station]}
        - {size: medium, words: [living room, lounge, cafe, restaurant, bar, classroom]}
        - {size: small, words: [kitchen, bedroom, bathroom, car, hallway, flat]}
    limits: {highpass_hz: [40, 150], ratio: [1, 4], delay_ms: [1, 80], decay: [0, 0.3]}
  # Silent formats (no voice of their own) never ship silent: room tone at minimum; with `music: true`, a quiet bed
  # from the library (an entry with kind: music and the format in its `formats`), picked per post. The shipped
  # library has none, so room tone carries them.
  silent_beds:
    formats: [story_clip, story]   # post formats with no voice; the director decides when a talking format stays silent
    music: true
  mix:
    room_tone_gain_db: -30     # a low bed under everything
    effect_gain_db: -12        # default per effect (a call can give its own)
    effect_at_s: 0.5           # production: an effect plays this long into its shot (shot sheets carry no times)
    music_gain_db: -14         # the bed before ducking; with the duck, music sits ~6-12 dB under the voice (measure it)
    duck: {threshold: 0.05, ratio: 6, attack_ms: 80, release_ms: 400, makeup: 1}   # sidechaincompress keyed by voice
    limits: {attack_ms: [50, 100], release_ms: [300, 500], ratio: [2, 20], threshold: [0.001, 1.0]}
    room_wet: 0.12             # share of the impulse-response (afir) voice mixed with the dry voice
    audio_bitrate: 320k        # the finish stage re-encodes after loudnorm
    timeout_seconds: 600
  # Mic character by shot sheet sound.mic: a band-limit EQ (Hz).
  mic_eq:
    phone: {highpass: 180, lowpass: 7500}
    lav: {highpass: 80, lowpass: 16000}
    room: {highpass: 120, lowpass: 11000}
  # Room character: key (a set_id or a mic) -> {path, licence, source, credit}. None shipped. OpenAIR IRs are licensed
  # per file (mostly CC-BY-4.0): check and credit each one.
  impulse_responses: {}
  # The catalogue: {tag, uri, licence, source, credit, kind, formats}. kind: room_tone | music | effect (optional);
  # formats: for a music bed, the silent formats it suits (silent_beds). For our own CC0 recordings or generated
  # beds (ACE-Step outputs carry their entry: licence own-generated). An entry without a licence or source, or with
  # a licence not listed here, is refused. Freesound's API is non-commercial only: never use it; a human may hand-pick CC0 files.
  # Pixabay audio is hand-picked only (its API covers images and video); its music can draw Content ID claims.
  library:
    allowed_licences: [CC0-1.0, CC-BY-4.0, Pixabay-Content-License, own-recording, own-generated]
    entries: []
    # Generated beds (manyworlds.music.generated_beds, OFF): instrumental music.song outputs (meta role instrumental,
    # an instrumental song) whose objective check passed join the catalogue as `own-generated` entries for the
    # finish (production.finish_plan), at most max_entries, newest first, within `days`. Any creator's silent clip
    # or edit can then draw one (sound.silent_beds.music, a shot's sound.music cue matching its tag).
    generated: {enabled: false, kind: music.song, require_check: true, max_entries: 40, days: 90}
  # Effects and room tone: Stable Audio 3 Small-SFX (handlers/sound_gen.py, kind sound.sfx). Code MIT; WEIGHTS under the
  # Stability AI Community License: free commercial use only under $1M annual revenue ("less than $1M in annual
  # revenue", stability.ai/license, read 2026-11-22), an Enterprise licence above that. The HF repo is gated and its
  # gate also binds the Gemma Terms of Use (a bundled component). The handler refuses unless BOTH enabled and
  # licence_accepted are true; only the owner sets licence_accepted, after reading both. Not in job_kinds or any image.
  sfx:
    enabled: false
    licence_accepted: false
    licence_name: stability-ai-community (revenue-capped at $1M/yr)
    repo: stabilityai/stable-audio-3-small-sfx
    code_ref: 790793b89ddceea612be9ce42ff6830d18f6fa57   # Stability-AI/stable-audio-3, API read 2026-11-22
    model: small-sfx
    steps: 8
    cfg_scale: 1.0
    negative_prompt: "music, speech, low quality"
    default_seconds: 10
    max_seconds: 30
    max_batch: 4
  # Music beds: ACE-Step 1.5 (kind sound.music), MIT; card: "You can strictly use the generated music for commercial
  # purposes" (HF ACE-Step/acestep-v15-base, read 2026-11-22). Instrumental only. Not in job_kinds or any image.
  # OFF until benchmarked: measure seconds of GPU per minute of bed, and listen (no vocals, no hard drops), first.
  # Each output carries its catalogue entry (licence `library_licence`, kind music, the payload's formats), so an
  # accepted bed goes straight into `library.entries`. `bed_captions`: what a quiet bed for a silent format asks for.
  music:
    enabled: false
    licence_name: MIT
    library_licence: own-generated
    bed_captions:
      story_clip: "quiet lo-fi instrumental bed, soft felt piano and warm pads, slow, no drums, no vocals, no drops"
      story: "light minimal instrumental, soft plucked guitar and gentle beat, mellow, no vocals"
    repo: ACE-Step/Ace-Step1.5
    code_ref: ca1e85fe9430179831e6bc6be790c332190a3866   # ace-step/ACE-Step-1.5, docs/en/INFERENCE.md read 2026-11-22
    config_path: acestep-v15-turbo
    project_root: /opt/acestep
    thinking: false            # no 5 Hz LM planning: we give the caption and the length
    steps: 8
    audio_format: wav
    default_seconds: 30
    max_seconds: 120
    max_batch: 2

# Original songs (manyworlds.music, worker/handlers/music_song.py, brain/lyrics.py): the toolbox for AI musician
# creators. OFF (`enabled`): no capability is offered, no music_video post is made (production.formats has none) and
# no bed joins the library until the owner turns it on after a benchmark (`mw bench music.song`, owner-approved).
# Original artists only: lyrics are written for the creator and checked in code; prompts carry genre, mood,
# instrument and vocal words, never a real artist, song or voice. Every post keeps the disclosure (scope.disclosure_line,
# set at publish); a lyric never denies being AI-made.
# Not used, on purpose: YuE2 (weights non-commercial for companies) and MiniMax Music 3 (community licence with a
# UI-attribution condition). Owner: re-check both licences before ever adding them.
music:
  enabled: false
  kind: music.song
  engine: ace_step_1_5           # the adapter that makes the song (music_song.ENGINES): ace_step_1_5 | heartmula
  library_licence: own-generated   # what a generated bed's catalogue entry says (sound.library.allowed_licences)
  engines:
    # ACE-Step 1.5 (github.com/ace-step/ACE-Step-1.5, MIT; HF card: generated music may be used commercially, read
    # 2026-11-22) in ComfyUI core (comfy_extras/nodes_ace.py: TextEncodeAceStepAudio1.5, EmptyAceStep1.5LatentAudio;
    # in our pin v0.45.0, checked by the smoke test against /object_info). Graph = Comfy-Org's split template
    # (audio_ace_step_1_5_split.json, read 2026-11-23): UNETLoader + DualCLIPLoader(type ace) + VAELoader,
    # ModelSamplingAuraFlow shift 3, KSampler 8 steps cfg 1 euler/simple, negative = ConditioningZeroOut.
    ace_step_1_5:
      licence: MIT
      repo: Comfy-Org/ace_step_1.5_ComfyUI_files
      variant: turbo
      variants:
        turbo: {diffusion_model: split_files/diffusion_models/acestep_v1.5_turbo.safetensors, steps: 8, cfg: 1.0,
                shift: 3.0, sampler: euler, scheduler: simple}
        # XL 4B DiT (needs 12-20 GB): no ComfyUI split file confirmed yet. Fill in the file after checking the
        # Comfy-Org repo; the handler refuses a variant without one.
        xl: {diffusion_model: null, steps: 8, cfg: 1.0, shift: 3.0, sampler: euler, scheduler: simple}
      text_encoders: [split_files/text_encoders/qwen_0.6b_ace15.safetensors,
                      split_files/text_encoders/qwen_1.7b_ace15.safetensors]   # text encoder, 1.7B LM planner
      vae: split_files/vae/ace_1.5_vae.safetensors
      lm: {generate_audio_codes: true, cfg_scale: 2.0, temperature: 0.85, top_p: 0.9, top_k: 0, min_p: 0.0}
      timeout_s: 900
    # HeartMuLa (github.com/HeartMuLa/heartlib, Apache-2.0): adapter slot only, no code or weights in any image yet.
    heartmula: {licence: Apache-2.0, repo: HeartMuLa/heartlib, built: false}
  limits: {min_seconds: 10, max_seconds: 240, bpm: [50, 200], languages: [en], time_signatures: ["2", "3", "4", "6"]}
  defaults: {bpm: 96, key: "C major", time_signature: "4", language: en, duration_s: 30}
  # Stems: ACE-Step makes one mix, so Demucs (github.com/facebookresearch/demucs, MIT code and weights) splits a vocal
  # stem (what the lip sync follows) and an instrumental (vocals removed) on the same worker.
  separation: {engine: demucs, model: htdemucs, shifts: 1, overlap: 0.25}
  # Objective check on the worker (bench, and production while `enforce`): the vocal stem transcribed (Whisper, as
  # the designed voices are) against the sung words (WER), the length against the asked length, the mix's loudness.
  check: {asr_model: openai/whisper-large-v3, max_wer: 0.35, min_line_coverage: 0.7, min_line_ratio: 0.7, max_duration_error_share: 0.1, lufs: [-20, -7],
          enforce: false}
  # A music_video post (production.formats: none yet): the song first (music.song), then one sung take lip-synced
  # to its vocal stem (production.talk_kind), the full mix laid under the video at the finish (production.mixing).
  video: {max_seconds: 30, max_repairs_per_post: 2}
  # Lyrics (brain/lyrics.py, llm role lyricist): written from the creator's bible and the idea, then checked here.
  lyrics:
    effort: medium
    max_attempts: 2              # a refused draft is rewritten once with its problems listed
    section_tags: [intro, verse, pre-chorus, chorus, post-chorus, bridge, hook, interlude, breakdown, outro, instrumental]
    max_lines: 40
    max_line_words: 16
    min_quote_words: 4           # a quoted passage this long reads as someone else's line: refused
    # Phrases that point at someone else's work or voice, in lyrics, titles or tags (matched at a word start).
    banned_phrases: ["in the style of", "style of", "sounds like", "sound like", "cover of", "a cover", "feat.",
                     "ft.", "featuring", "tribute to", "type beat", "inspired by", "in the vein of", "soundalike"]
    # A backstop list of real artists (the instruction and the phrases above do most of the work); names, matched
    # as whole words, case-insensitive. Extend freely.
    banned_names: [taylor swift, beyonce, beyoncé, drake, adele, ed sheeran, billie eilish, the beatles, rihanna,
                   ariana grande, the weeknd, bad bunny, kanye, eminem, harry styles, olivia rodrigo, dua lipa,
                   bruno mars, lady gaga, justin bieber, bts, blackpink, sabrina carpenter, sza, kendrick lamar,
                   michael jackson, elvis, madonna, prince, bob dylan, coldplay]
    # Lines of real songs the owner wants caught word for word (normalised); none shipped (we never store lyrics).
    known_lines: []
    # A lyric or title never denies being AI-made (disclosure is non-negotiable).
    denial_phrases: ["not ai", "not an ai", "real human", "no ai", "human voice", "not a robot"]
  bench: {seconds: 30}
  # Song anatomy (manyworlds.song_measure, manyworlds.songs; spec 2026-11-23-music-department.md section 1). The
  # registry: every feature a song is described by, its source (sound | structure | vocal | lyrics | worker |
  # aesthetics), unit and kind (number | flag | category). Direction-agnostic: analysis finds which way each goes
  # with outcomes. A new metric is a new entry here (and its measurement); analysis and similarity pick it up.
  features:
    - {name: duration_s, source: sound, unit: s, kind: number}
    - {name: tempo_bpm, source: sound, unit: bpm, kind: number}
    - {name: tempo_stability, source: sound, unit: "1 - cv of beat intervals", kind: number}
    - {name: key, source: sound, unit: key, kind: category}
    - {name: mode, source: sound, unit: major|minor, kind: category}
    - {name: key_confidence, source: sound, unit: correlation margin, kind: number}
    - {name: lufs_integrated, source: sound, unit: LUFS, kind: number}
    - {name: true_peak_dbtp, source: sound, unit: dBTP, kind: number}
    - {name: sample_peak_dbfs, source: sound, unit: dBFS, kind: number}
    - {name: loudness_range_lu, source: sound, unit: LU, kind: number}
    - {name: crest_factor_db, source: sound, unit: dB, kind: number}
    - {name: clipping_share, source: sound, unit: share of samples, kind: number}
    - {name: spectral_low_share, source: sound, unit: share of energy, kind: number}
    - {name: spectral_low_mid_share, source: sound, unit: share of energy, kind: number}
    - {name: spectral_high_mid_share, source: sound, unit: share of energy, kind: number}
    - {name: spectral_high_share, source: sound, unit: share of energy, kind: number}
    - {name: spectral_centroid_hz, source: sound, unit: Hz, kind: number}
    - {name: stereo_width, source: sound, unit: side/mid rms, kind: number}
    - {name: stereo_correlation, source: sound, unit: L/R correlation, kind: number}
    - {name: mono_loss_db, source: sound, unit: dB, kind: number}
    - {name: onset_density, source: sound, unit: onsets/s, kind: number}
    - {name: section_count, source: structure, unit: sections, kind: number}
    - {name: chorus_repeats, source: structure, unit: repeats, kind: number}
    - {name: repetition_share, source: structure, unit: share of blocks, kind: number}
    - {name: self_similarity, source: structure, unit: cosine, kind: number}
    - {name: time_to_first_chorus_s, source: structure, unit: s, kind: number}
    - {name: chorus_energy_lift_db, source: structure, unit: dB, kind: number}
    - {name: energy_range_db, source: structure, unit: dB, kind: number}
    - {name: time_to_first_vocal_s, source: vocal, unit: s, kind: number}
    - {name: vocal_presence_share, source: vocal, unit: share of time, kind: number}
    - {name: vocal_clarity_db, source: vocal, unit: dB over the rest of the mix, kind: number}
    - {name: syllables_per_beat, source: vocal, unit: syllables/beat, kind: number}
    - {name: line_coverage, source: worker, unit: share of written lines sung, kind: number}
    - {name: line_count, source: lyrics, unit: lines, kind: number}
    - {name: repetition_ratio, source: lyrics, unit: share of lines, kind: number}
    - {name: rhyme_density, source: lyrics, unit: share of line pairs, kind: number}
    - {name: syllables_per_line, source: lyrics, unit: syllables, kind: number}
    - {name: title_in_hook, source: lyrics, unit: yes/no, kind: flag}
    - {name: written_sections, source: lyrics, unit: sections, kind: number}
    - {name: written_choruses, source: lyrics, unit: sections, kind: number}
    - {name: aesthetics_pq_mix, source: aesthetics, unit: 1-10 (Audiobox production quality), kind: number}
    - {name: aesthetics_ce_mix, source: aesthetics, unit: 1-10 (Audiobox content enjoyment), kind: number}
  # How the features are measured (manyworlds.song_measure, CPU on the control plane). enabled: the producer's tick
  # measures new songs (per_tick a tick; a song that failed max_errors times is left with its error).
  measure:
    enabled: true
    # queue: a finish.measure_song job per song on the finisher (the producer only enqueues and collects); inline: in
    # the calling process (tests; `mw music measure --inline` on a big machine). The producer (512 MB) can't hold a
    # full-length 48 kHz song in memory.
    mode: queue
    queue_per_tick: 20
    per_tick: 2                  # inline: songs measured per tick
    max_errors: 3
    max_seconds: 360             # a longer file is measured over its first max_seconds (detail.truncated_at_s)
    chunk_s: 10.0                # true peak oversampled in chunks of this length
    true_peak_overlap: 64        # samples of overlap between chunks (the resampling filter's edges)
    sample_rate: 22050
    hop_length: 512
    n_fft: 2048
    n_mfcc: 13
    true_peak_oversample: 4
    clip_level: 0.999            # |sample| at or above this counts as clipped
    lra: {window_s: 3.0, hop_s: 1.0, absolute_gate_lufs: -70, relative_gate_lu: -20, percentiles: [10, 95]}
    spectral_bands: {low: [20, 250], low_mid: [250, 2000], high_mid: [2000, 6000], high: [6000, 20000]}
    # Sections: features averaged per block_s, segmented into ~duration/section_s segments (min/max_segments);
    # segments alike at label_similarity (cosine) share a label; the loudest label repeated (sections of at least
    # min_section_s) is the chorus. Repetition counts recurrences at least min_lag_s apart.
    structure: {block_s: 0.5, section_s: 6.0, min_segments: 2, max_segments: 24, label_similarity: 0.8,
                min_section_s: 2.0, min_lag_s: 4.0}
    # Vocal stem: a frame is sung when within active_below_peak_db of the stem's peak and above floor_dbfs; the
    # first vocal is the first min_entry_s of sung frames.
    vocal: {frame_s: 0.05, active_below_peak_db: 30, floor_dbfs: -50, min_entry_s: 0.5}
    lyrics: {rhyme_min_chars: 2, hook_sections: [chorus, hook, post-chorus]}
  # The learning loop (manyworlds.brain.music_analysis): song outcomes are the mean log-lift of the posts using the
  # song over the creator's baseline (brain.analysis), net of the format's mean; effects graded as brain.analysis
  # grades them (Bonferroni at alpha, min songs for tentative). mix_features: pairs tested as feature mixes
  # (product of standardised values). max_speculative: speculative effects recorded as findings per analysis.
  analysis:
    min_n_any: 8
    min_n_tentative: 16
    min_group: 4
    alpha: 0.1
    bootstrap: 300
    max_speculative: 3
    mix_features: [time_to_first_chorus_s, chorus_repeats, lufs_integrated, vocal_clarity_db]
    # Threshold bands (advisory; never a gate on media): from the artist's best songs once it has min_songs with
    # outcomes (the top best_share by outcome; the band spans their quantiles), else the genre's history (min_songs
    # in the genre), else genre_bands below.
    bands: {min_songs: 8, best_share: 0.34, quantiles: [0.2, 0.8],
            features: [tempo_bpm, lufs_integrated, true_peak_dbtp, time_to_first_vocal_s, time_to_first_chorus_s,
                       chorus_repeats, chorus_energy_lift_db, vocal_clarity_db, repetition_ratio, onset_density]}
    # Nearest songs (similarity over standardised features): the k closest among the artist's and the genre's
    # songs, needing min_shared features in common.
    similarity: {k: 5, min_shared: 6}
  # Starting bands per genre (advisory, from the musician playbook's conventions; unverified): replaced by the
  # artist's own best songs once there are enough (analysis.bands.min_songs). Keys are music.features names.
  genre_bands:
    pop: {tempo_bpm: [95, 130], lufs_integrated: [-11, -7], time_to_first_vocal_s: [0, 8], time_to_first_chorus_s: [0, 20], chorus_repeats: [2, 4]}
    indie: {tempo_bpm: [80, 125], lufs_integrated: [-13, -8], time_to_first_vocal_s: [0, 12], time_to_first_chorus_s: [0, 30], chorus_repeats: [2, 4]}
    country: {tempo_bpm: [75, 120], lufs_integrated: [-12, -8], time_to_first_vocal_s: [0, 12], time_to_first_chorus_s: [0, 30], chorus_repeats: [2, 4]}
    rock: {tempo_bpm: [90, 150], lufs_integrated: [-11, -7], time_to_first_vocal_s: [0, 15], time_to_first_chorus_s: [0, 35], chorus_repeats: [2, 4]}
    rap: {tempo_bpm: [70, 100], lufs_integrated: [-10, -6], time_to_first_vocal_s: [0, 6], time_to_first_chorus_s: [0, 25], chorus_repeats: [2, 4]}
    lofi: {tempo_bpm: [60, 90], lufs_integrated: [-16, -11], chorus_repeats: [1, 4]}
  # The critic (brain/agents/music_critic.py, llm role music_critic): describes, measures and reasons; never trusts a
  # raw 1-10 alone (a finding must cite a measurement or the listener, not only an aesthetics score). Its inputs
  # come through adapters: aesthetics (Audiobox Aesthetics, CC-BY-4.0) and listener (an Apache-2.0 audio LLM's
  # factual answers). adapter: stub (nothing heard; shipped) | worker (the music.listen GPU job: listener and
  # aesthetics in one; not built: no handler or image yet) | hosted (an OpenAI-compatible audio model through
  # manyworlds.llm: the role named here must be added to llm.roles first, after its host and price are checked).
  # fix_roles: the roles a fix may be addressed to (spec section 3). commission: a fix also enqueues brain.<role>
  # when that agent exists (none yet: the roles branch). prediction: the claim it files about the song.
  critic:
    enabled: true
    role: music_critic
    effort: medium
    max_fixes: 3
    nearest: 3
    fix_roles: [songwriter, lyricist, melody, producer, vocal_director, mix_master]
    draft_fix_roles: [songwriter, lyricist, producer, vocal_director]   # a draft review's fixes (before any audio)
    commission: false
    aesthetics: {adapter: stub}
    listener: {adapter: stub, hosted_role: music_listener, worker_kind: music.listen, audio_format: mp3,
               max_audio_mb: 20}
    prediction: {horizon_days: 14, metrics: [song_median_reach, song_reach_lift]}
  # The roles (spec section 3; brain/agents/<role>.py, shared machinery brain/music_roles.py). Each has its llm role
  # (a model in llm.roles: swap a role's model there), effort and its own daily budget (brain.llm_usd_per_day.<role>).
  roles:
    head_of_music: {llm_role: head_of_music, effort: medium, max_concepts: 10, max_songs_per_week: 3}
    a_and_r: {llm_role: a_and_r, effort: medium, max_pitches: 3, max_findings: 30}
    music_talent_manager: {llm_role: music_talent_manager, effort: medium, songs_per_review: 2, recent_songs: 20,
                           resolved_predictions: 10, max_predictions: 2}
    songwriter: {llm_role: music_songwriter, effort: medium}
    lyricist: {llm_role: lyricist}          # brain/lyrics.py: its own role and checks
    producer: {llm_role: music_producer, effort: low}
    vocal_director: {llm_role: music_vocal_director, effort: low}
    melody: {llm_role: music_melody, effort: low, max_takes: 4}
    mix_master: {llm_role: music_mix_master, effort: low, lufs_range: [-14, -8], max_true_peak_dbtp: -1.0}
    curator: {llm_role: music_curator, effort: low, tracks: {single: [1, 1], ep: [3, 6], album: [8, 14]}}
  # The song pipeline (manyworlds.music_pipeline): writing roles in order, the critic's draft review and up to
  # revision_limit rounds of fixes before any GPU (a draft still judged rethink stops: stop_on_rethink), `takes`
  # candidate takes (at most roles.melody.max_takes), then the after-take steps (voice_conversion: a slot, no-op until
  # built). skip: roles left out; artists.<handle>: overrides per artist. poll_seconds/max_waits: how the
  # brain.music_pipeline job waits for real takes. stub: the sandbox's stand-in measurements.
  pipeline:
    writing: [songwriter, producer, lyricist, vocal_director]
    draft_review: true
    revision_limit: 2
    stop_on_rethink: true
    takes: 2
    after: [melody, music_critic, mix_master, voice_conversion]
    skip: []
    artists: {}
    song_seconds: 30
    best_songs_shown: 3
    poll_seconds: 120
    max_waits: 200
    stub: {lufs: [-14, -8], hook_sd_s: 2.0, max_vocal_entry_s: 8, default_hook_s: 10}
  # The music portfolio (brain.music_portfolio, spec section 6): head_of_music's share of the month's usable budget
  # (the CEO's allocation), the genres the portfolio aims to cover, how close two artists may sound (RMS distance of
  # standardised song-feature centroids) and how many artists one genre takes.
  portfolio:
    budget_share: 0.2
    genres: [pop, indie, country, rock, rap, lofi]
    min_artist_distance: 0.5
    max_artists_per_genre: 3
    min_shared_features: 4
    feature_sources: [sound, structure, vocal, lyrics]
  # Music experiments (brain.experiments music_*): a tentative finding about one feature becomes a two-arm test on
  # songs, arms assigned per release batch; read once each arm has min_songs_per_arm songs with outcomes.
  experiments:
    min_songs_per_arm: 6
    max_open_per_artist: 1
    instructions:
      time_to_first_chorus_s: {high: "the chorus arrives late (after 20 seconds), after a full verse",
                               low: "the hook (chorus) lands within the first 8 seconds"}
      chorus_repeats: {high: "the chorus repeats at least three times", low: "the chorus comes once or twice"}
      time_to_first_vocal_s: {high: "an instrumental intro before the voice", low: "the voice from the first second"}
  # The sandbox runner (`mw music sandbox <handle> --songs N [--usd X] [--create --genre G]`, manyworlds.music_sandbox):
  # stubbed GPU, one LLM cap for the run.
  sandbox: {max_usd: 5.0, default_songs: 3}
  # One singing voice per artist (spec section 5; manyworlds.singing_voice, creator/music_voice.py,
  # worker/handlers/music_voice.py). ACE-Step's voice changes with every seed, so a song's vocal stem is converted
  # into the artist's voice (singing voice conversion keeps the source pitch, melody and phrasing; only the timbre
  # changes) and remixed over the instrumental stem. OFF: production converts only while `enabled`.
  voice:
    enabled: false
    kinds: {convert: music.convert_voice, train: music.train_voice}
    adapter: auto                # soulx_svc | rvc | auto (rvc when the asset has a trained model, else soulx_svc)
    trainer: rvc
    # The owner's switch for an adapter whose licences were not all verified from primary sources (both the control
    # plane and the worker refuse such an adapter while this is false). Never set by code.
    allow_unverified_licences: false
    adapters:
      # SoulX-Singer (github.com/Soul-AILab/SoulX-Singer): LICENSE Apache-2.0; README: Apache 2.0 covers "codes and
      # model weights"; HF Soul-AILab/SoulX-Singer (model-svc.pt) and Soul-AILab/SoulX-Singer-Preprocess (rmvpe/rmvpe.pt)
      # both license: apache-2.0; content features from openai/whisper-base (apache-2.0); the vocoder ships inside
      # model-svc.pt. Read 2026-11-23. Only RMVPE is taken from the preprocess repo: its vocal separation (becruily
      # karaoke: no licence stated; anvuew dereverb: GPL-3.0) is never run (we separate with Demucs, vocal_sep off).
      soulx_svc:
        licence: Apache-2.0
        licence_verified: true
        licence_notes: "code + weights Apache-2.0 (README, HF cards); whisper-base Apache-2.0; RMVPE from the Apache-2.0 preprocess repo; vocal_sep (GPL dereverb) never used"
        repo: Soul-AILab/SoulX-Singer
        commit: 81aeb3ae772c70093c3de74dc23c92d983801ae4
        weights: {repo: Soul-AILab/SoulX-Singer, file: model-svc.pt, config_file: config.yaml}
        preprocess: {repo: Soul-AILab/SoulX-Singer-Preprocess, files: [rmvpe/rmvpe.pt]}
        config: soulxsinger/config/soulxsinger.yaml      # in the repo
        language: English
        n_steps: 32
        cfg: 3.0
        fp16: true
        auto_shift: false          # source pitch kept: never shifted toward the prompt's register
        pitch_shift: 0
        sample_rate: 24000         # the model's output rate (config sample_rate)
        prompt_seconds: 8.0        # the prompt clip: the most voiced stretch of the asset's prompt (the seed vocal stem)
        timeout_s: 900
      # RVC (github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI): code MIT. NOT verified: the assets repo
      # (HF lj1995/VoiceConversionWebUI: hubert_base, rmvpe.pt, pretrained_v2 f0G/f0D) is card-licensed MIT but its
      # licence file adds a research-use clause; rmvpe.pt was trained by yxlllc and RVC-Boss (yxlllc/RMVPE has no
      # licence file); hubert_base is ContentVec per RVC's credits (ContentVec code MIT; that this checkpoint is it is
      # not stated); the base models were trained on VCTK (CC BY 4.0 per a mirror, primary record unread). Read
      # 2026-11-23. Refused until the owner reads these and sets licence_verified (or allow_unverified_licences).
      rvc:
        licence: MIT
        licence_verified: false
        licence_notes: "RVC code MIT; lj1995/VoiceConversionWebUI assets MIT + research-use clause; rmvpe.pt weights licence unstated; base models on VCTK (CC BY 4.0, primary unconfirmed)"
        repo: RVC-Project/Retrieval-based-Voice-Conversion-WebUI
        commit: 81eed5e8f68b6bed1789f682fe78cdd324495afc
        assets: {repo: lj1995/VoiceConversionWebUI, revision: e6d0c1a17da07c33557852f9dfa2bd44cc75737d,
                 files: [hubert_base/config.json, hubert_base/preprocessor_config.json, hubert_base/pytorch_model.bin, rmvpe.pt, pretrained_v2/f0G40k.pth, pretrained_v2/f0D40k.pth, mute.zip]}
        infer: {f0_method: rmvpe, pitch: 0, index_rate: 0.75, protect: 0.33, rms_mix_rate: 1.0}
        train: {sample_rate: 40k, version: v2, epochs: 200, batch_size: 8, save_every: 50, cache_in_gpu: false,
                pretrained_g: pretrained_v2/f0G40k.pth, pretrained_d: pretrained_v2/f0D40k.pth, slice_db: 3.7,
                min_seconds: 300, max_seconds: 3600}
        timeout_s: 900
        train_timeout_s: 8400
    # The new mix: the converted vocal at the stem's loudness (RMS-matched), plus `vocal_gain_db`, over the
    # instrumental; a peak ceiling so the sum never clips.
    remix: {vocal_gain_db: 0.0, peak_ceiling: 0.98, match_loudness: true}
    # Voice similarity (worker/handlers/music_voice.voice_similarity): SpeechBrain ECAPA-TDNN (speechbrain/spkrec-
    # ecapa-voxceleb, Apache-2.0; the designed voices' embedder) on voiced windows of the vocal stem. A window is
    # voiced when `min_voiced_share` of its frames are within `voiced_db` of the stem's loudest frame. WavLM-sv
    # (microsoft/wavlm-base-plus-sv) is optional and off: its card points to UniSpeech's CC BY-SA 3.0 licence.
    similarity:
      model: speechbrain/spkrec-ecapa-voxceleb
      window_s: 4.0              # within the research's 3-6 s
      hop_s: 2.0
      frame_s: 0.05
      voiced_db: -30
      min_voiced_share: 0.7
      min_windows: 3
      max_windows: 60
      wavlm: {enabled: false, model: microsoft/wavlm-base-plus-sv, licence: CC-BY-SA-3.0}
    # Report-only until calibrated (singing and stem bleed degrade speech encoders): min_similarity comes from
    # singing_voice.calibrate on our own songs (same-artist vs other-artist spread), then the owner may enforce.
    gate: {enforce: false, min_similarity: null}
    # Creating a voice (creator/music_voice.py): seed candidates (ACE-Step vocals from the artist's vocal tags), one
    # picked as far as possible from every other artist; then a sung dataset across registers, each song converted
    # zero-shot toward the seed and the least similar dropped; then her RVC model on what is left.
    creation:
      seed_candidates: 8
      seed_seconds: 30
      min_distance: 0.35         # 1 - cosine to every other artist's centroid (creators must not sound alike)
      registers:                 # how the dataset spreads her range: song keys and tags per register
        low: {keys: ["E minor", "F major", "D minor"], tags: "low register, chest voice, intimate", bpm: [70, 90]}
        mid: {keys: ["G major", "A minor", "C major"], tags: "mid register, warm, conversational", bpm: [90, 115]}
        high: {keys: ["B minor", "D major", "E major"], tags: "high register, head voice, soaring", bpm: [100, 130]}
      songs_per_register: 7
      dataset_seconds: 60
      dataset_keep_share: 0.8    # the most similar share of converted clips is kept for training
      min_train_clips: 8
      default_tags: "pop, clear lead vocal"   # the vocal and genre words when the bible has none (bible.music.vocal_tags)
      target_minutes: [10, 30]
  # The voice-consistency bench (`mw bench music.convert_voice`): N songs for one test artist, each converted.
  voice_bench: {seconds: 30}

