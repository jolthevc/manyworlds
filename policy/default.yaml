# Manyworlds policy file. Every number here is a starting value, not a constant:
# the Brain may propose changes, and changes beyond `limits` need a human.
# Each decision and cost entry records the hash of the policy it ran under.

budgets:
  daily_usd: 25.0              # hard cap on total spend per day
  per_creator_daily_usd: 3.0
  mvp_week_usd: 100.0

# Rented GPU machines. The autoscaler (manyworlds.deploy.autoscale) starts them when jobs
# wait and registers each with a deadline and spend cap first. Three independent layers
# stop them: the always-on autoscaler, the same tick on GitHub Actions, and workers on
# Vast/RunPod destroying their own machine when idle or past deadline.
gpu_runs:
  default_max_hours: 2
  default_max_usd: 1.0
  max_hours_by_family: {train: 3}   # boot + model download + ~1h of training
  max_usd_by_family: {}
  max_hours_limit: 12          # the launcher refuses anything longer
  idle_stop_minutes: 20        # no open jobs for this long -> stop (SaladCloud: nodes pull images slowly)
  # Vast/RunPod machines start and load models in ~4-5 min, so idling longer than that costs
  # more than starting a fresh one when work returns.
  idle_stop_minutes_by_provider: {vast: 5, runpod: 5}
  boot_grace_minutes: 45       # until its first job, a machine may take this long (image pull + model download)
  stuck_minutes: 10            # started work, jobs waiting, no heartbeat or attempt this long -> stop
  # One attempt running longer than this stops its machine (a stalled model download heartbeats
  # fine but never finishes). A first image job, model download included, takes ~5-6 min on Vast.
  max_attempt_minutes_by_family: {default: 20, video: 45, train: 240}
  max_attempt_minutes_by_kind: {image.mirror: 120, video.mirror: 120}  # one-time copy into our bucket; resumes across machines
  daily_gpu_usd: 10.0          # all groups together, billed, per UTC day

# Where GPU work runs. Prices are per GPU-hour (Nov 2026 snapshots; re-check).
# The router prefers the cheapest pool that can run the job kind.
gpu_pools:
  salad_batch_4090:  {provider: salad,  gpu: rtx4090, usd_per_hour: 0.16, interruptible: true}
  salad_batch_5090:  {provider: salad,  gpu: rtx5090, usd_per_hour: 0.25, interruptible: true}
  salad_batch_3090:  {provider: salad,  gpu: rtx3090, usd_per_hour: 0.09, interruptible: true}
  salad_batch_a5000: {provider: salad,  gpu: rtxa5000, usd_per_hour: 0.09, interruptible: true}
  salad_batch_3060:  {provider: salad,  gpu: rtx3060, usd_per_hour: 0.04, interruptible: true}
  salad_low_4090:    {provider: salad,  gpu: rtx4090, usd_per_hour: 0.253, interruptible: true}
  salad_low_5090:    {provider: salad,  gpu: rtx5090, usd_per_hour: 0.367, interruptible: true}
  salad_medium_4090: {provider: salad,  gpu: rtx4090, usd_per_hour: 0.347, interruptible: true}
  salad_medium_5090: {provider: salad,  gpu: rtx5090, usd_per_hour: 0.483, interruptible: true}
  salad_high_4090:   {provider: salad,  gpu: rtx4090, usd_per_hour: 0.44, interruptible: true}
  salad_high_5090:   {provider: salad,  gpu: rtx5090, usd_per_hour: 0.60, interruptible: true}
  # Vast is a marketplace: usd_per_hour is the most we'll pay; the machine's actual
  # price (from Vast's instance listing, storage included) is what gets metered.
  # worker_env: Linux hosts have the whole card free, so image workers load the full model
  # (no CPU offload) when 22 GB is free; 24 GB cards report ~25 GB.
  vast_3090:         {provider: vast,   gpu: rtx3090, usd_per_hour: 0.20, interruptible: false, worker_env: {MW_OFFLOAD_BELOW_GB: 22}}
  vast_4090:         {provider: vast,   gpu: rtx4090, usd_per_hour: 0.40, interruptible: false, worker_env: {MW_OFFLOAD_BELOW_GB: 22}}
  vast_5090:         {provider: vast,   gpu: rtx5090, usd_per_hour: 0.50, interruptible: false, worker_env: {MW_OFFLOAD_BELOW_GB: 22}}
  runpod_comm_3090:  {provider: runpod, gpu: rtx3090, usd_per_hour: 0.22, interruptible: false, worker_env: {MW_OFFLOAD_BELOW_GB: 22}}
  runpod_comm_4090:  {provider: runpod, gpu: rtx4090, usd_per_hour: 0.34, interruptible: false, worker_env: {MW_OFFLOAD_BELOW_GB: 22}}
  runpod_comm_5090:  {provider: runpod, gpu: rtx5090, usd_per_hour: 0.69, interruptible: false, worker_env: {MW_OFFLOAD_BELOW_GB: 22}}
  runpod_sls_4090:   {provider: runpod_serverless, gpu: rtx4090, usd_per_hour: 1.34, interruptible: false}
  local:             {provider: local,  gpu: none,    usd_per_hour: 0.0,  interruptible: false}

# Job kinds and the pools allowed to run them. The autoscaler orders them by measured cost
# per accepted output (autoscale.scoring); this order only breaks ties and decides which
# unmeasured pool is tried first.
# RunPod community pools are out of the defaults: three 4090 pods in a row failed every job with
# "CUDA unknown error" (2026-11-13), even with allowedCudaVersions set. Pin with --pools to retest.
# salad_batch_a5000 is out of the image defaults too: SaladCloud's 3090 and 4090 cost $0.023-0.025 per
# accepted image against Vast 3090's $0.0027 (same Windows consumer nodes), so its trial isn't worth it.
job_kinds:
  image.zimage:    {pools: [vast_3090, vast_4090, salad_batch_3090, salad_batch_4090], outputs_per_job: 4}
  image.mirror:    {pools: [vast_3090, vast_4090], outputs_per_job: 0}   # copies model weights into R2 once
  image.narrated:  {pools: [vast_3090, vast_4090], outputs_per_job: 1}   # CPU edit (voice + ffmpeg) on image machines
  video.wan_i2v:   {pools: [vast_4090, vast_5090], outputs_per_job: 1}   # Wan 2.2 TI2V-5B; not yet in production.formats
  video.mirror:    {pools: [vast_4090, vast_5090], outputs_per_job: 0}
  tts.kokoro:      {pools: [salad_batch_3060, vast_3090, salad_batch_4090, vast_4090], outputs_per_job: 1}
  train.lora:      {pools: [vast_3090, vast_4090, salad_batch_3090], outputs_per_job: 1}
  fake.image:      {pools: [local], outputs_per_job: 4}
  fake.video:      {pools: [local], outputs_per_job: 1}
  fake.tts:        {pools: [local], outputs_per_job: 1}

# One worker image per job family, and what each machine needs. RAM is system memory:
# loading and quantising models happens there before anything reaches the GPU.
worker_images:
  # env: passed to every worker of the family; a pool's worker_env overrides it.
  # HF_HUB_DISABLE_XET: plain HTTP for the one-time mirror download. A Vast worker stalled in the Xet
  # downloader (2026-11-14); the "process() takes no keyword arguments" failures were Brotli 1.1 (fixed in v8).
  image: {image: mw-worker-image, tag: v10, min_cuda: 12.8, cpu: 4, ram_gb: 24, disk_gb: 80,
          env: {MW_OFFLOAD_BELOW_GB: 26, HF_HUB_DISABLE_XET: 1}}   # 26 = always offload on 24 GB cards (SaladCloud/WSL)
  tts:   {image: mw-worker-tts,   tag: day1, min_cuda: 12.8, cpu: 2, ram_gb: 8,  disk_gb: 30}
  # video runs on the image worker image (same diffusers stack) with the video model selected by env.
  video: {image: mw-worker-image, tag: v10, min_cuda: 12.8, cpu: 8, ram_gb: 48, disk_gb: 100,
          env: {MW_VIDEO_BACKEND: diffusers, MW_VIDEO_MODEL: Wan-AI/Wan2.2-TI2V-5B-Diffusers, HF_HUB_DISABLE_XET: 1,
                MW_VIDEO_OFFLOAD_BELOW_GB: 40}}   # 40: offload on 24-32 GB cards until measured
  train: {image: mw-worker-train, tag: v3, min_cuda: 12.8, cpu: 8, ram_gb: 48, disk_gb: 100,
          env: {HF_HUB_DISABLE_XET: 1}}

# What each provider calls each GPU.
gpu_names:
  rtx3060:  {salad: "RTX 3060",  vast: "RTX 3060",  runpod: "NVIDIA GeForce RTX 3060"}
  rtx3090:  {salad: "RTX 3090",  vast: "RTX 3090",  runpod: "NVIDIA GeForce RTX 3090"}
  rtx4090:  {salad: "RTX 4090",  vast: "RTX 4090",  runpod: "NVIDIA GeForce RTX 4090"}
  rtx5090:  {salad: "RTX 5090",  vast: "RTX 5090",  runpod: "NVIDIA GeForce RTX 5090"}
  rtxa5000: {salad: "RTX A5000", vast: "RTX A5000", runpod: "NVIDIA RTX A5000"}

# The autoscaler starts machines when jobs are waiting and stops them when the queue
# drains. A provider is skipped when its API key isn't configured.
autoscale:
  tick_seconds: 60
  tick_lease_seconds: 600      # a crashed tick's lock expires after this
  max_groups_per_kind: {default: 2, image: 6}   # most machines at once per job kind
  # How many machines a backlog gets: enough to finish it within drain_target_minutes,
  # from the median job time of the last history_days (default_job_seconds before any data).
  # Each extra machine costs one boot (~4-5 min on Vast), so small backlogs stay on one.
  scale:
    drain_target_minutes: {default: 30, train: 180}
    history_days: 7
    default_job_seconds: {default: 120, image: 60, video: 300, train: 7200}
  relaunch_cooldown_minutes: 15  # after a machine for a kind stops, wait before starting another
  # CN: huggingface.co is unreachable there, so workers that fetch weights at start never begin.
  runpod_cuda_versions: ["12.8", "12.9", "13.0"]   # versions RunPod accepts in allowedCudaVersions
  vast: {min_reliability: 0.98, verified_only: true, offers_to_try: 3, min_inet_down_mbps: 200, exclude_countries: [CN]}
  worker_self_stop: true         # workers on Vast/RunPod destroy their own machine when idle or past deadline
  # Pools are tried cheapest per accepted output first, from what machines actually billed
  # (boot, idle and failures included) over the window. A number or {family: number, default: n}.
  scoring:
    enabled: true
    window_days: 7
    min_outputs: {default: 20, video: 5, train: 1}   # outputs before a pool is ranked
    trial_usd: {default: 0.30, video: 0.60, train: 1.00}   # most spent measuring an unranked pool per window
    pause_after_failed_machines: 3   # this many machines in a row with no output pauses the pool...
    pause_hours: 24                  # ...for this long, then it gets a new trial

# Review gates for generated images (manyworlds.review.gates). Scores are 0-10.
review:
  image:
    # Two stages: every image is screened by `role`; only screen passes go to `confirm_role`.
    # On Maren's LoRA test (2026-11-14) Haiku 5.5 and Opus 5.5 rejected the same 12 of 12;
    # Opus cost $0.012 per image (17x the image itself), Haiku $0.0003.
    role: review
    effort: low
    confirm_role: judge
    confirm_effort: low
    confirm_top_per_job: 2     # Opus confirms the best 2 screen passes per job (one prompt); 0 = all
    min_identity: 7
    min_realism: 6
    reference_images: 3        # creator reference photos shown with every review
    max_jobs_per_run: 50
    loop_seconds: 120          # how often the reviewer looks for new images
  max_repairs_per_post: 4      # day 5: regenerations allowed before a post is dropped

generation:
  image: {width: 896, height: 1152, steps: 9, guidance: 0.0}
  video: {width: 704, height: 1280, frames: 121, steps: 30, guidance: 5.0, fps: 24}   # TI2V-5B 720p, 5 s; to benchmark

# What the Brain may explore. It picks creators and niches inside this scope itself.
scope:
  niche: "lifestyle, wide net: daily life, style, food, home, travel, fitness-as-lifestyle, humor"
  platforms: [instagram, tiktok]
  excluded_topics: [politics, news, health advice, medical claims, financial advice,
                    crypto, gambling, sexualized content, minors, real brands without rights]
  creator_min_age: 21
  disclosure_line: "AI-generated character"

research:
  hashtags_per_platform: 6
  items_per_hashtag: 30
  max_items_per_run: 400
  theses_per_run: 5
  apify_actors:
    instagram: apify~instagram-hashtag-scraper
    tiktok: clockworks~tiktok-scraper
  usd_per_1k_items: {instagram: 2.70, tiktok: 1.70}   # for the ledger; check the Apify invoice

creator_lab:
  reference_prompts: 12          # angles/scenes in the reference pack
  candidates_per_reference: 4
  lora: {steps: 1200, rank: 16, learning_rate: 0.0001, resolution: 1024, log_upload_seconds: 120}
  lora_scale: 1.0               # 1.3 did no better on Maren (2026-11-14)

# Model weights served from our bucket (manyworlds.worker.models): rented machines load them
# from R2 (free egress, no rate limits) instead of Hugging Face. The producer queues one
# mirror job per repo that isn't in the bucket yet.
models:
  mirror:
    - {repo: Tongyi-MAI/Z-Image-Turbo, kind: image.mirror}
    - {repo: Wan-AI/Wan2.2-TI2V-5B-Diffusers, kind: video.mirror}
  max_mirror_jobs: 8           # each try resumes from what the bucket already has
  priority: 10

# Creator profiles (manyworlds.creator.profile). Dials are set per creator by the Brain (or a
# human) within dials_limits; these defaults seed new profiles.
creators:
  profile_role: creator
  dials_default:
    posts_per_day: {tiktok: 3, instagram: 2}
    images_per_video: 3          # early on: three photo posts per video post
    hashtags_max: {instagram: 1, tiktok: 2}   # Instagram says hashtags barely affect reach; TikTok reads caption words
  dials_limits: {posts_per_day_max: 6, images_per_video_min: 1, images_per_video_max: 6, hashtags_max: 3}

# Content planner (manyworlds.brain.planner): one Brain call per creator per period, rolling.
# formats: images per post [min, max]. Video posts belong to one of the creator's video series.
planner:
  role: brain
  effort: medium
  days: 3                      # short periods: each plan sees the latest posts and settings
  plan_ahead_days: 2           # the producer plans the next period when less than this is planned
  auto_statuses: [draft, active]   # creators the producer plans for (needs a profile and reference images)
  formats: {photo: [1, 1], carousel: [2, 4], narrated_edit: [3, 6], story_clip: [1, 1]}
  video_formats: [narrated_edit, story_clip]
  # What each format can show; the planner writes to these limits.
  format_notes:
    photo: "one candid photo"
    carousel: "2-4 photos of the same moment, evening or day, in order"
    narrated_edit: "3-6 photos in sequence with the creator's own voice reading `script` (15-30 s of natural speech, said the way they talk) and burned-in captions; routine montages belong here"
    story_clip: "ONE 5-second shot animated from ONE photo, with one simple motion (steam rising, rain running down glass, a hand lifting a mug); `script` says only what moves. Never a montage or several actions"
  post_hours_utc: [12, 15, 17, 19, 21, 23]   # nth post of a day goes out at the nth hour
  recent_posts: 30             # shown back to the planner for continuity

# Captions that read as written by an AI are dropped (manyworlds.brain.planner.caption_issues).
captions:
  max_emoji: 2
  banned_phrases: [embrace, "little things in life", romanticiz, "core memory", "living my best", obsessed,
                   "game changer", "game-changer", journey, self-care, "self care", "main character", "vibes",
                   "let's dive", "here's to", "cozy season", "soul", "magic of", "the simple joys",
                   "nothing beats", "who else", "drop a", "comment below", "link in bio"]
  no_em_dash: true

# Production (manyworlds.production): planned posts -> image jobs -> reviewed images.
# On Maren with the full appearance prompt, 12 of 12 images passed review, so 4 candidates
# per scene (one job) leaves room for the confirm stage to pick; failures get repaired.
production:
  image_kind: image.zimage
  formats: [photo, carousel, narrated_edit]   # formats production makes now; others wait in 'planned' until added
  candidates_per_scene: 4
  lead_hours: 48               # start making a post this long before it is scheduled
  loop_seconds: 120
  max_job_failures_per_post: 6   # failed jobs (machines, downloads) per post; apart from review repairs
  edit: {speed: 0.95, width: 1080, height: 1920, fps: 30}   # narrated edits (edit.narrated)

# Claude models by role. Low-volume judgement work runs on Opus; bulk roles
# (captions, first-pass judging) come in later days and can point elsewhere.
llm:
  roles:
    brain: claude-opus-5-5
    research: claude-opus-5-5
    creator: claude-opus-5-5
    judge: claude-opus-5-5
    review: claude-haiku-5-5     # first-pass image screen (manyworlds.review); every image
  server_fallback_models: [claude-opus-5-5, claude-sonnet-5-5, claude-fable-5-2]   # models that take fallbacks: "default"
  usd_per_mtok:                  # input, output, cache_read, cache_write
    claude-opus-5-5:   [4.00, 20.00, 0.20, 5.00]
    claude-sonnet-5-5: [2.00, 10.00, 0.10, 2.50]
    claude-haiku-5-5:  [0.10, 0.50, 0.01, 0.125]

queue:
  lease_seconds: 120           # a worker that stops heartbeating loses its job after this
  max_attempts: 3              # per job, then it is marked dead and reported
  worker_max_consecutive_faults: 3   # GPU faults in a row before a worker exits for a restart
  job_max_worker_faults: 6           # a job that faults this many machines fails (it's the cause)
  connect_timeout_seconds: 20        # a rented host that can't reach the database fails fast
  startup_connect_attempts: 3        # then the worker destroys its own machine (Vast/RunPod)

autonomy:
  publish: human_approval      # human_approval | sampled | autonomous
  comment_replies: disabled

limits:                        # bounds the Brain may not cross without a human
  daily_usd_max: 100.0
  max_attempts_max: 5
