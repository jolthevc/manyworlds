# The breadth test's policy (2026-11-23, docs/research/2026-11-23-readiness-and-craft.md): deep-merged over
# policy/default.yaml (manyworlds.policy.with_overlay: dicts key by key, lists replaced) for the breadth test's own
# posts only. `mw test breadth` applies it to everything it does; the autoscaler reads it only for work in batches
# named by operations.test_overlay.batches (test-breadth-*), to choose the machine. Production never reads it.

production:
  # Every post format the director composes with (others extend this list as they add formats). The test only.
  formats: [photo, carousel, story, story_clip, narrated_edit, talking_video]
  # A failed video is shown as failed, not shipped quietly as a photo: the test must see every failure.
  reroute_failed_video: {}

review:
  # The direction gate is report-only for the test: scores are recorded, nothing is rejected on them (min 6 is not
  # calibrated yet, and InfiniteTalk can't hit timed beats, so directed talk clips would be dropped wholesale).
  direction: {min_score: 0, enforce: false}

generation:
  talk:
    max_take_seconds: 30   # the 720p profile times out past ~25 s at ~50 s of GPU per second of video (3000 s limit)
  borrowed_motion: true    # Wan-Animate-2 motion references: tests only (generation.borrowed_motion in default.yaml)

autonomy:
  publish: paused          # the kill switch: nothing the test makes is published

autoscale:
  # One machine for the test where possible: walk-and-talk crosses voice, comfy and talk, all on the
  # mw-worker-talkcomfy image, so one machine serves them all (and dance) and the post pays one cold boot, not three
  # (manyworlds.deploy.autoscale merge_groups; the image tag is the newest of the members'). Unproven on a real
  # machine: the first run shows whether one worker holding several models in turn fits a 48 GB L40S.
  merge_families:
    # The run's voice, motion and lip sync work runs one job at a time on this one machine, so it gets its own limits
    # (review 2026-11-22: the members' 2.5 h / $3 cut renders off mid-job and paid a reboot ~4 times a run).
    # ram_gb: the worker process (VoxCPM, Whisper) and ComfyUI's models are resident together.
    talkcomfy: {families: [voice, comfy, talk, dance], max_hours: 6, max_usd: 7.0, ram_gb: 64}

# The breadth driver (manyworlds.breadth, `mw test breadth`).
breadth:
  batch_prefix: test-breadth-      # must start with an operations.test_batch_prefixes entry (paused machines take it)
  require_paused: true             # refuse while operations are live (the producer would advance these posts too)
  deadline_hours: 12               # from the run's first post; then queued jobs are cancelled and the run stops
  cancel_on_deadline: true
  max_usd: 12                      # the run stops (queued jobs cancelled) once its jobs and machines have cost this
  refuse_beside_open_tests: true   # other open test batches could share or start machines: finish them first
  max_reconnects: 20               # a dropped database connection: reconnect and resume the run (mw test breadth)
  go: {min_pass_share: 0.6, min_items: 1}   # per-format verdict in the report: go at this ready share or better
  loop_seconds: 60                 # how often the driver advances its posts
  review_in_driver: true           # the driver reviews its batches under this overlay (direction report-only)
  report_url_seconds: 86400        # presigned links in the report last a day
  # Where each worker family's jobs run (pinned; a plan's `pools` replaces this). The L40S with the weights volume
  # first (talk, comfy, voice and dance weights are cached there), the same card without it as the fallback. Image
  # work (mw-worker-image) is not pinned: it goes to its cheapest pool.
  pools_by_family:
    talk: [runpod_secure_l40s_vol, runpod_secure_l40s]
    comfy: [runpod_secure_l40s_vol, runpod_secure_l40s]
    voice: [runpod_secure_l40s_vol, runpod_secure_l40s]
    dance: [runpod_secure_l40s_vol, runpod_secure_l40s]
    edit: [runpod_secure_l40s, runpod_secure_h100]   # off the 150 GB weights volume: Qwen-Image-Edit is ~58 GB
    image: [runpod_comm_3090, runpod_comm_4090, vast_3090, vast_4090]   # RunPod or Vast community cards (2026-11-23: RunPod 3090s ran out mid-run)
  # Dry-run estimates (labelled as policy, not measured). Where finished attempts exist, their median is used.
  estimate:
    # talk renders scale with the take: ~50 s of GPU per output second (ComfyUI InfiniteTalk, 10 steps, 2026-11-22)
    # talk.longcat (LongCat 1.6, one take, INT8 on an L40S): an estimate, not measured: ~150 s per 3.2 s segment
    # (8 steps of a ~14B DiT over 93 frames at 480p, plus decode) is ~47 s per output second.
    # Candidates (plan candidates), unmeasured guesses until the first run replaces them:
    #   echomimic_v3_flash on a 4090: 12. Its node's PR #171 made a 512x512 8-step clip in ~121 s end to end on a
    #     12 GB 4070 SUPER (length not stated); a 4090 is ~2x that card, our 576x1024 is ~2.25x the pixels.
    #   ltx25_* on an L40S: 8. 22B distilled int8, 8 + 3 steps over two scales; no measured L40S timing found.
    #   longcat_fast (LongCat 1.0 in the wrapper, 6 steps) on a 5090: 20. longcat-avatar-fast's table: the stock 1.6
    #     demo is ~36 s per output second on a 5090 at 8 steps; 6 steps and fp8 fast matmul take some of that off.
    seconds_per_output_second: {talk.infinitetalk: 50, talk.longcat: 50, comfy.graph:echomimic_v3_flash: 12,
                                comfy.graph:ltx25_a2v: 8, comfy.graph:ltx25_i2v_av: 8,
                                talk.infinitetalk:longcat_fast: 20}
    boot_seconds: {default: 600, talkcomfy: 900}   # boot + image pull + model load per machine (talk weights first)
    # A graph's or talk profile's own weights (its download_gb) on top of the boot, once per machine: ~100 MB/s, from
    # a first image job's ~30 GB downloaded within ~5-6 min on Vast (the gpu_runs max_attempt_minutes_by_family note).
    download_mb_per_second: 100
    review_usd_per_output: 0.01    # screen + confirm calls per reviewed output, roughly
  # What each capability needs before an item exercising it can run: policy switches that must be on (`requires`,
  # dotted paths) and job kinds that must exist (`kinds`). An item whose capability is missing here, or not wired, is
  # skipped with the reason. Point a capability at its real switch once another part of the build ships it.
  capabilities:
    photo: {}
    carousel: {}
    story: {}
    story_clip: {}
    posing: {}
    prop_interaction: {}
    makeup_interaction: {}
    outfit_change: {}
    scene_change: {}
    long_take: {}
    camera_propped: {}
    camera_selfie: {}
    camera_mirror: {}
    camera_pov: {}
    talking: {kinds: [talk.infinitetalk]}
    kokoro_voice: {}
    designed_voice: {kinds: [voice.speak]}
    voiceover_broll: {kinds: [image.narrated]}
    cutaway_broll: {requires: [generation.talk_hybrid.enabled], kinds: [image.narrated]}
    walking: {requires: [generation.talk_motion.enabled], kinds: [comfy.wan_i2v]}
    camera_follow: {requires: [generation.talk_motion.enabled]}
    camera_push_in: {requires: [generation.talk_motion.enabled]}
    longcat: {requires: [generation.talk_profiles.longcat]}
    longcat16: {requires: [generation.talk_profiles.longcat16], kinds: [talk.longcat]}
    longcat_fast: {requires: [generation.talk_profiles.longcat_fast]}
    comfy_graph: {kinds: [comfy.graph]}   # any named ComfyUI workflow (policy comfy_graphs)
    hd720: {requires: [generation.talk_profiles.hd720]}
    dancing: {requires: [dance.enabled], kinds: [comfy.wan_animate2]}
    # The route comparison (plan perf_compare): the story_time edit grammar, and talking shots that perform a licensed
    # motion reference (Wan-Animate-2), then V2V lip sync.
    story_time: {requires: [generation.talk_edit.grammars.story_time]}
    borrowed_motion: {requires: [dance.enabled, generation.talk_motion.enabled, generation.borrowed_motion],
                      kinds: [comfy.wan_animate2]}
    reference_conditioning: {kinds: [image.qwen_edit]}
    captions: {requires: [burned_captions.enabled]}
    caption_styles: {requires: [burned_captions.styles]}
    hooks: {requires: [finishing.hook]}
    # On-screen labels and timestamps (on_screen_text), transitions on motion in the joiner (finishing.transitions),
    # room tone (sound.room_tone) and generated music beds (sound.music, off until its licence is accepted).
    labels: {requires: [on_screen_text.enabled]}
    timestamps: {requires: [on_screen_text.enabled]}
    cut_on_motion: {requires: [finishing.transitions]}
    room_tone: {requires: [sound.enabled, sound.room_tone]}
    music: {requires: [sound.enabled, sound.music.enabled]}
  # Long takes (manyworlds.long_take, plan `longtake`): where the finished take is measured on the control plane
  # (colour drift against the first frame and face identity, at each checkpoint; a checkpoint past the end is the
  # last frame), the frame size the mean colour is taken at, and whether the judge scores identity (one screen
  # call per take, ~$0.01).
  takes: {checkpoints_s: [0, 30, 60, 90], colour_sample_px: 64, identity: true}
  plans:
    # One item per capability and feature (the audit's 18, organised by what they exercise), with existing post
    # formats and handwritten shot sheets. Options: talk_profile (generation.talk_profiles, merged into the talk
    # jobs), voice_engine (kokoro | voxcpm: skipped unless the creator speaks with it). Bench extra: @anchor is the
    # creator's first reference image.
    default:
      creator: maren.afterhours
      items:
        - id: photo_propped_pose
          exercises: [photo, posing, camera_propped]
          format: photo
          caption: "late shift energy"
          body:
            scenes: ["standing in her small hallway in the evening, full body, one hand on her hip, the other in her jacket pocket"]
            shots:
              - set: {location: "her narrow apartment hallway", time_of_day: "evening", light_direction: "ceiling light and a lamp on her right", light_quality: "soft", color_temp: "warm"}
                framing: {shot_size: "full body", angle: "eye level", lens_mm: 26, device: propped, handheld: none}
                blocking: [{at_s: 0, action: "stands with one hand on her hip, weight on one leg", eyeline: lens}]
        - id: carousel_outfits_mirror
          exercises: [carousel, outfit_change, posing, camera_mirror]
          format: carousel
          caption: "three looks for one night out"
          body:
            scenes:
              - "mirror photo in her bedroom wearing a black slip dress, phone held at chest height"
              - "the same mirror wearing wide jeans and a cropped white tee, one hand in her hair"
              - "the same mirror in a long camel coat over a grey knit, looking down at her shoes"
            shots:
              - set: {location: "her bedroom, full-length mirror by the window", set_id: "bedroom_mirror", time_of_day: "evening", light_quality: "soft", color_temp: "warm lamp"}
                wardrobe: {outfit: "black satin slip dress, thin straps"}
                framing: {shot_size: "full body", device: selfie}
                blocking: [{at_s: 0, action: "holds the phone at chest height, small smile", eyeline: screen}]
              - set: {location: "her bedroom, full-length mirror by the window", set_id: "bedroom_mirror", time_of_day: "evening"}
                wardrobe: {outfit: "wide light-blue jeans, cropped white t-shirt"}
                framing: {shot_size: "full body", device: selfie}
                blocking: [{at_s: 0, action: "one hand in her hair, hip pushed out", eyeline: screen}]
              - set: {location: "her bedroom, full-length mirror by the window", set_id: "bedroom_mirror", time_of_day: "evening"}
                wardrobe: {outfit: "long camel coat over a grey knit jumper, black trousers"}
                framing: {shot_size: "full body", device: selfie}
                blocking: [{at_s: 0, action: "looks down at her shoes, coat open", eyeline: "off"}]
        - id: story_selfie
          exercises: [story, camera_selfie]
          format: story
          caption: ""
          body:
            scenes: ["selfie on a night bus, city lights blurred in the window behind her, tired half smile"]
            shots:
              - set: {location: "the upper deck of a night bus", time_of_day: "late night", light_quality: "mixed", color_temp: "cool window, warm interior"}
                framing: {shot_size: "close-up", device: selfie, lens_mm: 24, handheld: light}
                blocking: [{at_s: 0, action: "rests her head on the window, half smile", eyeline: lens}]
        - id: story_clip_prop
          exercises: [story_clip, prop_interaction]
          format: story_clip
          caption: "the only good part of a closing shift"
          body:
            scenes: ["at her kitchen counter late at night, pouring tea from a kettle into a big mug"]
            script: "she pours the tea slowly, then wraps both hands around the mug and smiles at the camera"
            shots:
              - set: {location: "her small galley kitchen", time_of_day: "late night", light_direction: "under-cabinet light", light_quality: "soft", color_temp: "warm", props: "a plain white kettle and a big mug"}
                framing: {shot_size: "medium shot", device: propped, camera_move: static}
                blocking:
                  - {at_s: 0, action: "pours tea from the kettle into the mug", eyeline: prop, hands: "one on the kettle handle, one steadying the mug"}
                  - {at_s: 3, action: "wraps both hands around the mug and looks up", eyeline: lens}
        - id: narrated_pov_broll
          exercises: [voiceover_broll, camera_pov]
          format: narrated_edit
          caption: "what a night off actually looks like"
          body:
            scenes:
              - "first-person view of her hands unlocking her apartment door at night, keys in hand"
              - "first-person view of a bowl of noodles on the sofa, a show paused on the laptop"
              - "first-person view of her window with the city lights outside, a mug on the sill"
            script: "Night off. Doors locked, phone on silent. Noodles, one episode, and I'm asleep before it ends. Honestly perfect."
            shots:
              - {cutaway: true, framing: {angle: "first-person POV", device: held}, blocking: [{at_s: 0, action: "her hands turn the key in the lock", eyeline: prop}]}
              - {cutaway: true, framing: {angle: "first-person POV", device: held}, blocking: [{at_s: 0, action: "her hand lifts noodles with chopsticks", eyeline: prop}]}
              - {cutaway: true, framing: {angle: "first-person POV", device: held}, blocking: [{at_s: 0, action: "her hand sets a mug on the window sill", eyeline: prop}]}
        - id: narrated_timestamps
          exercises: [voiceover_broll, camera_pov, timestamps, labels]
          format: narrated_edit
          caption: "a closing shift in four times"
          body:
            scenes:
              - "first-person view of a bar counter being wiped down, chairs up on the tables"
              - "first-person view of an empty street at night under orange street lights"
              - "first-person view of her front door opening onto a dark hallway"
            script: "Eleven forty, last table's gone. Twelve fifteen, the walk home. Twelve forty, finally. This is the whole glamorous life."
            on_screen_text: "11:40 PM close | 12:15 AM walk home | 12:40 AM home"
            shots:
              - {cutaway: true, framing: {angle: "first-person POV", device: held}, edit: {on_screen_text: "11:40 PM close"}}
              - {cutaway: true, framing: {angle: "first-person POV", device: held}, edit: {on_screen_text: "12:15 AM walk home"}}
              - {cutaway: true, framing: {angle: "first-person POV", device: held}, edit: {on_screen_text: "12:40 AM home"}}
        - id: talk_kokoro
          exercises: [talking, kokoro_voice, captions]
          format: talking_video
          caption: "unpopular opinion"
          options: {voice_engine: kokoro}
          body:
            scenes: ["sitting on her sofa in the evening, lamp light, talking to her propped phone"]
            script: "Okay, unpopular opinion. Going out on a Tuesday is better than any Saturday. Nobody's there, and the bartender actually talks to you."
        - id: talk_designed_voice
          exercises: [talking, designed_voice, captions]
          format: talking_video
          caption: "the tuesday rule"
          options: {voice_engine: voxcpm}
          body:
            scenes: ["sitting on her sofa in the evening, lamp light, talking to her propped phone"]
            script: "Okay, unpopular opinion. Going out on a Tuesday is better than any Saturday. Nobody's there, and the bartender actually talks to you."
        - id: talk_one_shot_30s
          exercises: [talking, long_take, camera_propped, makeup_interaction]
          format: talking_video
          caption: "five minute face for a twelve hour shift"
          body:
            scenes: ["at her bathroom mirror putting on mascara, talking to her propped phone, bright bathroom light"]
            shots:
              - set: {location: "her small white bathroom", time_of_day: "early evening", light_direction: "overhead and the mirror light", light_quality: "bright, flat", props: "a mascara wand"}
                framing: {shot_size: "medium close-up", device: propped, camera_move: static, lens_mm: 26}
                blocking:
                  - {at_s: 0, action: "holds up the mascara and starts talking", eyeline: lens}
                  - {at_s: 8, action: "leans toward the mirror and puts on mascara", eyeline: "off", hands: "mascara wand near her lashes"}
                  - {at_s: 20, action: "turns back to the phone and shrugs", eyeline: lens}
                performance:
                  energy: medium
                  lines:
                    - {text: "So this is the whole routine for a twelve hour shift, and it takes five minutes, I promise.", delivery: "casual, a bit fast"}
                    - {text: "Mascara first, because if I only get one thing done it's this. Two coats, that's it, no curler, I don't have the patience at six pm.", delivery: "matter of fact"}
                    - {text: "Then a bit of tint on the cheeks and I'm out the door. Is it perfect? No. Does anyone at the bar care? Also no.", delivery: "dry, amused"}
        - id: talk_two_shots_scene_change
          exercises: [talking, scene_change]
          format: talking_video
          caption: "before and after a shift"
          body:
            scenes:
              - "in her kitchen before work, early evening light, talking to her propped phone"
              - "back home on her sofa late at night, lamp light, hair down, talking to the same phone"
            shots:
              - set: {location: "her small galley kitchen", time_of_day: "early evening", light_direction: "window on her left"}
                framing: {shot_size: "medium shot", device: propped, camera_move: static}
                performance: {energy: high, lines: [{text: "Six pm, coffee number two, I'm ready for anything tonight.", delivery: "upbeat"}]}
              - set: {location: "her living room sofa", time_of_day: "late night", practical_lights: "a single warm lamp"}
                framing: {shot_size: "medium shot", device: propped, camera_move: static}
                look: {hair_style: "down and a bit messy"}
                performance: {energy: low, lines: [{text: "Two am. I take it back. I was not ready for anything.", delivery: "flat, tired, then a small laugh"}]}
        - id: talk_hybrid_cutaway
          exercises: [talking, cutaway_broll]
          format: talking_video
          caption: "the perfect late night snack"
          body:
            scenes:
              - "in her kitchen at night, talking to her propped phone"
              - "close-up of her hands drizzling honey on thick buttered toast on a plate"
              - "in her kitchen at night, taking a bite of toast and laughing"
            shots:
              - framing: {shot_size: "medium shot", device: propped}
                performance: {lines: [{text: "The best food after a late shift is not pizza. It's toast.", delivery: "confident"}]}
              - cutaway: true
                framing: {shot_size: "close-up", device: held}
                performance: {lines: [{text: "Thick bread, too much butter, honey on top.", delivery: "slow, savouring"}]}
              - framing: {shot_size: "medium shot", device: propped}
                blocking: [{at_s: 0, action: "takes a bite and laughs", eyeline: lens}]
                performance: {lines: [{text: "Fight me.", delivery: "playful"}]}
        - id: walk_and_talk
          exercises: [talking, walking, camera_follow]
          format: talking_video
          caption: "walk home thoughts"
          body:
            scenes: ["walking along a quiet street at night under street lights, talking to the phone she holds out in front of her"]
            shots:
              - set: {location: "a quiet residential street", time_of_day: "night", light_quality: "orange street lights", weather: "dry, cold"}
                framing: {shot_size: "medium shot", device: selfie, camera_move: follow, handheld: held}
                blocking: [{at_s: 0, action: "walks toward the camera, talking", eyeline: lens}]
                performance: {lines: [{text: "Walking home and thinking, why does every shift feel shorter on the walk back?", delivery: "musing, a little out of breath"}]}
        - id: talk_push_in
          exercises: [talking, camera_push_in]
          format: talking_video
          caption: "one thing nobody tells you"
          body:
            scenes: ["sitting at her kitchen table at night, leaning in to tell the camera a secret"]
            shots:
              - framing: {shot_size: "medium close-up", device: propped, camera_move: push_in}
                blocking: [{at_s: 0, action: "leans in toward the camera", eyeline: lens}]
                performance: {lines: [{text: "One thing nobody tells you about bar work. The regulars become your family.", delivery: "quiet, sincere"}]}
        - id: talk_longcat
          exercises: [talking, longcat]
          format: talking_video
          caption: "longcat check"
          options: {talk_profile: longcat}
          body:
            scenes: ["sitting on her sofa in the evening, lamp light, talking to her propped phone"]
            script: "Quick one. If a bartender remembers your order, tip them double. That's the rule."
        - id: talk_hd720
          exercises: [talking, hd720]
          format: talking_video
          caption: "close up"
          options: {talk_profile: hd720}
          body:
            scenes: ["close-up of her face on the sofa in warm lamp light, talking softly to her propped phone"]
            shots:
              - framing: {shot_size: "close-up", device: propped, camera_move: static}
                performance: {lines: [{text: "I'm saying this quietly because my neighbours are asleep. Best night of the week.", delivery: "whispered, smiling"}]}
        - id: talk_caption_styles
          exercises: [talking, captions, caption_styles, hooks]
          format: talking_video
          caption: "rate my closing playlist"
          body:
            scenes: ["standing behind an empty bar at closing, talking to her propped phone"]
            shots:
              - framing: {shot_size: "medium shot", device: propped}
                edit: {hook: "she points at the phone on the first word", caption_style: "tiktok_box", on_screen_text: [{kind: hook, text: "rate my closing playlist"}]}
                performance: {lines: [{text: "Closing playlist, rate it. Slow songs only, lights up, everybody out.", delivery: "bright, teasing"}]}
        - id: outfits_cut_on_motion
          exercises: [outfit_change, cut_on_motion, posing, camera_propped]
          format: talking_video
          caption: "three looks, one spin each"
          body:
            scenes:
              - "full body in her bedroom in a black slip dress, phone propped on the dresser"
              - "full body in the same bedroom in wide jeans and a white tee"
              - "full body in the same bedroom in a camel coat"
            shots:
              - set: {location: "her bedroom", set_id: "bedroom_mirror"}
                wardrobe: {outfit: "black satin slip dress"}
                framing: {shot_size: "full body", device: propped}
                blocking: [{at_s: 0, action: "spins once and poses", eyeline: lens}]
                performance: {lines: [{text: "Look one.", delivery: "bright"}]}
              - set: {location: "her bedroom", set_id: "bedroom_mirror"}
                wardrobe: {outfit: "wide light-blue jeans, white t-shirt"}
                framing: {shot_size: "full body", device: propped}
                edit: {transition_in: "cut on the spin"}
                blocking: [{at_s: 0, action: "spins once and poses", eyeline: lens}]
                performance: {lines: [{text: "Look two.", delivery: "bright"}]}
              - set: {location: "her bedroom", set_id: "bedroom_mirror"}
                wardrobe: {outfit: "long camel coat"}
                framing: {shot_size: "full body", device: propped}
                edit: {transition_in: "cut on the spin"}
                blocking: [{at_s: 0, action: "spins once and poses", eyeline: lens}]
                performance: {lines: [{text: "And three. Which one?", delivery: "bright, asking"}]}
        - id: story_clip_room_tone
          exercises: [story_clip, room_tone]
          format: story_clip
          caption: "rain on the window"
          body:
            scenes: ["curled up by her window at night with a blanket, rain on the glass, a candle on the sill"]
            script: "she pulls the blanket closer and watches the rain"
            shots:
              - set: {location: "her window seat", time_of_day: "night", weather: "rain", practical_lights: "a candle on the sill"}
                framing: {shot_size: "medium shot", device: propped, camera_move: static}
                sound: {mic: room, room_tone: "rain on the window, quiet flat", music: "soft lo-fi bed, low"}
        - id: narrated_music_bed
          exercises: [voiceover_broll, music]
          format: narrated_edit
          caption: "sunday reset"
          body:
            scenes: ["first-person view of her hands folding laundry on a bed in soft morning light"]
            script: "Sunday reset. Laundry, clean sheets, nothing else."
            shots:
              - {cutaway: true, framing: {angle: "first-person POV", device: held}, sound: {music: "soft acoustic bed, low"}}
        - id: dance_casual
          exercises: [dancing]
          bench: {kind: comfy.wan_animate2, jobs: 1, extra: {image_uri: "@anchor", reference: dance-casual}}
        - id: dance_twirl
          exercises: [dancing, posing]
          bench: {kind: comfy.wan_animate2, jobs: 1, extra: {image_uri: "@anchor", reference: twirl-dress}}
        - id: qwen_edit_bench
          exercises: [reference_conditioning]
          bench: {kind: image.qwen_edit, jobs: 2, extra: {images: ["@anchor"]}}
    # One ~90 s line, two ways (docs/research/2026-11-23-avatar-and-music-critic.md, "First test"): LongCat-Video-
    # Avatar 1.6 as one continuous take against our InfiniteTalk segment chain (30 s segments, each from the last
    # frame of the one before, joined). Both say the same line in the creator's designed voice (one shared
    # voice.speak job; skipped with the reason when the creator has none) from the same still (@anchor). The raw
    # takes are compared: no repairs. Run: mw test breadth --plan longtake [--dry-run]; mw test breadth-report <run>.
    longtake:
      max_usd: 2.7                 # owner-approved 2026-11-23: $3 for the 90 s test, incl. the voice design
      creator: maren.afterhours
      items:
        - id: talk_longcat16_90s
          exercises: [talking, long_take, designed_voice, longcat16]
          take:
            kind: talk.longcat
            profile: longcat16
            image: "@anchor"
            keyframes: 4
            prompt: &longtake_prompt >-
              A young woman with a warm, slightly tired smile sits on her sofa in the evening, lamp light from her
              right, talking to her phone propped on the coffee table, chest-up framing, natural head movement,
              small hand gestures, occasional glances away and back to the lens, real phone footage
            script: &longtake_script >-
              Okay, story time, because tonight was a lot. So I'm closing the bar, it's just me and the regulars,
              and this guy I've never seen before walks in at five to two and asks for a cup of tea. Not a drink.
              Tea. And I'm about to say we're closed, but he looks like he's had the worst day of his life, so I put
              the kettle on. He sits at the end of the bar and doesn't say a word for ten minutes. Then he tells me
              it's his first night back in the city in twelve years, and this used to be his dad's bar. His dad. The
              guy who ran this place before the owners I work for. He points at a scratch on the counter and says he
              made it with a bottle opener when he was nine, and he got grounded for a month. I've wiped that
              scratch about a thousand times and never thought about it once. So we're just sitting there, and the
              regulars start telling him stories about his dad, and he's laughing, and then he's crying a little, and
              honestly so am I. He finished his tea, left a twenty under the cup, and said he'd come back on Friday.
              Anyway. That's why I love this job. Tell me the best thing a stranger has ever said to you.
        - id: talk_chain_90s
          exercises: [talking, long_take, designed_voice]
          take:
            kind: talk.infinitetalk
            max_segment_seconds: 30
            image: "@anchor"
            keyframes: 4
            prompt: *longtake_prompt
            script: *longtake_script
    # The talking-video route comparison (owner 2026-11-24: "the same video basically with Maren, cut how we'd actually
    # cut it ... pick the best handful of production approaches and I can judge for myself", 30-45 s). One ~40 s
    # story-time script, the story_time edit grammar (punch-ins at word gaps, two faceless cutaways under her voice),
    # made two ways (a third, borrowed motion, was dropped 2026-11-25: its seven stock clips came back as the stock
    # performers, identity 0-1, and were deleted). The items share body.shared_key, so they share their scene photos
    # and voice line (one job each:
    # production.common.piece_key) and seeds: only the talking route differs. Each talking line is at most ~12 words.
    #   v1: InfiniteTalk lip sync from each shot's photo (the current stack).
    #   v2: LongCat-Video-Avatar 1.6 per shot (talk profile longcat16: params.model longcat_native).
    perf_compare:
      max_usd: 6                    # owner-approved 2026-11-24: about $4 for the three versions
      creator: maren.afterhours
      # Off the 150 GB weights volume (full since the 90 s LongCat test, 2026-11-24): the merged machine downloads its
      # weights onto its own disk (autoscale.merged_image sizes it for every member).
      pools:
        talk: [runpod_secure_l40s]
        comfy: [runpod_secure_l40s]
        voice: [runpod_secure_l40s]
        dance: [runpod_secure_l40s]
        edit: [runpod_secure_l40s, runpod_secure_h100]
        image: [runpod_comm_3090, runpod_comm_4090, vast_3090, vast_4090]
      items:
        - id: perf_v1_infinitetalk
          exercises: [talking, story_time, cutaway_broll, designed_voice]
          format: talking_video
          caption: "the tea guy"
          body: &perf_body
            shared_key: perf-compare
            edit_grammar: story_time
            scenes: &perf_scenes
              - "behind the bar of a small dim pub at closing time, leaning on the counter, talking to her phone propped on the bar"
              - "behind the bar at closing time, eyebrows raised, talking to her phone propped on the bar"
              - "behind the bar at closing time, laughing in disbelief, talking to her phone propped on the bar"
              - "close-up of her hands filling a battered steel kettle at the bar sink, warm bar light, no face"
              - "behind the bar at closing time, leaning in close to her phone, serious, talking quietly"
              - "close-up of an old scratch in a worn wooden bar counter, a fingertip tracing it, warm bar light, no face"
              - "behind the bar at closing time, shaking her head with a small smile, talking to her phone"
              - "behind the bar at closing time, holding up a folded twenty, talking to her phone"
              - "behind the bar at closing time, smiling warmly at her phone, wiping the counter"
            shots:
              - &perf_s0
                set: &perf_set {location: "behind the bar of a small, dim neighbourhood pub at closing time", set_id: "pub_bar", time_of_day: "night", light_quality: "warm low bar lights, a neon sign behind her", color_temp: "warm"}
                wardrobe: &perf_wardrobe {outfit_id: "bar_black_tee", outfit: "a plain black t-shirt, a dark apron tied at the waist", state: "end of a long shift"}
                framing: {shot_size: "medium shot", angle: "eye level", device: propped, handheld: none}
                blocking: [{at_s: 0, action: "leans on the counter and starts the story", eyeline: lens}]
                edit: {hook: "she starts mid-thought", on_screen_text: [{kind: hook, text: "the tea guy"}]}
                performance: {lines: [{text: "Okay, story time. Five to two, I'm closing up.", delivery: "conspiratorial, amused"}]}
              - &perf_s1
                set: *perf_set
                wardrobe: *perf_wardrobe
                framing: {shot_size: "medium close-up", angle: "eye level", device: propped, handheld: none}
                blocking: [{at_s: 0, action: "raises her eyebrows", eyeline: lens}]
                performance: {lines: [{text: "And this guy walks in. Never seen him before.", delivery: "intrigued"}]}
              - &perf_s2
                set: *perf_set
                wardrobe: *perf_wardrobe
                framing: {shot_size: "medium shot", angle: "eye level", device: propped, handheld: none}
                blocking: [{at_s: 0, action: "laughs and throws a hand up", eyeline: lens}]
                performance: {lines: [{text: "Doesn't want a drink. Wants tea. At a bar!", delivery: "incredulous, laughing"}]}
              - &perf_s3
                cutaway: true
                set: *perf_set
                framing: {shot_size: "close-up", angle: "high angle", device: held, handheld: held}
                performance: {lines: [{text: "He looked so done with life, I just put the kettle on.", delivery: "softer"}]}
              - &perf_s4
                set: *perf_set
                wardrobe: *perf_wardrobe
                framing: {shot_size: "close-up", angle: "eye level", device: propped, handheld: none}
                blocking: [{at_s: 0, action: "leans in close and lowers her voice", eyeline: lens}]
                performance: {lines: [{text: "Ten minutes, he says nothing. Then: my dad owned this place.", delivery: "quiet, serious"}]}
              - &perf_s5
                cutaway: true
                set: *perf_set
                framing: {shot_size: "extreme close-up", angle: "high angle", device: held, handheld: held}
                performance: {lines: [{text: "He points at this scratch. Says he made it when he was nine.", delivery: "tender"}]}
              - &perf_s6
                set: *perf_set
                wardrobe: *perf_wardrobe
                framing: {shot_size: "medium close-up", angle: "eye level", device: propped, handheld: none}
                blocking: [{at_s: 0, action: "shakes her head, half smiling", eyeline: lens}]
                performance: {lines: [{text: "I've wiped that scratch, like, a thousand times. Never noticed.", delivery: "wry"}]}
              - &perf_s7
                set: *perf_set
                wardrobe: *perf_wardrobe
                framing: {shot_size: "medium shot", angle: "eye level", device: propped, handheld: none}
                blocking: [{at_s: 0, action: "holds up a folded note", eyeline: lens}]
                performance: {lines: [{text: "He left a twenty under the cup. Said he'd be back Friday.", delivery: "warm"}]}
              - &perf_s8
                set: *perf_set
                wardrobe: *perf_wardrobe
                framing: {shot_size: "medium close-up", angle: "eye level", device: propped, handheld: none}
                blocking: [{at_s: 0, action: "smiles, wiping the counter", eyeline: lens}]
                performance: {lines: [{text: "Honestly? Best night of the week.", delivery: "warm, signing off"}]}
        - id: perf_v2_longcat
          exercises: [talking, story_time, cutaway_broll, designed_voice, longcat16]
          format: talking_video
          caption: "the tea guy"
          options: {talk_profile: longcat16}
          body: *perf_body
    # Candidate models against our baselines (docs/research/2026-11-24-video-candidates.md; owner 2026-11-24: "least
    # net new code; models should slot into existing workflows"). Each candidate says three of perf_compare's lines
    # (natural conversation, expressive hand gestures, a lifestyle scene) from the creator's reference photo, as one
    # take each (manyworlds.long_take): the SAME audio perf_compare voiced (audio @shared:perf-compare: its finished
    # voice.speak line whose words match the script; nothing is voiced again, so perf_compare must have run; the dry
    # run says MISSING otherwise). Baselines are perf_compare's own outputs (v1 InfiniteTalk, v2 LongCat 1.6): those
    # were made from the bar scene photos, these from the reference photo, so compare motion, sync, identity and
    # speed, not the set. Each take is pinned to its candidate's card:
    #   echomimic_v3_flash  comfy.graph, RTX 4090 (24 GB; claimed 12 GB)
    #   ltx25_a2v           comfy.graph, L40S 48 GB (int8; gated weights: needs HF_TOKEN)
    #   ltx25_i2v_av        comfy.graph, L40S: the lifestyle line only, in the model's own voice (audio none)
    #   longcat_fast        talk.infinitetalk with talk profile longcat_fast (LongCat 1.0 + the portable speed-ups), 5090
    # Run: mw test breadth --plan candidates --dry-run, then (owner's go) mw test breadth --plan candidates;
    # mw test breadth-report <run>. Per take (render, download and server-start seconds, peak VRAM, cold or warm, lip
    # sync): its long_take asset's segments[].bench.
    candidates:
      max_usd: 2                    # NOT owner-approved yet: dry run ~$0.85 (2026-11-24) plus idle tails and one retry
      creator: maren.afterhours
      pools:                        # the takes pin their own pools; nothing else in this plan runs
        talk: [runpod_secure_l40s]
        comfy: [runpod_secure_l40s]
      items:
        - id: echo_natural
          exercises: [talking, comfy_graph]
          take: &cand_natural
            kind: comfy.graph
            graph: echomimic_v3_flash
            pools: [vast_4090, runpod_comm_4090]
            audio: "@shared:perf-compare"
            image: "@anchor"
            keyframes: 4
            prompt: &natural_prompt >-
              A young woman leans toward her phone propped in front of her and starts a story, conspiratorial and
              amused, chest-up framing, natural head movement, small hand gestures, real phone footage
            script: &natural_line "Okay, story time. Five to two, I'm closing up."
        - id: echo_gestures
          exercises: [talking, comfy_graph]
          take: &cand_gestures
            <<: *cand_natural
            prompt: &gestures_prompt >-
              A young woman laughs in disbelief as she talks to her phone camera and throws one hand up, then both
              hands open, expressive hand gestures, medium shot, real phone footage
            script: &gestures_line "Doesn't want a drink. Wants tea. At a bar!"
        - id: echo_lifestyle
          exercises: [talking, comfy_graph]
          take: &cand_lifestyle
            <<: *cand_natural
            prompt: &lifestyle_prompt >-
              A young woman wipes the counter in front of her with a cloth while she talks to her phone camera,
              smiling warmly, relaxed, end of a long shift, medium close-up, real phone footage
            script: &lifestyle_line "Honestly? Best night of the week."
        - id: ltx_a2v_natural
          exercises: [talking, comfy_graph]
          take: {<<: *cand_natural, graph: ltx25_a2v, pools: [runpod_secure_l40s]}
        - id: ltx_a2v_gestures
          exercises: [talking, comfy_graph]
          take: {<<: *cand_gestures, graph: ltx25_a2v, pools: [runpod_secure_l40s]}
        - id: ltx_a2v_lifestyle
          exercises: [talking, comfy_graph]
          take: {<<: *cand_lifestyle, graph: ltx25_a2v, pools: [runpod_secure_l40s]}
        - id: ltx_i2v_av_lifestyle
          exercises: [talking, comfy_graph]
          take:
            <<: *cand_lifestyle
            graph: ltx25_i2v_av
            pools: [runpod_secure_l40s]
            audio: none
            prompt: >-
              A young woman wipes the counter in front of her with a cloth while she talks to her phone camera,
              smiling warmly, relaxed, end of a long shift, medium close-up, real phone footage. She says, warm and
              a little tired: "Honestly? Best night of the week."
        - id: longcat_fast_natural
          exercises: [talking, longcat_fast]
          take: &cand_longcat
            kind: talk.infinitetalk
            profile: longcat_fast
            pools: [vast_5090]
            audio: "@shared:perf-compare"
            image: "@anchor"
            keyframes: 4
            prompt: *natural_prompt
            script: *natural_line
        - id: longcat_fast_gestures
          exercises: [talking, longcat_fast]
          take: {<<: *cand_longcat, prompt: *gestures_prompt, script: *gestures_line}
        - id: longcat_fast_lifestyle
          exercises: [talking, longcat_fast]
          take: {<<: *cand_longcat, prompt: *lifestyle_prompt, script: *lifestyle_line}
