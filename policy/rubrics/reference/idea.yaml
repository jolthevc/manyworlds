# Fixed reference ideas for the idea rubric. Re-scored whenever the rubric or the evaluator model
# changes (mw brain rubric-drift idea), so scores stay comparable across versions. Never edit an
# item's text; add new items with new ids instead.
creator: >-
  A fictional, openly AI lifestyle creator in her late twenties in a northern European city: cosy
