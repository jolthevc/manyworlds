# The test suite in the cloud on every push: nothing depends on the owner's laptop to verify a change.
# Tests stub Claude, Apify, Instagram and providers; no secrets are used here (logs are public).
name: tests
on:
  push:
    branches: ["**"]
  pull_request:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mw
          POSTGRES_PASSWORD: mw
          POSTGRES_DB: manyworlds
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mw -d manyworlds" --health-interval 2s --health-retries 30
      # the local S3 stand-in (docker-compose.yml): presigned worker storage round-trips through it (test_presigned_storage.py)
      s3:
        image: adobe/s3mock:latest
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: manyworlds
          initialBuckets: manyworlds
        ports: ["9090:9090"]
    env:
      DATABASE_URL: postgresql://mw:mw@localhost:5432/manyworlds
      MW_POLICY: policy/default.yaml
      MW_POOL: local
      MW_TEST_S3_ENDPOINT: http://localhost:9090
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[test]"
      - name: pytest
        run: |
          set -o pipefail
          pytest -q -rfE --tb=line --timeout=120 2>&1 | tee pytest.txt
      - name: failures as annotations (readable without log access)
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR) |^E  |^/.*:[0-9]+: |Timeout" pytest.txt | head -60 | sed 's/^/::error::/'
