# Deploy the control plane to Fly.io (fly.toml) after the tests pass on main. Built on Fly's remote
# builder, one machine per process group. Needs the FLY_API_TOKEN secret (a deploy token for
# manyworlds-mw); without it the job is skipped. What runs stays gated by policy operations.mode.
name: deploy
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-fly
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  fly:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Skip without a token
        if: env.FLY_API_TOKEN == ''
        run: echo "::warning::FLY_API_TOKEN is not set; not deploying"
      - uses: actions/checkout@v4
        if: env.FLY_API_TOKEN != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only --ha=false --wait-timeout 300
