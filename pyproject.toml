[project]
name = "manyworlds"
version = "0.1.0"
description = "Autonomous research and production engine for openly AI-generated creators"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "boto3>=1.34",
    "anthropic>=0.75",
    "pydantic>=2.7",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# GPU worker extras. Each worker image installs exactly one of these.
# brotli>=1.2: huggingface_hub's HTTP client passes output_buffer_limit to the Brotli decoder;
# with 1.1 every compressed response fails ("process() takes no keyword arguments").
# The image worker image also renders story clips (Wan), which needs ftfy and imageio.
image = ["torch>=2.7", "brotli>=1.2", "kokoro>=0.9", "soundfile", "diffusers>=0.36", "transformers>=4.51", "accelerate>=1.6", "peft>=0.15", "safetensors", "pillow", "imageio[ffmpeg]", "ftfy"]
video = ["torch>=2.7", "brotli>=1.2", "diffusers>=0.36", "transformers>=4.51", "accelerate>=1.6", "peft>=0.15", "safetensors", "pillow", "imageio[ffmpeg]", "ftfy"]
tts = ["torch>=2.7", "brotli>=1.2", "kokoro>=0.9", "soundfile", "numpy"]

[project.scripts]
mw = "manyworlds.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["manyworlds*"]

[tool.setuptools.package-data]
manyworlds = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
